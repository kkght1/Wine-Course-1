<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F4">
<meta name="color-scheme" content="only light">
<title>The Cellar Course · A Personal Wine Curriculum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 color-scheme:only light;
  --ink:#241B21; --paper:#FBF9F4; --card:#FFFFFF;
  --garnet:#7C2D3A; --garnet-deep:#5A2030; --gold:#A8772E; --vine:#55624B;
  --line:#E8E1D5; --muted:#84776D; --soft:#F3EEE4;
  --chip-on:#7C2D3A; --good:#3E6B4F; --bad:#9C3D2E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html{background:#FBF9F4}
body{font-family:'Libre Franklin',-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 64px}
.serif{font-family:'Fraunces',Georgia,serif}
.eyebrow{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rule{border:none;border-top:1px solid var(--line);margin:4px 0 0;position:relative}
.rule::after{content:'';display:block;border-top:1px solid var(--line);margin-top:2px}
header.site{padding:34px 0 18px;text-align:center}
header.site h1{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;line-height:1.1;letter-spacing:-.01em}
header.site .sub{color:var(--muted);font-size:.85rem;margin-top:8px}
.crest{width:46px;height:46px;border-radius:50%;margin:0 auto 12px;background:radial-gradient(circle at 35% 30%, #A4485A 0%, #7C2D3A 45%, #471823 100%);box-shadow:inset 0 0 0 3px rgba(251,249,244,.25), 0 2px 10px rgba(90,32,48,.35)}
.progressbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--garnet),var(--gold));border-radius:3px;transition:width .4s}
.progress-label{font-size:.75rem;color:var(--muted);text-align:center}
.modlist{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.modcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative}
.modcard:active{transform:scale(.985)}
.modcard .no{font-family:'Fraunces',serif;font-size:.78rem;color:var(--garnet);font-weight:600;letter-spacing:.14em}
.modcard h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;margin:2px 0 3px}
.modcard .desc{font-size:.83rem;color:var(--muted)}
.modcard .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:.66rem;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--soft)}
.badge.cellar{background:#EDF0E7;color:var(--vine);border-color:#D6DCCB}
.badge.buy{background:#F6ECE9;color:var(--garnet);border-color:#E8D3CE}
.badge.done{background:var(--vine);color:#fff;border-color:var(--vine)}
.badge.quizscore{background:#F4EBDD;color:var(--gold);border-color:#E6D7BC}
.intro-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px;font-size:.88rem}
.intro-card h2{font-family:'Fraunces',serif;font-size:1.05rem;margin-bottom:8px}
.intro-card p{margin-bottom:8px;color:#4d443e}
.intro-card p:last-child{margin-bottom:0}
.navrow{display:flex;gap:10px;margin-top:18px}
.navcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;font-family:inherit;text-align:left}
.navcard .nt{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;color:var(--garnet)}
.navcard .nd{font-size:.72rem;color:var(--muted);margin-top:2px}
.marker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.marker .mname{font-weight:700;font-size:.88rem;color:var(--garnet)}
.marker .mpoints{font-size:.8rem;color:var(--gold);font-weight:600;margin:2px 0 4px}
.marker .mnote{font-size:.83rem;color:#4d443e}
.mgroup{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;margin:22px 0 10px}
/* Module view */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--garnet);font-weight:600;font-size:.85rem;text-decoration:none;padding:18px 0 6px;cursor:pointer;background:none;border:none;font-family:inherit}
.modhead{padding:6px 0 14px;text-align:center}
.modhead .no{font-family:'Fraunces',serif;color:var(--garnet);letter-spacing:.2em;font-size:.8rem;font-weight:600}
.modhead h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.65rem;line-height:1.15;margin:6px 0 6px}
.modhead .sub{color:var(--muted);font-size:.86rem;max-width:46ch;margin:0 auto}
.tabs{position:sticky;top:0;z-index:20;display:flex;background:var(--paper);border-bottom:1px solid var(--line);margin:8px -18px 0;padding:0 10px}
.tabs button{flex:1;border:none;background:none;font-family:inherit;font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted);padding:12px 2px 10px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--garnet);border-bottom-color:var(--garnet)}
section.pane{padding-top:18px}
.obj{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:18px}
.obj h4{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.obj ol{padding-left:18px;font-size:.88rem}
.obj li{margin-bottom:5px}
.lesson h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;margin:22px 0 8px}
.lesson p{font-size:.92rem;margin-bottom:11px;color:#3b332e}
.winecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.winecard .src{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.winecard .src.cellar{color:var(--vine)} .winecard .src.buy{color:var(--garnet)}
.winecard h4{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;margin:3px 0 2px}
.winecard .role{font-size:.83rem;color:var(--muted);margin-bottom:8px}
.winecard .sku{font-size:.75rem;color:var(--gold);font-weight:600}
.steps{margin:10px 0 0;padding-left:0;list-style:none}
.steps li{font-size:.87rem;padding:8px 0;border-top:1px dashed var(--line);color:#3b332e}
.steps li b{color:var(--garnet)}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
.btn.primary{background:var(--garnet);color:#fff}
.btn.ghost{background:var(--soft);color:var(--garnet)}
.btn.small{padding:8px 12px;font-size:.78rem}
/* Tasting sheet */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0 22px}
.sheet h5{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--ink);padding:6px 10px;border-radius:6px;margin:16px 0 10px}
.sheet h5:first-child{margin-top:0}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:7px 13px;font-size:.8rem;font-family:inherit;cursor:pointer;color:#4d443e;min-height:34px}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff;font-weight:600}
.chip.swatch{padding-left:28px;position:relative}
.chip.swatch::before{content:'';position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sheet textarea,.sheet input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 10px;font-family:inherit;font-size:.86rem;color:var(--ink)}
.sheet textarea{min-height:54px;resize:vertical}
.savebar{display:flex;gap:10px;align-items:center;margin-top:14px}
.saved-note{font-size:.75rem;color:var(--good);font-weight:600}
/* Answer key */
.keybox{border:1px solid #E6D7BC;background:#FBF6EC;border-radius:12px;margin:6px 0 26px;overflow:hidden}
.keybox>button{width:100%;text-align:left;background:none;border:none;font-family:inherit;font-weight:700;font-size:.82rem;color:var(--gold);padding:13px 16px;cursor:pointer;letter-spacing:.04em}
.keybody{padding:2px 16px 14px;font-size:.86rem;display:none}
.keybox.open .keybody{display:block}
.keybody dt{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:10px 0 3px}
.keybody dd{margin:0;color:#4d443e}
/* Quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q .qn{font-size:.68rem;font-weight:700;letter-spacing:.15em;color:var(--garnet);text-transform:uppercase;margin-bottom:6px}
.q .qt{font-size:.92rem;font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:.86rem;cursor:pointer;color:#3b332e}
.opt.picked-right{background:#EDF3EC;border-color:var(--good);color:var(--good);font-weight:600}
.opt.picked-wrong{background:#F8ECE8;border-color:var(--bad);color:var(--bad);font-weight:600}
.opt.reveal-right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.explain{display:none;font-size:.82rem;color:#5a4f47;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:10px}
.q.answered .explain{display:block}
.quizfoot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-top:6px}
.quizfoot .score{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--garnet)}
.reading{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.reading h4{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--vine);margin-bottom:9px}
.reading li{font-size:.86rem;margin:0 0 7px 18px;color:#3b332e}
.note{font-size:.78rem;color:var(--muted);font-style:italic;margin:10px 0}
.divider{text-align:center;color:var(--gold);font-size:.9rem;letter-spacing:.5em;margin:26px 0 6px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const COURSE = { modules: [
{ id:1, no:"Module One", title:"Recalibration: The Systematic Approach", subtitle:"Rebuild the tasting method from your Wines 1 foundation — structure first, flavour second.",
  bottles:{cellar:2, buy:0},
  objectives:[
    "Run the full GBC-style systematic evaluation (appearance → nose → palate → conclusions) without prompts.",
    "Rate acidity, tannin, alcohol and body on the 5-point scale using physical cues, not flavour impressions.",
    "Explain the difference between intensity, complexity, and quality — and assess length accurately.",
    "Set up a repeatable solo Coravin tasting protocol you'll use all course."
  ],
  lesson:[
   {h:"Why structure comes before flavour", p:[
    "Flavour descriptors (blackcurrant, brioche, wet stone) are the fun part, but they're also the least reliable part of tasting — they vary with your mood, the food you just ate, and the suggestion of whatever's on the label. Structure doesn't lie. Acidity, sweetness, tannin, alcohol, and body are physical, measurable properties, and they're the spine of every blind deduction you'll make in this course. A wine with searing acidity and no tannin is telling you something true about grape and climate before you've named a single fruit.",
    "Your GBC sheet was built on exactly this logic, and the digital sheet in the Taste tab reproduces it: every dimension on a 5-point scale (Low / Med− / Med / Med+ / High), assessed in order, every time. The discipline of always going in the same order is what makes your notes comparable across months."
   ]},
   {h:"The physical cues, dimension by dimension", p:[
    "Acidity: it's not tartness of flavour, it's salivation. Take a sip, swallow, tilt your head forward slightly and notice how much your mouth waters along the sides of your tongue. A gushing response is high acid; a quick dry-up is low. Cool climates and early picking mean high acid — this is your first climate clue in any blind tasting.",
    "Tannin: drag your tongue across your upper gum after swallowing. Tannin is the drying, grippy, suede-like sensation there — texture, not taste. Note both quantity (none → hard) and quality (silky, dusty, chewy, green). Tannin comes from skins, seeds, stems and oak, so whites pressed off their skins have little to none.",
    "Alcohol: the warmth in your throat and chest after swallowing, and viscosity in the glass (slow, thick tears suggest higher alcohol or sugar). Under ~12.5% reads low; 13–13.9% medium; 14%+ high. Alcohol is fermented sugar, and sugar is sunshine — so alcohol is your second climate clue.",
    "Body: the overall weight of the wine in your mouth. The classic calibration is milk: skim (light), 2% (medium), whole (full). Body is the sum of alcohol, sugar, extract and tannin — it is a conclusion, not an ingredient.",
    "Sweetness: assessed at the very tip of the tongue in the first second of the sip. Most table wine is dry (below ~4 g/L). Be careful: ripe fruit flavour reads as 'sweet' to the brain even in bone-dry wine. If your mouth waters more than it sugars, it's drier than you think."
   ]},
   {h:"Intensity, complexity, length — and what quality actually means", p:[
    "Intensity is volume: how loudly the aromas and flavours speak. Complexity is vocabulary: how many distinct things are speaking (fruit plus floral plus earth plus oak plus mineral beats fruit alone). Length is how long the flavours — not the alcohol burn or the tannin grip — persist after you swallow. Count seconds honestly: under 5 is short, 5–10 medium, 10–20 med+, beyond that long.",
    "A useful quality shorthand is BLIC: Balance (do acid, fruit, alcohol, tannin sit in proportion?), Length, Intensity, Complexity. A simple wine can be perfectly balanced and still simple; a complex wine that's hot and disjointed is flawed. Practise saying out loud why a wine is good or merely fine — that articulation is the skill."
   ]},
   {h:"The kitchen aroma gym", p:[
    "Most 'bad noses' are really untrained vocabularies: you smell the thing, but the word doesn't surface. The fix is embarrassingly low-tech. Raid your kitchen for the course's core aroma library: vanilla extract, clove, black peppercorns (crack them), a strip of green bell pepper, blackcurrant jam, honey, a cut lemon and lime, a ripe peach or tinned apricot, fresh-cut grass or parsley, button mushroom, a piece of toast, dill, shredded coconut, and a wet stone or piece of slate from the garden. Smell each one with eyes closed and say its name out loud — you're building the retrieval pathway, not the detection one.",
    "Then play blind: have Vince hold five under your nose in random order. Most people score 2/5 on day one and 5/5 within two weeks — that improvement is real, fast, and transfers directly to the glass. Re-run a five-item round before each module's first sitting as a 60-second warm-up. Every marker in this course (pepper for Syrah, blackcurrant for Cabernet, coconut-dill for American oak, bell pepper for pyrazines) lives in your kitchen first."
   ]},
   {h:"Your solo Coravin protocol", p:[
    "Pour 60–75 mL per wine per sitting — that's a generous tasting pour, and it lets one bottle serve 8–10 sittings. Always taste whites at the correct temperature: pull from the fridge 15 minutes before for aromatic whites (8–12°C), 30 minutes for oaked whites (12–16°C). Reds in a warm Toronto kitchen are usually too warm: 20 minutes in the fridge gets a red to a proper 16–18°C.",
    "Taste in daylight or neutral light against a white surface (paper towel works), no candles, no cooking smells, ideally before dinner rather than after. Use the same glass shape for comparisons. Fill in the sheet before you check the answer key — committing to a call is how calibration happens. Argon-preserved wine genuinely holds for weeks, but aromatic intensity slowly fades, so front-load the 'first impression' work in sittings one and two."
   ]}
  ],
  wines:[
   {name:"Willm Pinot Gris Réserve, Alsace", src:"cellar", role:"White calibration wine — medium-plus body, moderate acid, rich texture. You'll re-taste it properly in Module 4.",
    sku:"From your cellar",
    key:{appearance:"Bright, clear; straw with a faint gold tint; medium intensity; medium to med+ viscosity (Alsace PG carries weight).",
     nose:"Clean, med+ intensity. Stone fruit (ripe pear, yellow peach), honey, a little baked apple and ginger spice. No oak. A faint smoky, stony note is classic Alsace.",
     palate:"Dry to off-dry (Alsace PG often carries a few grams of sugar — test the tongue tip). Acidity medium; alcohol med+ (often 13–14%); body med+. Finish medium+.",
     conclusions:"France · Alsace · Pinot Gris · 1–3 years (drink fresh-ish) · serve 8–12°C. Food: roast chicken, onion tart, mild curry.",
     tips:"The teaching point: notice how richness and a whisper of sugar can read as 'full body'. Compare your salivation response here vs the red — PG should water your mouth noticeably less than a high-acid white like your Sancerre will in Module 3."}},
   {name:"Parajes del Valle Monastrell, Jumilla", src:"cellar", role:"Red calibration wine — your tannin and alcohol reference point. It returns as a star in Module 7.",
    sku:"From your cellar",
    key:{appearance:"Deep ruby with violet glints, youthful rim, med+ to high viscosity.",
     nose:"Clean, med+ intensity. Black fruit (blackberry, black plum), dried herbs (the Spanish monte/garrigue note), cocoa, a meaty edge. Minimal or no new oak on this cuvée.",
     palate:"Dry; alcohol med+ to high (14%+ — feel the warmth); tannin medium, ripe and slightly rustic; acidity medium (warm climate!); body full. Black fruit, liquorice. Finish med+.",
     conclusions:"Spain · Murcia · Jumilla · Monastrell · 1–3 years · serve 16–18°C. Food: lamb, grilled sausages, anything off the barbecue.",
     tips:"Use this bottle to anchor the top of your scales: this is what med+/high alcohol and full body feel like. If you rated it medium across the board, recalibrate — Jumilla sunshine is about as generous as it gets."}}
  ],
  plan:[
   "<b>Sitting 1 (white):</b> Pour the Pinot Gris. Run the full sheet top to bottom, slowly — 15 minutes minimum. Say each rating out loud before tapping it.",
   "<b>Sitting 2 (red):</b> Same drill with the Monastrell. Then pour 30 mL of each side by side and compare ONLY structure: acid (salivation), body, alcohol warmth, finish length.",
   "<b>Aroma gym (10 min, before Sitting 1):</b> assemble the kitchen aroma library from the lesson and do one open round (smell + name aloud) and one blind round of five with Vince. Repeat a quick blind five before each future module.",
   "<b>Optional calibration drill:</b> dissolve a pinch of sugar in water and a squeeze of lemon in another glass; sip each, then re-taste the PG. Feel how acid and sugar pull against each other — this is the single most useful palate exercise in wine.",
   "<b>Sitting 3 (consolidation, 2–3 days later):</b> Re-taste either wine blind-ish (have Vince pour, or pour without looking at which Coravin'd bottle). Fill the sheet, then compare to your earlier notes. Consistency, not correctness, is the goal this week."
  ],
  reading:[
   "Wine Bible: Part One, 'Mastering Wine' — the sections on how to taste, and on acidity/tannin/body.",
   "Wine Folly: the opening 'Wine Tasting' and 'Taste the Difference' spreads (traits, intensity scales).",
   "World Atlas of Wine: the introduction — 'The World of Wine' and the climate/terroir spreads. Skim now; it pays off every module."
  ],
  quiz:[
   {q:"You taste a wine and your mouth floods with saliva along the sides of your tongue for several seconds. What did you just measure?", o:["Sweetness","Acidity","Tannin","Minerality"], a:1, e:"Salivation is the physical response to acid. It's the most reliable structural cue you have, and it works even when flavour descriptors fail you."},
   {q:"Tannin is best assessed by…", o:["The bitterness on the back of the tongue","The drying, grippy feel on your gums and inner cheeks","How dark the wine looks","The burn in your throat"], a:1, e:"Tannin is texture — astringency that dries the gums. Bitterness is a taste; the throat burn is alcohol; colour correlates loosely but lies often."},
   {q:"A wine is 14.8% alcohol with soft acidity and very ripe black fruit. Before naming any grape, what can you reasonably conclude?", o:["It's old","It grew in a warm, sunny climate","It's oaked","It's from Europe"], a:1, e:"Alcohol is fermented sugar and sugar is sunshine. High alcohol + low acid + very ripe fruit = warm climate. This deduction chain runs through every module."},
   {q:"Which of these is a CONCLUSION you build from other observations, rather than a directly measured component?", o:["Acidity","Sweetness","Body","Alcohol warmth"], a:2, e:"Body is the sum of alcohol, sugar, extract and tannin — you judge it as overall weight, like skim vs whole milk."},
   {q:"In the BLIC quality framework, a wine that shows lemon, green apple, oyster shell, smoke, and a yeasty cream note all at once scores high on…", o:["Balance","Length","Intensity","Complexity"], a:3, e:"Complexity is the number of distinct aroma/flavour families speaking at once — fruit + mineral + autolytic here. Intensity is how loud; complexity is how many."},
   {q:"You swallow and the fruit flavour persists about 15 seconds before fading. On the GBC finish scale that's…", o:["Short","Medium","Med+","Long"], a:2, e:"Roughly: under 5s short, 5–10 medium, 10–20 med+, 20+ long. Time the flavour, not the alcohol heat or tannin grip."},
   {q:"Why does this course have you fill in the tasting sheet BEFORE opening the answer key?", o:["To save battery","Because committing to a call, then checking, is how calibration happens","The key is often wrong","To practise typing"], a:1, e:"If you peek first, you'll 'find' whatever the key says. Prediction → feedback is the learning loop."},
   {q:"Your red has been sitting in a 23°C kitchen. Best move before tasting?", o:["Taste immediately — room temp is correct for red","20 minutes in the fridge to reach 16–18°C","Add an ice cube","Microwave the glass briefly"], a:1, e:"'Room temperature' meant a Burgundian cellar-cool room. Warm red tastes soupy and alcoholic; 16–18°C tightens it up."},
   {q:"TASTE ID — pale straw colour, high acid, light body, 11.5% alcohol, citrus and green apple, no oak. Which is the better fit?", o:["A warm-climate Viognier","A cool-climate unoaked white","A barrel-fermented Chardonnay","A late-harvest Riesling"], a:1, e:"Pale + high acid + low alcohol + no oak = cool climate, protective winemaking. Viognier would be richer; barrel ferment would show oak; late harvest would show sweetness."},
   {q:"APPLIED — You want one bottle to last three weeks of course sittings. Which habit matters most?", o:["Always decanting first","Consistent 60–75 mL Coravin pours and tasting before dinner in neutral conditions","Storing the bottle upright in sunlight","Tasting late at night after cooking"], a:1, e:"Small argon-preserved pours, consistent conditions, fresh palate. Decanting defeats the Coravin entirely; light and heat are the enemies."}
  ]},

{ id:2, no:"Module Two", title:"Chardonnay, Three Ways: Terroir Made Visible", subtitle:"Chablis vs Mâcon vs Niagara — one grape, three places, and every winemaking lever on display.",
  bottles:{cellar:3, buy:0},
  objectives:[
    "Explain how climate (Chablis vs Mâconnais vs Niagara) shows up in acid, fruit ripeness and alcohol.",
    "Detect the three big white-winemaking levers: oak, malolactic conversion, and lees contact.",
    "Place Burgundy's geography north to south and its quality hierarchy from regional AOC to Grand Cru.",
    "Defend a blind call of 'cool-climate Chardonnay' from structure alone."
  ],
  lesson:[
   {h:"Why Chardonnay is the perfect terroir lesson", p:[
    "Chardonnay is famously neutral — a relatively quiet grape that transmits place and winemaking decisions with unusual honesty. That's exactly why Burgundy built its entire appellation system on it (and Pinot Noir): the bet is that Puligny tastes different from Chablis not because of the grape but because of the dirt, slope and weather. Your three bottles are a controlled experiment: same variety, three expressions.",
    "Recall the terroir definition from your GBC notes: every element of the vineyard — sunlight, soil, slope, water — captured in an appellation, a tract of land defined by geography rather than politics. This module is where that idea stops being abstract."
   ]},
   {h:"Burgundy, north to south", p:[
    "Burgundy runs in a narrow band: Chablis sits far northwest, almost closer to Champagne than to the rest of Burgundy; then the Côte d'Or (Côte de Nuits for reds, Côte de Beaune for both), then the Côte Chalonnaise, and finally the Mâconnais in the warm south before you hit Beaujolais. The hierarchy stacks from regional Bourgogne AOC → village wines (Chablis, Mâcon-Villages) → Premier Cru vineyards → Grand Cru vineyards. Smaller place on the label = stricter rules, lower yields, and (in theory) more distinctive wine.",
    "Chablis grows on Kimmeridgian limestone — ancient seabed full of fossilised oyster shells — in a genuinely marginal, frost-prone climate. The classic profile: green apple, lemon, a saline, oyster-shell minerality, screaming acidity, lean body, and traditionally little or no new oak; many producers, including the La Chablisienne co-op, favour steel or old neutral vessels for village wine. Le Finage is textbook village Chablis.",
    "The Mâconnais is 100-odd kilometres south and noticeably warmer. Mâcon-Villages is the friendly face of white Burgundy: riper orchard fruit (yellow apple, pear, a hint of melon), softer acid, a rounder, sunnier feel — usually unoaked or lightly oaked, often with some malolactic softness. Bichot's is a clean, classic example."
   ]},
   {h:"The three winemaking levers", p:[
    "Oak: barrels add vanilla, toast, baking spice and a broader texture; new oak speaks loudly, old oak mostly just breathes. Your GBC instructor's tip still holds — a gold tint and a slightly oxidative rim hint at barrel work.",
    "Malolactic conversion (MLF): bacteria convert sharp malic acid (green apple) into soft lactic acid (cream). Full MLF plus oak gives the buttery note (diacetyl). Chablis often does MLF too — but its acid is so high it stays lean regardless. Suppressed MLF keeps a white crunchy and tart.",
    "Lees contact: resting wine on spent yeast adds a doughy, creamy, nutty dimension and textural weight — your Muscadet 'sur lie' notes from GBC apply to ambitious Chardonnay everywhere.",
    "Niagara — and Cave Spring's Beamsville Bench fruit specifically — is the New World playing a cool-climate hand: dolomitic limestone, lake-moderated ripening, real acidity, but a touch more fruit generosity and (in the estate style) judicious barrel and lees work. It should land between your two French bottles: more obvious fruit and texture than Chablis, more cut than you'd expect from 'New World Chardonnay'."
   ]},
   {h:"What to listen for when you compare", p:[
    "Taste lean to rich: Chablis → Mâcon → Cave Spring. Track three things across the line-up: where the acid sits (highest in Chablis), where the fruit ripeness sits (greenest in Chablis, sunniest in Mâcon), and where you detect winemaking (most apparent in the Cave Spring). If you can articulate those three gradients, you've understood terroir better than most people ever do."
   ]}
  ],

   {name:"La Chablisienne 'Le Finage' Chablis", src:"cellar", role:"The cool-climate, mineral pole of the experiment.", sku:"From your cellar",
    key:{appearance:"Bright/brilliant, pale straw with green glints, low-to-medium viscosity.",
     nose:"Clean, medium intensity. Citrus (lemon), green apple, white flowers, and the signature wet-stone/oyster-shell salinity. No oak character.",

     conclusions:"France · Burgundy · Chablis AOC · Chardonnay · 1–3 years · 8–12°C. Food: oysters, sushi, goat cheese.",
     tips:"If you tasted this blind you might not guess Chardonnay at all — that's the point. Log how 'mineral' reads to you: saline? chalky? flinty? Build your own vocabulary for it."}},

  plan:[
   "<b>Sitting 1:</b> Chablis alone, full sheet. Spend extra time on the nose — minerality is easiest to learn when nothing else is shouting.",
   "<b>Sitting 2:</b> Mâcon alone, full sheet. Then a 30 mL splash of Chablis beside it: rank acid, fruit ripeness, body.",
   "<b>Sitting 3 (the main event):</b> All three, 50 mL each, lean to rich. Fill a sheet only for the Cave Spring; for the French pair just update your notes. Write one sentence per wine starting 'This tastes like it comes from…'.",

  reading:[
   "Wine Bible: 'Burgundy' chapter — intro, Chablis and the Mâconnais sections; sidebar on malolactic/lees if your edition includes it.",
   "Wine Folly: Chardonnay grape profile; Burgundy regional pages.",
   "World Atlas of Wine: Burgundy opening spread + Chablis map (find Le Finage's home turf around the town) + Mâconnais map; the Ontario/Canada page for Cave Spring's Beamsville Bench."
  ],
  quiz:[
   {q:"Order these north to south:", o:["Mâconnais → Côte d'Or → Chablis","Chablis → Côte d'Or → Mâconnais","Côte d'Or → Chablis → Mâconnais","Chablis → Mâconnais → Côte d'Or"], a:1, e:"Chablis is the cold northern outpost; the Côte d'Or is the heart; the Mâconnais is the warm south, just above Beaujolais."},
   {q:"The famous soil of Chablis is…", o:["Granite","Volcanic ash","Kimmeridgian limestone full of fossilised shells","River gravel"], a:2, e:"Ancient seabed limestone — often credited for the saline, oyster-shell note in the wines. Geology you can taste (or at least plausibly imagine)."},
   {q:"Malolactic conversion turns…", o:["Sugar into alcohol","Malic acid into lactic acid","Tannin into glycerol","Lactic acid into malic acid"], a:1, e:"Sharp green-apple malic becomes soft, creamy lactic. Full MLF + oak is where 'buttery Chardonnay' comes from."},
   {q:"A white shows doughy, bready, creamy notes but NO vanilla or toast. The most likely lever is…", o:["New oak","Lees contact","Late harvest","Carbonic maceration"], a:1, e:"Lees aging adds yeast-derived dough/cream/nut without wood flavours. Vanilla and toast specifically point to oak."},
   {q:"In Burgundy's hierarchy, which label promises the strictest rules and lowest yields?", o:["Bourgogne AOC","Mâcon-Villages","A village wine like Chablis","A Grand Cru vineyard"], a:3, e:"Regional → village → Premier Cru → Grand Cru. The smaller and more specific the named place, the tighter the regulations."},
   {q:"Your Mâcon shows yellow apple and peach where the Chablis showed green apple and lemon. That shift mainly reflects…", o:["More oak","A warmer growing area and riper fruit","Older vines","More sulphur"], a:1, e:"The green→yellow→tropical fruit spectrum tracks ripeness, which tracks climate. The Mâconnais is simply sunnier."},
   {q:"Why is Chardonnay ideal for studying terroir?", o:["It's the most aromatic grape","It's relatively neutral, so place and winemaking show clearly","It only grows in France","It always tastes of butter"], a:1, e:"Loud grapes (Gewürztraminer, Muscat) sound the same everywhere. Quiet Chardonnay is a blank canvas for site and cellar choices."},
   {q:"Cave Spring's vineyards sit on the Beamsville Bench of the Niagara Escarpment. The lake's main gift to the vines is…", o:["Extra rainfall","Moderated temperatures that extend the growing season and protect acidity","Salt spray flavour","Higher altitude"], a:1, e:"Lake Ontario buffers extremes — slowing spring, softening winter, extending fall. Cool-climate fruit with real acid is the result."},
   {q:"TASTE ID — straw-gold, medium body, yellow apple, vanilla, cream, med+ acid, 13%. Best fit?", o:["Village Chablis","Cool-climate barrel-aged Chardonnay","Mosel Riesling","Jumilla Monastrell"], a:1, e:"Gold tint + vanilla/cream = barrel and MLF/lees; med+ acid says cool climate. Chablis would be leaner and unoaked; Riesling wouldn't show oak; Monastrell is red!"},
   {q:"APPLIED — Oysters on the menu. Your best pour from this module is…", o:["Cave Spring Chardonnay","Mâcon-Villages","Chablis","None — oysters need red wine"], a:2, e:"High acid + salinity + no oak is the classic oyster match. Oak and butter fight briny shellfish."}

{ id:3, no:"Module Three", title:"Sauvignon Blanc: One Grape, Two Hemispheres", subtitle:"Sancerre vs Saint-Bris vs Marlborough — pyrazines, thiols, and a wine-law plot twist.",
  bottles:{cellar:2, buy:1},
  objectives:[
    "Distinguish the restrained Loire style from the exuberant Marlborough style blind.",
    "Explain pyrazines vs thiols — the two aroma engines of Sauvignon Blanc.",
    "Tell the Saint-Bris story: why Sauvignon in Burgundy needed its own appellation, and what that teaches about AOC law.",
    "Refresh the French quality pyramid (AOC/AOP → IGP → Vin de France) from Wines 1."
   ],
  lesson:[
   {h:"The two aroma engines", p:[
    "Sauvignon Blanc's character comes from two chemical families. Methoxypyrazines are the green team: grass, bell pepper, jalapeño, tomato leaf, gooseberry. They're highest in cooler climates and shadier canopies, and they fade as grapes ripen. Thiols are the tropical team: passionfruit, grapefruit, guava, boxwood. They're unlocked during fermentation and Marlborough's intense sunlight-plus-cool-nights regime (and its yeast choices) produces them in famous abundance.",
    "So the style split is really a ripeness-and-winemaking split: Loire Sauvignon picks earlier and ferments cooler and quieter — citrus, grass, smoke, chalk. Marlborough rides the thiol wave — passionfruit you can smell from across the room. Neither is 'better'; they're two answers to the same grape."
   ]},
   {h:"Sancerre and the Central Vineyards", p:[
    "Your GBC notes had this right: the Eastern Loire's Central Vineyards sit on chalk and limestone with pockets of flint (silex), nearly at Burgundy's doorstep. Sancerre is the benchmark — elegant, perfumed, grassy, with that 'fruit salad' brightness you noted (star fruit, yellow apple, honeysuckle) over a firm mineral chassis. Pouilly-Fumé across the river leans smokier (fumé = smoked), often credited to flint soils. Roger & Didier Raimbault farm classic Sancerre terroir; expect the restrained, chiselled school.",
    "Serving and pairing logic: high acid + herbal notes = the goat cheese wine. Crottin de Chavignol, the famous local chèvre, is made in Sancerre itself — appellation thinking applies to cheese too, as you learned in Wines 1."
   ]},
   {h:"Saint-Bris: the exception that teaches the rule", p:[
    "Here's the fun one. Saint-Bris is a tiny appellation near Chablis — geographically Burgundy — but it grows Sauvignon Blanc, the only Burgundian AOC allowed to. Why does that require its own appellation? Because AOC law dictates authorized grapes per appellation: Chardonnay (and Aligoté) own white Burgundy, so the historic Sauvignon plantings around the village of Saint-Bris needed a bespoke AOC (granted in 2003) to exist legally at the top quality tier.",
    "Stylistically it splits the difference in a fascinating way: Sauvignon's citrus-and-green aromatics on Chablis-adjacent Kimmeridgian soils — leaner, stonier, less perfumed than Sancerre, with a cool chalky finish. Tasting Verret's Saint-Bris between Sancerre and Marlborough is a three-point lesson in how much place and law shape what's in your glass."
   ]},
   {h:"Marlborough in one paragraph", p:[
    "The northeastern tip of New Zealand's South Island: brilliant sunshine, cool maritime nights, free-draining river-valley soils (Wairau, Awatere). The style that conquered the world in the 1980s–90s is high-intensity, dry-but-fruity, steel-fermented Sauvignon — passionfruit, grapefruit, fresh-cut grass, sometimes a jalapeño edge from the cooler Awatere. Dog Point — founded by Cloudy Bay's original viticulturist and winemaker — makes a benchmark version with more restraint and stone than the supermarket norm. New World labelling lesson: grape + region on the label, no appellation-mandated variety — the law regulates truthfulness, not tradition."
   ]}
  ],
  wines:[
   {name:"Roger & Didier Raimbault Sancerre", src:"cellar", role:"The Old World benchmark: restraint, chalk, and grass.", sku:"From your cellar",
    key:{appearance:"Bright, pale straw with green tints, low-medium viscosity.",
     nose:"Clean, med to med+ intensity. Citrus (lemon, grapefruit pith), gooseberry, fresh-cut grass, blossom, wet chalk; maybe a flinty/smoky whisper.",

     conclusions:"France · Loire · Sancerre AOC · Sauvignon Blanc · 1–3 years · 8–12°C. Food: goat cheese (the classic), herbed fish, asparagus.",
     tips:"Note how the green notes here are herbal and dignified (grass, nettle) rather than tropical. That restraint IS the Loire signature."}},
   {name:"Domaine Verret Saint-Bris", src:"cellar", role:"The plot twist: Sauvignon on Burgundy soil. Compare directly against the Sancerre.", sku:"From your cellar",
    key:{appearance:"Bright, very pale straw-green, low viscosity.",
     nose:"Clean, medium intensity — quieter than the Sancerre. Lemon, green apple, white flowers, crushed stone; the aromatics feel 'Chablis-shaped' even though the grape is Sauvignon.",
     palate:"Bone dry; acidity high; alcohol medium; body light; citrus-and-mineral driven, chalky cool finish, medium length.",
     conclusions:"France · Burgundy · Saint-Bris AOC · Sauvignon Blanc · 1–3 years · 8–12°C. Food: oysters, leeks vinaigrette, fresh chèvre.",
     tips:"The lesson: same grape as Sancerre, ~100 km apart, but Kimmeridgian Burgundy soil and a cooler aromatic register. If the Sancerre is a perfumed talker, this is its laconic cousin."}},
   {name:"Dog Point Sauvignon Blanc, Marlborough", src:"buy", role:"The New World counterpoint — thiols at full volume, from one of Marlborough's most serious estates.", sku:"Vintages #677450 · $29.95 · verified in stock",
    key:{appearance:"Bright, pale straw, low-medium viscosity.",
     nose:"Clean, HIGH intensity — it leaps from the glass. Passionfruit, grapefruit, guava, gooseberry, fresh grass, a boxwood note — plus, unusually for Marlborough, a flinty, stony layer underneath (older vines, wild-yeast leanings).",
     palate:"Bone dry — drier than mass-market Marlborough; acidity high; alcohol medium (13%); body light-medium; tropical-citrus intensity with a saline, mineral close; med+ finish.",
     conclusions:"New Zealand · Marlborough · Sauvignon Blanc · 1–4 years (this one can age) · 6–10°C. Food: Thai salads, ceviche, anything with lime and herbs.",
     tips:"Smell this beside the Sancerre and name the difference: intensity (volume) AND aroma family (thiol tropicals vs pyrazine greens). Then notice what Dog Point adds over supermarket Marlborough: restraint, texture, a stony spine — proof New World doesn't have to mean simple. That contrast is the most teachable comparison in white wine."}}

  plan:[
   "<b>Sitting 1:</b> Sancerre, full sheet. Linger on the nose; build your 'green' vocabulary (grass vs nettle vs bell pepper).",
   "<b>Sitting 2:</b> Dog Point, full sheet. Then 30 mL of Sancerre alongside: write three words for each wine's aroma family.",
   "<b>Sitting 3:</b> Saint-Bris, full sheet, with small pours of both others. Rank the trio on intensity, then on minerality. Where does Saint-Bris land? (Most tasters: quietest, stoniest.)",
   "<b>Sitting 4 (blind):</b> Vince pours one of the three. Call it from the nose alone before sipping. With this trio your hit rate should be high — enjoy the win."
  ],
  reading:[
   "Wine Bible: 'The Loire' chapter — Sancerre/Pouilly-Fumé section; New Zealand chapter, Marlborough section.",
   "Wine Folly: Sauvignon Blanc grape profile; Loire and New Zealand region pages.",
   "World Atlas of Wine: Loire overview + Sancerre/Pouilly map; New Zealand/Marlborough spread. Find the Wairau and Awatere valleys."
  ],
  quiz:[
   {q:"Methoxypyrazines give Sauvignon Blanc its…", o:["Passionfruit and guava notes","Grass, bell pepper and jalapeño notes","Vanilla and toast","Petrol note"], a:1, e:"Pyrazines are the green team, strongest in cooler sites and less-ripe fruit. Thiols are the tropical team. Petrol belongs to aged Riesling — next module!"},
   {q:"Saint-Bris needed its own AOC because…", o:["It's in the Loire, far from other appellations","AOC law authorizes specific grapes per appellation, and Sauvignon isn't permitted in Burgundy's other white AOCs","Its wines are sparkling","It uses American oak"], a:1, e:"Appellation law dictates authorized varieties — your Wines 1 'primary criteria'. Sauvignon in Burgundy = bespoke appellation (2003) or downgrade."},
   {q:"The classic local pairing for Sancerre is…", o:["Beef bourguignon","Crottin de Chavignol goat cheese","Oysters Rockefeller","Dark chocolate"], a:1, e:"The chèvre is made within Sancerre itself. High acid + herbal notes + tangy goat cheese is one of wine's perfect regional marriages."},
   {q:"Pouilly-Fumé's 'fumé' is usually attributed to…", o:["Barrel toast","Smoky/flinty notes linked to silex (flint) soils","Smoked yeast","Nearby forest fires"], a:1, e:"The gunflint/smoke note is the calling card across the river from Sancerre, traditionally credited to flint-rich soils."},
   {q:"Marlborough's climate recipe for explosive Sauvignon is…", o:["Hot days, hot nights","Intense sunshine with cool maritime nights","Constant rain","Desert heat with irrigation"], a:1, e:"Big sun builds flavour and thiol precursors; cold nights preserve screaming acidity. Sunshine + chill = intensity with freshness."},
   {q:"Under the post-2009 EU framework you learned at GBC, AOC wines correspond to…", o:["IGP","PDO/AOP","Vin de France","VDQS"], a:1, e:"AOC ≈ AOP/PDO (protected designation of origin). IGP replaced Vin de Pays; VDQS was abolished; Vin de France is the old Vin de Table."},
   {q:"A Sauvignon shows pungent passionfruit, guava and grapefruit at high volume. The dominant aroma compounds are…", o:["Terpenes","Thiols","Pyrazines","Diacetyl"], a:1, e:"Thiols = tropical pungency, Marlborough's signature. Terpenes drive Riesling/Gewürz florals; diacetyl is MLF butter."},
   {q:"Why does classic Sancerre rarely show new oak?", o:["Oak is illegal in the Loire","The style prizes precision, aromatics and minerality that new oak would blur","Barrels can't be shipped there","Sauvignon can't ferment in wood"], a:1, e:"It's a stylistic tradition, not a law — the region's identity is freshness and stony clarity (some top cuvées do see old/large wood)."},
   {q:"TASTE ID — pale, screaming acid, light body, gooseberry + fresh grass + wet chalk, restrained intensity, 12.5%. Best fit?", o:["Marlborough Sauvignon","Sancerre","Mâcon-Villages","Alsace Pinot Gris"], a:1, e:"Restrained volume + chalk + grass = Loire. Marlborough would be louder and more tropical; Mâcon rounder; Alsace PG richer."},
   {q:"APPLIED — Your weekly farm box delivers asparagus and fresh herbs. Notoriously wine-hostile asparagus is best with…", o:["Oaked Chardonnay","A green, high-acid Sauvignon Blanc","Tannic Cabernet","Tawny Port"], a:1, e:"Match green with green: pyrazine-driven Sauvignon embraces asparagus' grassy sulfur notes. Tannin and oak clash hard."}
  ]},

{ id:4, no:"Module Four", title:"Aromatic Whites: Riesling, Pinot Gris & Viognier", subtitle:"Terpenes, the sweetness-acid seesaw, and why Alsace labels by grape.",
  bottles:{cellar:2, buy:1},
  objectives:[
    "Judge sweetness accurately by separating sugar (tongue) from fruitiness (brain) — the Mosel Kabinett test.",
    "Profile the three aromatic archetypes: Riesling (citrus/terpene/mineral), Pinot Gris (rich orchard/smoke), Viognier (apricot/floral, low acid).",
    "Read a German label: Prädikat levels and what they do and don't tell you about sweetness.",
    "Explain Alsace's varietal labelling, its rain-shadow climate, and Vendanges Tardives / SGN from your GBC notes."
  ],
  lesson:[
   {h:"Aromatic grapes and the terpene family", p:[
    "Where Chardonnay whispers, aromatic varieties sing in their own voice no matter where they grow. Riesling, Gewürztraminer, Muscat and Viognier owe much of their perfume to terpenes — the same compound family behind rose petals, citrus oil and lychee. These grapes are almost always made protectively (steel, no MLF, rarely new oak) because the variety itself is the show.",
    "Riesling is the acid king: even fully ripe it keeps electric acidity, which is why it can carry sweetness so gracefully and age for decades — old Riesling famously develops a petrol/kerosene note (the compound TDN) that lovers prize. Pinot Gris is Riesling's opposite in shape: lower acid, more flesh, ripe pear and smoke; in Alsace it's rich and often subtly sweet, while the same grape picked early in Italy becomes neutral, brisk Pinot Grigio. Viognier is the hedonist: heady apricot, honeysuckle and orange blossom, oily texture, soft acid, higher alcohol — a grape rescued from near-extinction in Condrieu (northern Rhône) in the 1960s."
   ]},
   {h:"The sweetness-acid seesaw", p:[
    "The most important palate lesson in this module: perceived sweetness = actual sugar MINUS acidity. Your Kabinett carries real residual sugar (often 40+ g/L), but Mosel acidity is so high that many tasters call it nearly dry. Meanwhile a super-ripe dry Viognier can 'taste sweet' with under 4 g/L because apricot aromatics trick the brain. Test at the tongue tip in the first second, then watch whether acid washes it clean. Your Module 1 sugar-water/lemon-water drill is exactly this seesaw isolated.",
    "Germany's Prädikat ladder — Kabinett, Spätlese, Auslese, Beerenauslese, Eiswein, Trockenbeerenauslese — ranks ripeness at harvest, not sweetness in the bottle. A Spätlese can be fermented dry (look for 'trocken'). Your bottle sits on the first rung of that ladder — a true Kabinett from the Zeltinger Sonnenuhr, one of the Mosel's grand-cru-class slate slopes: blue slate, lime, green apple, peach, feather-light body at ~8% alcohol — low alcohol because sugar was left unfermented. Alcohol and sweetness are two ends of the same sugar."
   ]},
   {h:"Alsace, revisited from your notes", p:[
    "Your GBC notes nailed the fundamentals: Alsace hides in the Vosges rain shadow, making it one of France's sunniest, driest wine regions despite its northern latitude — hence ripe, fuller whites and a haven for organic farming. It labels by variety (rare in France), permits only Pinot Noir among reds, and rarely uses new oak or much MLF. Vendanges Tardives = late harvest (riper, not necessarily sweet); Sélection de Grains Nobles = botrytis-selected berries, lusciously sweet. The Willm Pinot Gris you calibrated with in Module 1 now gets its proper close-up: taste for the smoky, honeyed richness that separates Alsace PG from Italian Grigio.",
    "Viognier's home is Condrieu, but your La Foule is a southern-French rendition — sunnier, plusher, great value. The teaching contrast with Riesling could not be sharper: Viognier is all perfume and texture with soft acid; Riesling is all tension. Body and acidity are independent axes — this trio proves it."
   ]}
  ],
  wines:[
   {name:"Selbach-Oster Zeltinger Sonnenuhr Riesling Kabinett, Mosel", src:"buy", role:"True Kabinett from one of the Mosel's great vineyards — your sweetness-vs-acid lab, taught at the source. (Budget alternative: Dr. L Riesling, Vintages #599274, ~$17.)", sku:"Vintages #665927 · $40 · verified in stock — 95 pts Suckling",
    key:{appearance:"Brilliant, very pale straw with green glints, water-light viscosity.",
     nose:"Clean, pronounced. Lime, green apple, white peach, wild herbs, blossom, and a deep wet-slate/stony note from the Sonnenuhr's blue slate; young, so little or no petrol yet.",
     palate:"OFF-DRY — there's real residual sugar here, but the acid is so high many tasters call it nearly dry; find the sugar at the tip, then feel the acid scrub it away. Alcohol LOW (~8–9%!); body light but intensely concentrated; long salty-stony finish.",
     conclusions:"Germany · Mosel (Zeltinger Sonnenuhr) · Riesling Kabinett · drinks now, ages 20+ years · 6–10°C. Food: spicy takeout — Thai, Szechuan, jerk. Sugar + acid tames chili heat.",
     tips:"Log your sweetness call BEFORE checking alcohol on the label — low abv on a German Riesling is the printed confession of residual sugar. This is also your Prädikat lesson in physical form: Kabinett means the lightest, earliest-picked tier, and this bottle shows how electric that can be from a great site. Coravin the rest: re-taste in Module 11 next to the icewine for the full German sweetness spectrum."}},
   {name:"Willm Pinot Gris Réserve, Alsace", src:"cellar", role:"Returning from Module 1 — now taste it as an aromatic-family archetype, not a calibration tool.", sku:"From your cellar (Coravin remainder)",
    key:{appearance:"Bright, straw-gold, medium+ viscosity — visually the richest of the trio.",
     nose:"Clean, med+ intensity. Ripe pear, yellow peach, honey, smoke, ginger, beeswax.",
     palate:"Dry to off-dry; acidity medium (the lowest-tension wine here after the Viognier); alcohol med+; body med+; finish medium+ with a smoky-honey echo.",
     conclusions:"France · Alsace · Pinot Gris · 1–4 years · 8–12°C. Food: tarte flambée, roast pork, washed-rind cheese.",
     tips:"Versus the Kabinett: similar 'maybe a little sweet?' impression, completely different mechanism — here it's ripeness, alcohol and texture; there it's literal sugar held up by acid."}},
   {name:"La Foule Viognier (South of France)", src:"cellar", role:"The perfumed, low-acid pole — proof that body and acidity are separate dials.", sku:"From your cellar",
    key:{appearance:"Bright, straw to pale gold, medium+ viscosity, legs from alcohol.",
     nose:"Clean, HIGH intensity. Apricot, honeysuckle, orange blossom, ripe peach, a gardenia-like floral lift.",
     palate:"Dry (but reads ripe-sweet); acidity LOW to med− — notice how little your mouth waters; alcohol med+ to high; body full for a white, oily texture; finish medium, slightly warm.",
     conclusions:"France · Languedoc/Rhône-adjacent IGP · Viognier · drink now (1–2 years — aromatics fade fast) · 8–12°C. Food: apricot-glazed chicken, mild Indian, lobster.",
     tips:"This is your low-acid reference for the whole course. If a mystery white smells like an orchard in bloom and barely makes you salivate, think Viognier (or Gewürztraminer — that one adds lychee and rose)."}}
  ],
  plan:[
   "<b>Sitting 1:</b> The Kabinett solo, full sheet. Do the sweetness call carefully, write it down, then check the abv on the label and read the key.",
   "<b>Sitting 2:</b> Viognier solo, full sheet. Compare your salivation response to memory of the Riesling — then verify with 30 mL of the Kabinett.",
   "<b>Sitting 3:</b> All three, 40 mL each, in order Riesling → Pinot Gris → Viognier. Rank: acidity, body, aromatic intensity, alcohol. Note that the rankings differ — that's the module's thesis.",
   "<b>Sitting 4 (applied):</b> Order or cook something genuinely spicy. Taste the Kabinett and the Viognier with it. Which handles the heat? (Spoiler: sugar + low alcohol wins.)"
  ],
  reading:[
   "Wine Bible: Germany chapter (Mosel + Prädikat system); Alsace chapter — cross-check against your own GBC notes.",
   "Wine Folly: Riesling, Pinot Gris and Viognier grape profiles; the sweetness chart spread.",
   "World Atlas of Wine: Mosel map (look at those slopes and the river bends); Alsace spread; northern Rhône page for Condrieu context."
  ],
  quiz:[
   {q:"A Mosel Kabinett tastes nearly dry to many people despite real residual sugar because…", o:["The sugar is artificial","High acidity offsets perceived sweetness","It's served too cold to taste anything","Riesling has no sugar"], a:1, e:"The sweetness-acid seesaw: perception = sugar minus acid. Mosel acidity scrubs the palate clean."},
   {q:"A German Riesling at 8.5% alcohol is quietly telling you…", o:["It's faulty","Fermentation stopped/was stopped, leaving unfermented sugar — it's off-dry or sweeter","It's from a hot climate","It was chaptalized heavily"], a:1, e:"Alcohol and residual sugar are two fates of the same grape sugar. Low abv + Germany = sugar left in the wine."},
   {q:"The Prädikat ladder (Kabinett → TBA) ranks wines by…", o:["Sweetness in the finished bottle","Ripeness/sugar of the grapes at harvest","Barrel time","Price"], a:1, e:"It measures must weight at picking. A Spätlese trocken is fermented fully dry from riper grapes — ripeness ≠ final sweetness."},
   {q:"The petrol/kerosene note in mature Riesling comes from…", o:["Diesel contamination","The compound TDN, which develops with bottle age (and sun-exposed fruit)","Oak barrels","Botrytis"], a:1, e:"TDN is a terpene-derived compound and a hallmark — often beloved — of aged Riesling."},
   {q:"Alsace is unusually sunny and dry for its latitude because…", o:["It's on the Mediterranean","The Vosges mountains cast a rain shadow","Global warming only affects Alsace","Its vineyards are underground"], a:1, e:"Weather dumps rain on the windward Vosges; Alsace sits in the dry lee — your GBC notes exactly."},
   {q:"Vendanges Tardives on an Alsace label means…", o:["Always a dessert wine","Late-harvested, riper fruit — sometimes sweet, sometimes nearly dry","Botrytis-affected berries only","Sparkling"], a:1, e:"VT = late harvest = more sugar at picking, but the final style varies. SGN is the reliably sweet, botrytis-selected tier."},
   {q:"Pinot Gris and Pinot Grigio are…", o:["Different grapes","The same grape in two stylistic traditions — rich Alsace vs brisk early-picked Italian","A red and a white grape","Both synonyms for Pinot Blanc"], a:1, e:"Same variety; picking date, yields and intent create opposite wines. Naming signals style."},
   {q:"Viognier's structural signature is…", o:["High acid, light body","Low acid, full body, high aromatics, warmish alcohol","High tannin","Neutral aromatics"], a:1, e:"Perfume without tension. It's the proof grape that aromatic intensity and acidity are independent dials."},
   {q:"TASTE ID — water-pale, lime + slate + peach, light body, sweetness up front swept away by racing acid, 8.5% abv. Best fit?", o:["Alsace Pinot Gris","Mosel Riesling Kabinett-style","Languedoc Viognier","Saint-Bris Sauvignon"], a:1, e:"Low alcohol + slate + the sugar/acid dance is Mosel in a sentence."},
   {q:"APPLIED — Friday night Szechuan delivery. The chili-friendliest bottle in this module is…", o:["La Foule Viognier (14%)","The Mosel Kabinett (8%, off-dry)","Willm Pinot Gris (13.5%)","None — drink red with spice"], a:1, e:"Capsaicin amplifies alcohol burn and is soothed by sugar. Low-abv off-dry Riesling is the takeout MVP."}
  ]},
{ id:5, no:"Module Five", title:"Light Reds: Pinot Noir & Gamay", subtitle:"Translucence, perfume and the carbonic question — Burgundy's hierarchy meets Beaujolais' granite.",
  bottles:{cellar:0, buy:2},
  objectives:[
    "Assess light reds correctly: low tannin and pale colour are features, not flaws.",
    "Detect carbonic/semi-carbonic maceration markers (banana, bubblegum, candied red fruit) and explain the technique.",
    "Map Burgundy's red hierarchy and Beaujolais' three tiers (Beaujolais → Villages → the ten crus).",
    "Serve light reds properly (14–16°C) and explain why temperature transforms them."
  ],
  lesson:[
   {h:"Reading a pale wine", p:[
    "New tasters equate dark with good. Unlearn that now: Pinot Noir and Gamay are thin-skinned grapes that make translucent wines of perfume and silk, prized precisely for what they don't have — heavy tannin, opaque colour, brute force. In your appearance assessment, hold the glass over white paper: you should nearly read through a young Pinot. Colour intensity is a grape-and-extraction clue, and 'pale ruby' immediately narrows a blind tasting to a shortlist: Pinot, Gamay, Grenache, Nebbiolo (the trickster — pale but ferociously tannic).",
    "Structurally, both of this module's grapes run high acid, low-to-medium tannin, light-to-medium body. The differences are in fruit register and texture: Pinot leans red cherry, raspberry, mushroom and forest floor with a satiny feel; Gamay leans fresher — crunchy red berries, violets, white pepper — with a juicy, gulpable bounce."
   ]},
   {h:"Burgundy red logic and the Niagara echo", p:[
    "The hierarchy you learned for white Burgundy applies identically to red: Bourgogne → village → Premier Cru → Grand Cru, with the Côte de Nuits as Pinot's holy mile. Climate sensitivity is extreme — Pinot ripens meaningfully differently across a few hundred metres, which is the whole intellectual justification for Burgundy's vineyard mosaic.",
    "Niagara is one of the New World's true cool-climate Pinot homes — same lake-moderation story as Module 2's Chardonnay. Expect a touch more overt cherry fruit than village Burgundy, slightly softer acid, oak used gently. When a Bourgogne Rouge appears in your monthly Vintages email (they come through constantly at $25–35), grab one and run the old-vs-new comparison properly."
   ]},
   {h:"Beaujolais and carbonic maceration", p:[
    "Beaujolais sits just south of the Mâconnais on granite — a soil change that matters, because Gamay on granite makes structured, mineral wine. The region's three tiers: basic Beaujolais (the south's flatter clay), Beaujolais-Villages (better hillside parishes), and the ten named crus — Brouilly, Côte de Brouilly, Régnié, Morgon, Chiroubles, Fleurie, Moulin-à-Vent, Chénas, Juliénas, Saint-Amour — which don't even put 'Beaujolais' on the label. Brouilly is the largest and friendliest cru; Morgon and Moulin-à-Vent the most structured and age-worthy.",
    "The signature technique: carbonic (or semi-carbonic) maceration. Whole uncrushed clusters go into a CO2-filled tank; fermentation begins inside intact berries, enzyme-driven, before yeast takes over. The result: vivid colour, minimal tannin, and a distinctive candied aromatic set — banana, bubblegum, pear drop, kirsch. Nouveau is carbonic at full caricature; cru Beaujolais uses gentler semi-carbonic or traditional ferments, so the markers are subtler. Train your nose on them — once learned, never missed."
   ]},
   {h:"Temperature, the free upgrade", p:[
    "Light reds at 20°C+ taste flat, soupy and boozy; at 14–16°C they snap into focus — fruit brightens, acid lifts, alcohol recedes. Twenty minutes in the fridge before each sitting. This is the single cheapest improvement in all of wine service, and from now on the course assumes you're doing it."
   ]}
  ],
  wines:[
   {name:"Domaine d'Argenson 'Les Pierreux' Brouilly", src:"buy", role:"Cru Beaujolais: Gamay with granite seriousness. (Backup: Georges Duboeuf Brouilly #22669 or Jaffelin Brouilly #42030.)", sku:"LCBO #29970 · $24.95",
    key:{appearance:"Bright, medium ruby with violet flashes, youthful rim, medium viscosity — darker than you'd expect from 'light red'.",
     nose:"Clean, med+ intensity. Crunchy red fruit (cherry, raspberry, redcurrant), violets, white pepper; listen for a faint candied/kirsch note — the semi-carbonic whisper.",
     palate:"Dry; acidity med+ to high; tannin soft to med−, fine-grained; alcohol medium (12.5–13%); body medium−; juicy red fruit with a stony, faintly bitter-cherry finish; medium+ length.",
     conclusions:"France · Beaujolais · Brouilly cru · Gamay · 1–4 years · 14–16°C, lightly chilled. Food: roast chicken, charcuterie, salmon — the great bistro all-rounder.",
     tips:"Cru Beaujolais is the wine-trade's favourite value secret. If you love this, Morgon and Moulin-à-Vent are the 'next step up' crus to chase in Vintages releases."}},
   {name:"Bachelder Les Villages Bench Pinot Noir VQA", src:"buy", role:"Thomas Bachelder's Burgundy-trained, multi-vineyard Escarpment blend — Niagara Pinot at its most Burgundian. (Old-World comparison: grab any Bourgogne Rouge from a monthly Vintages release, $25–40.)", sku:"Vintages #11582 · $34.95 · recurring release — verified",
    key:{appearance:"Pale to medium ruby, translucent — read your hand through it; youthful rim; low-medium viscosity.",
     nose:"Clean, medium+ intensity. Morello cherry, cranberry, wild raspberry, a flinty/limestone edge, dried herbs, subtle toasty spice from gentle oak.",
     palate:"Dry; acidity med+; tannin soft, silky; alcohol medium (~12.5–13%); body medium−; red fruit with a saline, tea-leaf savouriness; medium+ finish.",
     conclusions:"Canada · Niagara Escarpment VQA · Pinot Noir · 2–8 years · 14–16°C. Food: duck, mushroom risotto, salmon, your roast-chicken-and-farm-box dinners.",
     tips:"Versus the Brouilly: similar weight class, but Pinot is satin where Gamay is gingham — earthier, more cherry-pie, less crunch. Naming that texture difference blind is a genuine skill milestone."}}
  ],
  plan:[
   "<b>Sitting 1:</b> Brouilly, properly chilled, full sheet. Hunt specifically for the carbonic family (banana/bubblegum/kirsch) — even a trace counts.",
   "<b>Sitting 2:</b> The Bachelder, full sheet. Hold both glasses to white paper and compare translucence; Pinot is usually paler.",
   "<b>Sitting 3 (head to head):</b> 50 mL each. Same weight class — so differentiate on fruit register (cherry-earth vs crunchy-berry), texture (satin vs juicy), and pepper (Gamay's white-pepper lift).",
   "<b>Sitting 4 (temperature lab):</b> Pour the same wine at fridge-cold, 15°C, and room temp. Sheet only the 15°C pour, but write two lines on what temperature did. You'll never serve red at 22°C again.",
   "<b>When your Vintages Bourgogne arrives:</b> run it against the Bachelder remainder — the classic old/new Pinot face-off."
  ],
  reading:[
   "Wine Bible: Burgundy chapter (red sections, Côte de Nuits) and the Beaujolais chapter — especially carbonic maceration.",
   "Wine Folly: Pinot Noir and Gamay profiles; Burgundy/Beaujolais pages.",
   "World Atlas of Wine: Côte de Nuits maps (just to marvel at the vineyard mosaic); Beaujolais spread — find all ten crus, locate Brouilly at the south."
  ],
  quiz:[
   {q:"A very pale, translucent ruby immediately shortlists which grapes?", o:["Cabernet, Malbec, Syrah","Pinot Noir, Gamay, Grenache, Nebbiolo","Merlot, Zinfandel","Tempranillo, Touriga Nacional"], a:1, e:"Thin skins (or low extraction) = pale wine. Remember Nebbiolo is the trap: pale colour, massive tannin."},
   {q:"Banana, bubblegum and pear-drop aromas in a young red point to…", o:["Botrytis","Carbonic/semi-carbonic maceration","American oak","Brettanomyces"], a:1, e:"Intact-berry fermentation creates these distinctive esters. Loud in Nouveau, whispered in cru Beaujolais."},
   {q:"Which is a Beaujolais cru?", o:["Mâcon-Villages","Morgon","Sancerre","Saint-Bris"], a:1, e:"The ten crus include Morgon, Brouilly, Fleurie, Moulin-à-Vent… Cru labels don't even say 'Beaujolais'."},
   {q:"Gamay in cru Beaujolais grows mainly on…", o:["Kimmeridgian limestone","Granite","Schist","Clay over gravel"], a:1, e:"The hilly north's granite gives cru Beaujolais its structure and mineral cut — a soil border with Burgundy proper."},
   {q:"Serving a light red at 14–16°C rather than 22°C makes it taste…", o:["Sweeter and heavier","Fresher, brighter, less alcoholic","More tannic and bitter","Exactly the same"], a:1, e:"Cool service tightens fruit and acid and tames alcohol vapour. Warm service makes light reds soupy."},
   {q:"Burgundy's red quality pyramid, ascending:", o:["Grand Cru → village → Bourgogne","Bourgogne → village → Premier Cru → Grand Cru","Premier Cru → Bourgogne → Grand Cru","Village → Bourgogne → Grand Cru"], a:1, e:"Same ladder as the whites: the more specific the place, the higher the tier."},
   {q:"Pinot Noir vs Gamay on the palate — the most reliable separator is…", o:["Alcohol level","Fruit register and texture: earthy cherry satin vs crunchy peppery juiciness","Tannin: Pinot is always harsher","Colour: Gamay is always darker"], a:1, e:"They share a weight class; the tells are stylistic. (Colour can go either way; cru Gamay is often darker.)"},
   {q:"Why does Burgundy's vineyard mosaic make intellectual sense for Pinot specifically?", o:["Pinot is cheap to grow","Pinot is hypersensitive to site, so tiny terroir differences become tastable","Pinot ripens identically everywhere","EU law requires small vineyards"], a:1, e:"Pinot is the world's great terroir transmitter among reds — the same argument Chardonnay made for whites in Module 2."},
   {q:"TASTE ID — medium ruby, violets, crunchy raspberry, white pepper, kiss of kirsch candy, high acid, soft tannin, juicy. Best fit?", o:["Niagara Pinot Noir","Cru Beaujolais Gamay","Rioja Reserva","Jumilla Monastrell"], a:1, e:"Crunch + violets + pepper + a carbonic whisper = Gamay. Pinot would trade pepper for earth; the other two are far bigger wines."},
   {q:"APPLIED — Planning salmon for dinner. Best red logic?", o:["Big tannic Cab — fish needs power","A chilled light red (Gamay/Pinot): low tannin won't clash with fish oils, acid refreshes","No red ever works with fish","Port"], a:1, e:"Tannin + fish oil = metallic clash. Low-tannin, high-acid reds are the fish-friendly reds — a modern classic pairing."}
  ]},

{ id:6, no:"Module Six", title:"Italy: Sangiovese & the Appassimento Trick", subtitle:"Chianti Classico's acid-and-tannin food machine, plus Valpolicella's dried-grape alchemy — a GBC reunion.",
  bottles:{cellar:0, buy:2},
  objectives:[
    "Profile Sangiovese: the high-acid, high-tannin, sour-cherry signature and why it's built for the table.",
    "Decode Italian wine law (DOC/DOCG/IGT) and Chianti Classico's ladder: Annata → Riserva → Gran Selezione.",
    "Explain appassimento and the ripasso method — and identify dried-fruit markers in the glass.",
    "Articulate why acid + tannin + fat is the fundamental food-pairing equation."
  ],
  lesson:[
   {h:"Sangiovese, Italy's spine", p:[
    "Italy's most planted grape is a study in savoury tension: sour cherry, dried herbs, tomato leaf, tea, leather with age — riding high acidity AND firm, dusty tannin. That double-high structure is rare (compare: Pinot is high acid/low tannin; Monastrell low acid/high ripeness) and it explains everything about how Sangiovese behaves: austere alone, transformed beside food. Fat and protein soften tannin; acid cuts richness and makes you hungry for the next bite. Ragù, bistecca, aged pecorino — the wine was shaped by the cuisine and vice versa.",
    "Chianti Classico is the historic heartland between Florence and Siena (the black rooster — Gallo Nero — seal). Rules: minimum 80% Sangiovese (many are 100%), with the ladder Annata (the base, 12 months aging) → Riserva (24 months) → Gran Selezione (30 months, estate fruit, the 2014-created summit). Sangiovese also stars as Brunello di Montalcino (100%, powerful, age-demanding) and Vino Nobile di Montepulciano — same grape, different communes and rules."
   ]},
   {h:"Italian wine law in two minutes", p:[
    "The EU pyramid you know wears Italian clothes: DOCG (guaranteed — pink/green neck seal, tasting panel, the strictest tier) → DOC (controlled) → IGT (regional, where 'Super Tuscan' rebels famously parked their French-grape blends when Chianti rules excluded them) → Vino da Tavola. The Super Tuscan story is the best illustration in all of wine that appellation law regulates typicity, not quality — some of Italy's most expensive wines are technically 'mere' IGT."
   ]},
   {h:"Appassimento and the ripasso method", p:[
    "Now to the trick you already met at GBC — your Wines 1 tasting sheet has a Valpolicella Ripasso on it, scored at 16–18°C with concentrated black currant, smoke, vanilla and spice. Here's the full mechanism. Valpolicella (Veneto, near Verona; Corvina-led blends) makes fresh, cherryish reds. For Amarone, growers dry harvested grapes on racks for ~3–4 months (appassimento): water evaporates, sugars/flavours concentrate, and a dry wine of 15–16% with raisin, fig and chocolate depth results. Ripasso is the clever middle child: finished Valpolicella is 're-passed' over the warm, still-sweet Amarone pomace, sparking a second fermentation that adds alcohol, body, tannin and that signature dried-cherry/cocoa register at a fraction of Amarone's price.",
    "Tasting signature of dried-fruit winemaking: fresh cherry shifts toward kirsch/prune/raisin, body and alcohol climb, and a sweet-spice warmth appears even in a dry wine. Once you can spot 'dried fruit by design' you'll also recognize it in Amarone, in Tuscany's Vin Santo, and in over-ripe vintages anywhere."
   ]},
   {h:"This module's comparison", p:[
    "Chianti Classico vs Ripasso is a perfect contrast pair: similar price, both Italian food wines, opposite philosophies. The Chianti is about tension — acid and tannin, fresh sour cherry, built lean for the table. The Ripasso is about generosity — concentration borrowed from dried grapes, plush and warming. Decide which philosophy is more 'you', and note it: that preference will guide your Vintages buying for years."
   ]}
  ],
  wines:[
   {name:"Rocca delle Macìe Chianti Classico", src:"buy", role:"Textbook Annata Chianti Classico from the Vintages Essentials wall. (Upgrade option: Volpaia Chianti Classico #953828, $37.95, organic, Radda elegance.)", sku:"Vintages Essentials #741769 · $21.95",
    key:{appearance:"Medium ruby — paler than you'd guess — with a hint of garnet at the rim even young; medium viscosity.",
     nose:"Clean, med+ intensity. Sour red cherry, red plum, dried oregano/tomato leaf, violets, cedar, a leathery whisper.",
     palate:"Bone dry; acidity HIGH (it should make your mouth water like a white); tannin med+ — dusty, slightly grippy; alcohol medium (13.5%); body medium; sour cherry and herbs; med+ savoury finish.",
     conclusions:"Italy · Tuscany · Chianti Classico DOCG · Sangiovese (with a little Merlot/Canaiolo) · 2–6 years · 16–18°C. Food: anything with tomato and fat — ragù, pizza, pecorino.",
     tips:"Taste it alone first (a bit stern?), then with a bite of cheese or salami — feel the tannin melt. That before/after is the food-pairing equation made flesh."}},
   {name:"Zenato Valpolicella Ripasso Superiore", src:"buy", role:"The ripasso archetype, and a direct callback to your GBC tasting. (Confirm SKU/price on lcbo.com — Vintages Essentials, ~$27. Backup: Tommasi or Pasqua Ripasso.)", sku:"Vintages Essentials · ~$27 · confirm SKU",
    key:{appearance:"Deep ruby toward garnet, med+ intensity, med+ viscosity — visibly richer than the Chianti.",
     nose:"Clean, med+ intensity. Black cherry sliding toward kirsch and prune, dried fig, cocoa, sweet baking spice, vanilla (some oak), tobacco.",
     palate:"Dry but ripe-sweet in impression; acidity medium; tannin medium, rounded; alcohol med+ (14%+ — feel the warmth); body med+ to full; dried-cherry and chocolate; med+ warming finish.",
     conclusions:"Italy · Veneto · Valpolicella Ripasso Superiore DOC · Corvina blend · 2–6 years · 16–18°C. Food: braised short ribs, mushroom ragù, aged cheeses.",
     tips:"Compare against your own 2019-era GBC sheet for Ripasso — you flagged stewed fruit, smoke, vanilla, dark chocolate. See how much more precisely you can name the dried-fruit mechanism now."}}
  ],
  plan:[
   "<b>Sitting 1:</b> Chianti solo, full sheet — then repeat key palate calls with a bite of parmesan or salami and note what changes.",
   "<b>Sitting 2:</b> Ripasso solo, full sheet. Hunt the dried-fruit register: is the cherry fresh, cooked, or raisined?",
   "<b>Sitting 3 (philosophies head-to-head):</b> 50 mL each with dinner — ideally something tomato-and-beef. Which wine improves more with food? Which would you rather drink alone? Write the answer; it's your palate's mission statement for Italian reds.",
   "<b>Sitting 4 (blind, optional):</b> Vince pours one of the two plus a leftover from Module 5. Pale + high acid + grippy = Sangiovese; dried fruit + warmth = Ripasso; crunch + pepper = Gamay."
  ],
  reading:[
   "Wine Bible: Tuscany chapter (Chianti Classico, Brunello) and the Veneto/Amarone section.",
   "Wine Folly: Sangiovese profile; the Italy regional overview; Valpolicella blends page.",
   "World Atlas of Wine: Italy opener, Chianti Classico map (find Castellina, Radda, Gaiole), Verona/Valpolicella spread."
  ],
  quiz:[
   {q:"Sangiovese's rare structural signature is…", o:["High acid + low tannin","High acid + high tannin","Low acid + high alcohol","Low everything"], a:1, e:"The double-high makes it austere solo and brilliant with food — fat tames tannin, acid cuts richness."},
   {q:"Chianti Classico's aging ladder, ascending:", o:["Riserva → Annata → Gran Selezione","Annata → Riserva → Gran Selezione","Gran Selezione → Riserva → Annata","Superiore → Classico → Riserva"], a:1, e:"Annata (base) → Riserva (24 months) → Gran Selezione (30 months, estate fruit; created 2014)."},
   {q:"The ripasso method involves…", o:["Aging in new American oak","Re-fermenting Valpolicella on warm Amarone pomace for extra body, alcohol and dried-fruit character","Adding brandy","Freezing the grapes"], a:1, e:"The 're-pass' borrows concentration from appassimento without the full Amarone price tag."},
   {q:"Appassimento concentrates wine by…", o:["Boiling the must","Drying harvested grapes for months so water evaporates","Adding sugar","Extended barrel aging"], a:1, e:"Rack-drying raisinates the fruit: more sugar, more flavour per drop — hence Amarone's 15–16% power."},
   {q:"Italy's strictest appellation tier, with a government tasting panel and numbered neck seal:", o:["IGT","DOC","DOCG","Vino da Tavola"], a:2, e:"DOCG = denominazione di origine controllata e GARANTITA. The pyramid mirrors the EU PDO/IGP system from your GBC notes."},
   {q:"Super Tuscans originally launched as humble IGT/table wine because…", o:["They were cheap","Chianti's rules excluded their French-variety blends, so they opted out of the appellation","They were white wines","IGT pays better taxes"], a:1, e:"The best proof that appellation law guards typicity, not quality — rule-breakers can be magnificent."},
   {q:"The black rooster (Gallo Nero) seal belongs to…", o:["Brunello di Montalcino","Chianti Classico","Barolo","Valpolicella"], a:1, e:"The consorzio mark of the historic Florence–Siena heartland."},
   {q:"Brunello di Montalcino is…", o:["A Corvina blend","100% Sangiovese from Montalcino, powerful and age-demanding","A sweet wine","Sangiovese plus Cabernet by law"], a:1, e:"Same grape as Chianti, warmer commune, stricter aging — Sangiovese's grandest expression."},
   {q:"TASTE ID — deep ruby-garnet, kirsch and prune, cocoa, 14.5%, medium acid, rounded tannin, warming finish. Best fit?", o:["Chianti Classico Annata","Valpolicella Ripasso","Cru Beaujolais","Sancerre Rouge"], a:1, e:"Dried-fruit register + warmth + plush body = appassimento influence. Chianti would bring more acid and grip, less raisin."},
   {q:"APPLIED — Saturday ragù from the farm box beef. The pairing logic for Chianti is…", o:["Its sweetness matches the tomato","Its acid matches tomato acidity and its tannin is tamed by fat — both wine and food improve","Tannin makes meat tougher","There is no logic, only tradition"], a:1, e:"Acid-with-acid, tannin-with-fat: the master equation. Tradition encoded chemistry."}
  ]},

{ id:7, no:"Module Seven", title:"Iberia: Tempranillo, Touriga & Old Vines", subtitle:"Rioja's oak ladder, the Douro's schist, and your Dão and Jumilla bottles in proper context.",
  bottles:{cellar:2, buy:2},
  objectives:[
    "Decode Rioja's aging classifications (Joven/Crianza/Reserva/Gran Reserva) and taste what American oak does.",
    "Profile Touriga Nacional and the Douro/Dão contrast — heat and schist vs altitude and elegance.",
    "Place Monastrell (Mourvèdre) and the old-vine concept in Spain's warm southeast.",
    "Run a four-wine regional flight with the Coravin without palate fatigue."
  ],
  lesson:[
   {h:"Rioja: aging as identity", p:[
    "Rioja built its reputation on a unique promise: the winery ages the wine for you. The ladder is time-based — Joven (little/no oak), Crianza (2 years total, 1 in barrel), Reserva (3 years, 1 in barrel), Gran Reserva (5 years, 2 in barrel) — so a Reserva arrives ready, with bottle-age suppleness you'd otherwise wait a decade for. The traditional barrel is American oak, and its fingerprint is unmistakable once learned: vanilla, coconut, dill, sweet cedar. French oak reads subtler — toast, baking spice, cedar without the coconut. Beronia famously uses mixed-stave barrels; see if you can catch both registers.",
    "Tempranillo itself: red and black cherry, plum, tobacco leaf, leather with age; medium-plus structure all around — Spain's answer to Sangiovese but friendlier-fruited and lower-acid. Garnacha, Graciano and Mazuelo (Carignan) play supporting roles in blends."
   ]},
   {h:"Portugal: the Douro and the Dão", p:[
    "Your GBC tasting sheet includes a Douro Touriga Nacional — leather, violet, blackberry, dark chocolate, smoke — so this is revision with upgrades. The Douro is the world's first demarcated region (1756, the granite markers from your notes): brutally steep schist terraces along the river, baking summers, and field-blend old vineyards mixing dozens of varieties. Touriga Nacional leads modern dry reds: violet-scented, black-fruited, firmly tannic, built like a athlete. Tinta Roriz (= Tempranillo — same grape crossing the border!) and Touriga Franca round out blends.",
    "The Dão, where your Adega de Penalva comes from, sits south of the Douro on a high granite plateau ringed by mountains. Altitude means cooler nights, so Dão reds are the introverts of Portugal: same grape families, but fresher acid, finer tannin, red-fruited elegance — sometimes called Portugal's Burgundy. Tasting Penalva beside the Crasto is a clean altitude-versus-heat experiment within one country."
   ]},
   {h:"Monastrell and the meaning of old vines", p:[
    "Jumilla, in Spain's hot southeast, is Monastrell country (the French call it Mourvèdre, where it anchors Bandol and seasons Châteauneuf blends). The grape is a sun-worshipper: ripe blackberry, dried herbs, a savoury-meaty streak, soft acid, big alcohol. Much of Jumilla survives on ungrafted old bush vines in arid soil — and 'old vines' is a concept worth precision: aged vines yield less fruit with more concentration (your GBC notes: what limits yields? the age of the vine). Less juice, deeper wine — the quality logic behind low-yield rules in every serious appellation.",
    "Strategy note: Iberia remains the planet's best value-for-quality region, and the LCBO agrees — your monthly Vintages emails will be thick with $18–30 Spanish and Portuguese reds. After this module you'll be able to read those listings fluently."
   ]}
  ],

{ id:8, no:"Module Eight", title:"Syrah & the Rhône: Pepper, Garrigue, Sunshine", subtitle:"North vs South, Syrah vs Shiraz — one grape across the ripeness spectrum (plus a Viognier cameo).",
