/* ---------------- MODULE 6 ---------------- */
{
  id:"m6", nav:"The Rhône & Syrah", navnum:"6", type:"module",
  title:"The Rhône & Syrah / Shiraz",
  deck:"One grape, two hemispheres, three faces. Syrah is the clearest study in how the same variety becomes a completely different wine depending on where — and how warm — it grows.",
  tags:[["new","new world"],["old","old world"]],
  lesson:`
    <p class="lead">Syrah (called Shiraz in Australia) is a chameleon, and the Rhône Valley splits neatly into two halves that teach its range. The <strong>Northern Rhône</strong> is Syrah's spiritual home — cool, continental, steep granite slopes — and makes single-variety Syrah of extraordinary character. The <strong>Southern Rhône</strong> is warm and Mediterranean and makes blends, with Grenache usually leading. Then Australia takes the same grape and turns the dial to maximum ripeness. Three faces, one variety.</p>
    <p>Northern Rhône Syrah — from <strong>Côte-Rôtie, Hermitage, Cornas</strong>, and the more affordable <strong>Crozes-Hermitage</strong> and <strong>Saint-Joseph</strong> — is all about black fruit, cracked black pepper (there's that <em>rotundone</em> again, from Module 3), cured meat/bacon (a savoury note called 'lardons' or olive tapenade), violets, and often a smoky, mineral edge. Medium-to-full body, firm but fine tannin, fresh acid. A defining Northern Rhône trick: co-fermenting a little white <strong>Viognier</strong> with the Syrah in Côte-Rôtie, which paradoxically deepens colour and lifts the aromatics with floral perfume.</p>
    <p>The <strong>Southern Rhône</strong> blend — think <strong>Côtes-du-Rhône</strong>, <strong>Gigondas</strong>, and the famous <strong>Châteauneuf-du-Pape</strong> — is the GSM template: <strong>G</strong>renache for red fruit, alcohol, and warmth; <strong>S</strong>yrah for colour, structure, and pepper; <strong>M</strong>ourvèdre for savoury, gamey, meaty depth and grip. (Your Jumilla Monastrell <em>is</em> Mourvèdre — taste it here to learn that grape's voice solo.) These wines are warmer, rounder, herbal with the scrubland note the French call <em>garrigue</em> — wild rosemary, thyme, lavender.</p>
    <div class="pull">Garrigue — the smell of sun-baked Mediterranean herbs and scrub — is the signature of the Southern Rhône and a word worth owning. Once you can name it, you'll find it in wines all across the warm south of France and Spain.</div>
    <p><strong>Barossa Shiraz</strong> from South Australia is the New World extreme: very ripe, full-bodied, lower-acid, with sweet blackberry and plum, chocolate, sweet spice, and often generous new (sometimes American) oak. Set it beside a Northern Rhône and the contrast is total — same grape, opposite philosophy. Cool-climate Syrah whispers pepper and bacon; warm-climate Shiraz shouts jam and mocha.`,
  concepts:[
    ["North vs. South Rhône","North = single-variety Syrah, cooler, peppery and savoury. South = Grenache-led blends, warmer, rounder, herbal (garrigue)."],
    ["GSM blend","Grenache–Syrah–Mourvèdre, the Southern Rhône template. Grenache=fruit/alcohol, Syrah=structure/pepper, Mourvèdre=savoury/meaty grip."],
    ["Co-fermentation (Viognier)","Adding a little white Viognier to Syrah in Côte-Rôtie — stabilises colour and lifts floral aromatics. A famous Northern Rhône technique."],
    ["Garrigue","The aroma of sun-baked Mediterranean herbs and scrubland — rosemary, thyme, lavender. The Southern Rhône's calling card."],
    ["Rotundone (again)","The black-pepper compound, prominent in cool-climate Syrah. The same molecule you met in Grüner Veltliner in Module 3."],
    ["Mourvèdre / Monastrell","The savoury, gamey, tannic blending grape (the M in GSM). Sun-loving; your Jumilla bottle shows it solo and rustic."]
  ],
  taste:[
    "<b>Cool-climate Syrah markers:</b> in the Northern Rhône, hunt black pepper, bacon/cured meat, violets, olive — savoury more than sweet.",
    "<b>Warm-climate Shiraz markers:</b> in the Barossa, hunt sweet blackberry jam, chocolate, vanilla oak — ripe and generous.",
    "<b>GSM anatomy:</b> in the Southern Rhône blend, try to pick out Grenache's red fruit, Syrah's pepper, Mourvèdre's meatiness.",
    "<b>Garrigue:</b> the dried-herb scrubland note in the Southern wines — name it once you find it.",
    "<b>Mourvèdre solo:</b> the Jumilla Monastrell shows the M of GSM on its own — leather, dark fruit, grippy tannin."
  ],
  wines:[
    ["🍷","Crozes-Hermitage or Saint-Joseph","Northern Rhône, France · ~$30","Affordable single-variety Syrah — pepper, bacon, violet, mineral. The cool-climate reference."],
    ["🍷","Côtes-du-Rhône Villages or Gigondas","Southern Rhône, France · ~$22–35","The GSM blend — warmer, rounder, garrigue-scented. Gigondas is the step up from basic CdR."],
    ["🍷","Barossa Valley Shiraz","South Australia · ~$25–40","The New World extreme — ripe, full, blackberry-and-mocha, generous oak. The warm-climate opposite pole."],
    ["🍷","Parajes del Valle Monastrell","Jumilla, Spain · in your cellar","Mourvèdre solo and rustic — leather, dark fruit, grip. Use it to learn the 'M' in GSM."]
  ],
  sessions:[
    {tag:"Session A · the two faces",title:"Northern Rhône vs. Barossa",steps:[
      "Two glasses at ≈17°C, 50ml each — the cool Syrah and the warm Shiraz.",
      "Nose blind: one whispers pepper and bacon, the other shouts jam and chocolate. Which is which?",
      "Taste for acid and alcohol — the Northern Rhône is fresher and leaner; the Barossa is riper and warmer.",
      "Same grape, opposite philosophy — write down how climate rewrote it."
    ],tip:"This is the cleanest 'climate changes everything' lesson after Chardonnay. Let it land."},
    {tag:"Session B · the blend & the M",title:"Southern Rhône + Mourvèdre",steps:[
      "Pour the GSM blend and the solo Monastrell side by side.",
      "In the blend, try to isolate the Mourvèdre contribution by reference to the solo bottle.",
      "Find garrigue in both. Note the Monastrell's rustic, leathery grip."

  quiz:[
    ["How does Northern Rhône Syrah differ from Southern Rhône reds?","The <b>North</b> makes cooler-climate, <b>single-variety Syrah</b> — peppery, savoury (bacon/olive), structured. The <b>South</b> makes warmer, <b>Grenache-led GSM blends</b> — rounder, fruitier, herbal with garrigue."],
    ["What does each grape contribute to a GSM blend?","<b>Grenache:</b> red fruit, alcohol, warmth, body. <b>Syrah:</b> colour, structure, black pepper, freshness. <b>Mourvèdre:</b> savoury/gamey/meaty depth, tannin, grip and ageability."],
    ["Why co-ferment Viognier with Syrah in Côte-Rôtie?","The white grape's compounds <b>stabilise and deepen the red's colour</b> and <b>lift its aromatics with floral perfume</b> (apricot, violet) — counterintuitively making the red more vivid and fragrant, not paler."],
    ["Define garrigue and where it's a signature.","<b>Garrigue</b> is the aroma of sun-baked Mediterranean scrubland — wild rosemary, thyme, lavender, juniper. It's a signature of the <b>Southern Rhône</b> and warm southern France/Spain generally."],
    ["What compound gives cool-climate Syrah its pepper, and where else have you met it?","<b>Rotundone</b> — the same peppercorn compound you met in <b>Grüner Veltliner</b> (Module 3). More expressed in cool-climate Syrah than warm."],
    ["Your Jumilla Monastrell is which French grape, and what does it bring to a blend?","<b>Mourvèdre</b> — the 'M' in GSM. It brings <b>savoury, gamey, meaty, leathery depth, firm tannin, and ageability</b> to a blend; solo, as in Jumilla, it's dark, rustic, and grippy."],
    ["Blind: full body, low-ish acid, ripe blackberry jam, chocolate, sweet vanilla oak, 15% ABV. Grape and origin?","<b>Shiraz from a warm region — classically Barossa Valley, Australia.</b> The jammy ripeness, mocha, sweet oak, high alcohol, and soft acid are the warm-climate Shiraz signature."],
    ["Blind: medium+ body, fresh acid, black pepper, bacon fat, violet, fine firm tannin, 13% ABV. Grape and origin?","<b>Syrah from the Northern Rhône</b> (e.g. Crozes-Hermitage, Saint-Joseph). The pepper (rotundone), cured-meat savour, violet, freshness, and fine tannin are cool-climate Syrah."]
  ],
  reading:[
    "<b>World Atlas of Wine</b> — Northern and Southern Rhône; Barossa (Australia).",

/* ---------------- MODULE 7 ---------------- */
{
  id:"m7", nav:"Bordeaux & Cabernet", navnum:"7", type:"module",
  title:"Bordeaux & the Cabernet Family",
  deck:"The world's most influential red blend, and a study in how two riverbanks — and the soils beneath them — produce two different philosophies from the same handful of grapes.",
  tags:[["new","new world"],["old","old world"]],
  lesson:`
    <p class="lead">Bordeaux is the template the whole wine world copied. Its red wines are blends, built mostly from <strong>Cabernet Sauvignon</strong> and <strong>Merlot</strong>, with supporting roles for <strong>Cabernet Franc</strong>, Petit Verdot, and Malbec. The genius of Bordeaux is the blend: each grape covers another's weakness. And the region splits into two banks of the Gironde estuary whose soils dictate which grape leads — and therefore the style.</p>
    <p>The <strong>Left Bank</strong> (the Médoc — with famous communes Pauillac, Margaux, Saint-Julien, Saint-Estèphe — plus Pessac-Léognan to the south) sits on deep <strong>gravel</strong>. Gravel drains well and holds heat, which late-ripening Cabernet Sauvignon needs. So Left Bank wines are <strong>Cabernet-dominant</strong>: structured, firmly tannic, built on blackcurrant (cassis), cedar, graphite/pencil-shaving, and a leafy, tobacco edge — and they demand age. Think architecture: tall, austere when young, magnificent at twenty.</p>
    <p>The <strong>Right Bank</strong> (Saint-Émilion, Pomerol) sits on cooler <strong>clay and limestone</strong>, which suits earlier-ripening Merlot. So Right Bank wines are <strong>Merlot-dominant</strong> (often with Cabernet Franc): plusher, rounder, softer-tannined, with plum, black cherry, chocolate, and a velvety mid-palate. They're approachable younger. Think upholstery: generous, supple, immediately comforting.</p>
    <div class="pull">Left Bank = gravel = Cabernet = structure and cassis. Right Bank = clay = Merlot = plush and plummy. Burn that pairing in; it unlocks half of Bordeaux.</div>
    <p>The grapes themselves: <strong>Cabernet Sauvignon</strong> — thick-skinned, high tannin and acid, blackcurrant, cedar, mint, and that pyrazine green edge (Module 3) when not fully ripe. <strong>Merlot</strong> — plumper, softer, plum and chocolate. <strong>Cabernet Franc</strong> — the aromatic one: red fruit, graphite, and a distinct leafy, bell-pepper, pencil-shaving lift. The classic <strong>1855 Classification</strong> ranked the top Médoc châteaux into five 'growths'; below them, <em>Cru Bourgeois</em> offers the style at sane prices — your best bet for this module. Finish with a New World Cabernet (Chilean is easiest to find in Ontario; a Niagara or Aussie also works) to see how a warmer site makes Cabernet riper, softer, and more upfront than its austere Bordeaux parent.</p>
    <p><strong>Cabernet Franc</strong> also stars on its own in the <strong>Loire</strong> — Chinon, Bourgueil, Saumur-Champigny — where it makes medium-bodied, fragrant reds: raspberry and red currant, graphite, and that signature leafy, bell-pepper, pencil-shaving lift, over brisk acid and moderate, sometimes faintly green tannin. Tasting a cool Loire Cabernet Franc next to its Bordeaux relatives is the clearest way to learn the variety's fingerprint, because here nothing is blended over it. (It's also the parent grape of Cabernet Sauvignon — a Cabernet Franc × Sauvignon Blanc cross.)</p>`,
  concepts:[
    ["Left Bank","Médoc + Pessac-Léognan, on gravel soils. Cabernet Sauvignon-dominant: structured, tannic, cassis-and-cedar, age-worthy."],
    ["Right Bank","Saint-Émilion + Pomerol, on clay/limestone. Merlot-dominant: plush, round, plum-and-chocolate, approachable young."],
    ["The blend principle","Each grape covers another's weakness — Cabernet's structure, Merlot's flesh, Cab Franc's perfume. Consistency across vintages is the goal."],
    ["1855 Classification","The historic ranking of top Médoc châteaux into five growths (crus). Cru Bourgeois sits just below — the value sweet spot."],
    ["Graphite / cedar","Classic Left Bank descriptors — pencil-shaving minerality and cigar-box cedar (the latter partly from oak). Hallmarks of mature Cabernet."],
    ["Cabernet Franc (Loire)","The aromatic Cabernet, shown solo in Chinon, Bourgueil, and Saumur-Champigny: raspberry, graphite, a leafy bell-pepper/pencil-shaving lift, brisk acid, moderate tannin. The parent of Cabernet Sauvignon."]
  ],
  taste:[
    "<b>Left Bank structure:</b> firm, drying tannin, high acid, blackcurrant, cedar, graphite, a leafy tobacco edge.",
    "<b>Right Bank flesh:</b> softer tannin, plush mid-palate, plum, black cherry, chocolate.",
    "<b>Spot Cabernet Franc:</b> a leafy, pencil-shaving, bell-pepper lift — more aromatic and 'green' than the others.",
    "<b>Tannin quality:</b> ripe and fine, or green and astringent? Bordeaux is where tannin quality becomes a key judgement.",
    "<b>New World contrast:</b> the Chilean/Niagara Cab is riper, softer, more fruit-forward and upfront than the French wines."
  ],
  wines:[
    ["🍷","Médoc / Haut-Médoc Cru Bourgeois","Left Bank, Bordeaux · ~$25–40","Cabernet-dominant structure at a sane price. Cru Bourgeois is the value entry to classed-growth style."],
    ["🍷","Saint-Émilion or Lalande-de-Pomerol","Right Bank, Bordeaux · ~$30–45","Merlot-dominant plushness. Lalande-de-Pomerol is the affordable neighbour to grand Pomerol."],
    ["🍷","Chilean (Maipo/Colchagua) or Niagara Cabernet","New World · ~$20–35","The warm-site comparator — riper, softer, more upfront Cabernet. Shows what Bordeaux's grape becomes elsewhere."],
    ["🍷","Chinon or Bourgueil — Loire Cabernet Franc","Loire, France · ~$22–32","Cabernet Franc solo: raspberry, graphite, a leafy bell-pepper lift, brisk acid, moderate tannin. The clearest lesson in the grape's fingerprint."]
  ],
  sessions:[
    {tag:"Session A · the two banks",title:"Left Bank vs. Right Bank",steps:[
      "Two glasses at ≈17°C, 50ml each. The Cabernet-led Left and the Merlot-led Right.",
      "Nose and taste for the contrast: structure & cassis vs. flesh & plum. Predict which bank is which.",
      "Assess tannin: which is firmer and more drying? (Left.) Which is rounder? (Right.)",
      "Both reward 30+ minutes of air — re-taste and note how the tannin softens."
    ],tip:"Bordeaux can be austere young. Don't judge it on the first sip — give it air, and pair with food (steak, lamb) to see it bloom."},
    {tag:"Session B · Old vs. New World Cab",title:"Add the New World Cabernet",steps:[
      "Coravin the Left Bank and pour the New World Cab beside it — both Cabernet-led.",
      "Note ripeness and tannin: New World = riper fruit, softer, more upfront; Bordeaux = leaner, more structured, more savoury/leafy.",
      "Decide which style you prefer and articulate why."
    ],tip:"This Old/New World Cabernet contrast is one of the most common blind-tasting questions in the wine world. Practise the call."}
  ],
  quiz:[
    ["Left Bank vs. Right Bank: soil, dominant grape, style.","<b>Left Bank:</b> gravel soils → Cabernet Sauvignon-dominant → structured, tannic, cassis/cedar, age-worthy. <b>Right Bank:</b> clay/limestone → Merlot-dominant → plush, round, plum/chocolate, approachable younger."],
    ["Why does Cabernet Sauvignon dominate the Left Bank specifically?","Cabernet is <b>late-ripening</b> and needs warmth; the Left Bank's deep <b>gravel soils drain well and radiate stored heat</b>, helping the grape ripen fully. The cooler clay of the Right Bank suits earlier-ripening Merlot instead."],
    ["Name three classic descriptors of mature Left Bank Bordeaux.","<b>Blackcurrant (cassis), cedar/cigar box, graphite/pencil-shaving</b> (also: tobacco, leather, leafy/tobacco). The cedar comes partly from oak; the rest from ripe Cabernet with age."],
    ["How would you spot Cabernet Franc in a blend?","Its distinctive <b>leafy, pencil-shaving, bell-pepper, red-fruit perfume</b> — more aromatic and 'green' (pyrazine-influenced) than Cabernet Sauvignon or Merlot, with a lifted, floral-herbal quality."],
    ["What is the 1855 Classification, and what is Cru Bourgeois?","The <b>1855 Classification</b> ranked the top Médoc (and Sauternes) châteaux into five tiers of 'growths' (crus) for the Paris Exposition; it's largely unchanged since. <b>Cru Bourgeois</b> is a separate, lower designation for quality Médoc estates below the classed growths — the value sweet spot."],
    ["Blind: firm drying tannin, high acid, cassis, cedar, graphite, leafy edge, medium+ body. Grape, region, bank?","<b>Cabernet Sauvignon-dominant Left Bank Bordeaux</b> (Médoc). The firm tannin, cassis-cedar-graphite trio, and savoury leafy edge are the giveaways."],
    ["Blind: a Cabernet-led red but riper, softer, more upfront blackcurrant and less leafy savour, gentle tannin. Old or New World?","<b>New World</b> (e.g. Chile, Niagara, Australia). Warmer sites give riper fruit, softer/rounder tannin, more immediate fruit-forwardness, and less of Bordeaux's austere leafy-savoury structure."]
  ],
  reading:[
    "<b>World Atlas of Wine</b> — Bordeaux (Médoc, then Saint-Émilion/Pomerol).",
    "<b>Wine Folly</b> — Cabernet Sauvignon, Merlot, Cabernet Franc pages; Bordeaux blend explainer.",
    "<b>The Wine Bible</b> — Bordeaux chapter."
  ]
},

/* ---------------- MODULE 8 ---------------- */
{
  id:"m8", nav:"Italy I — Sangiovese", navnum:"8", type:"module",
  title:"Italy I — Sangiovese & Tuscany",
  deck:"Italy's most-planted red grape and the soul of Tuscany — high-acid, savoury, food-shaped — plus the rebellion that rewrote the rules: the Super Tuscans.",
  tags:[["old","old world"]],
  lesson:`
    <p class="lead">Sangiovese is the great red grape of central Italy, and it has a personality unlike anything in the French canon: high acid, high-ish tannin, only medium colour and body, and a flavour profile that runs savoury — tart red cherry and plum, yes, but also dried herbs, tomato leaf, leather, balsamic, and earth. It is built for the table, not the spotlight. A great Sangiovese tastes of a meal waiting to happen.</p>
    <p>Its heartland is <strong>Tuscany</strong>, and the reference is <strong>Chianti Classico</strong> — the historic core zone (the black-rooster, <em>Gallo Nero</em>, seal marks the real thing) between Florence and Siena. Good Chianti Classico is sour-cherry bright, herbal, leathery, with mouthwatering acid that makes it sing with tomato-based food. Above it sit <em>Riserva</em> and the top tier <em>Gran Selezione</em>, with more concentration and oak.</p>
    <p>Forty minutes south, around the hill town of Montalcino, Sangiovese (a clone locally called Brunello) makes <strong>Brunello di Montalcino</strong> — a bigger, riper, more powerful and long-lived expression, aged for years before release and priced accordingly. Its little brother, <strong>Rosso di Montalcino</strong>, offers much of the character younger and cheaper — the smart buy for this module. (Vino Nobile di Montepulciano is a third Sangiovese-based Tuscan, worth knowing.)</p>
    <div class="pull">The DOC/DOCG system is Italy's appellation law: DOCG (the 'G' adds 'Guaranteed') is the top tier. But the most interesting Tuscan wines deliberately opted out of it — and that's the Super Tuscan story.</div>
    <p>In the 1970s, producers began blending Sangiovese with — or replacing it by — Cabernet Sauvignon and Merlot, ageing in French barriques, making wines that the rigid DOC rules wouldn't recognise. Forced to label them as humble <strong>'Vino da Tavola'</strong> (table wine), wines like Tignanello and Sassicaia nonetheless became some of Italy's most celebrated and expensive — the <strong>Super Tuscans</strong>. The law eventually created the <strong>IGT Toscana</strong> category to accommodate them. Tasting a traditional Chianti beside a modern, Cabernet-inflected Super Tuscan shows the whole arc of the region: from savoury, acid-driven tradition to plush, international modernity.`,
  concepts:[
    ["Sangiovese signature","High acid, medium tannin, medium colour/body; tart red cherry, dried herbs, tomato leaf, leather, balsamic. The savoury, food-shaped Italian red."],
    ["Chianti Classico","The historic core Chianti zone (Gallo Nero seal). Sour-cherry, herbal, leathery, high-acid Sangiovese. Riserva and Gran Selezione sit above."],
    ["Brunello / Rosso di Montalcino","Montalcino's powerful, long-aged Sangiovese (Brunello) and its younger, affordable sibling (Rosso) — the value pick."],
    ["DOC / DOCG","Italy's appellation tiers; DOCG ('Guaranteed') is top. Rigid rules that the Super Tuscans famously rejected."],
    ["Super Tuscan / IGT","Sangiovese blended with or replaced by Bordeaux grapes, aged in French oak. Once 'table wine,' now prized; the IGT Toscana category was created for them."]
  ],
  taste:[
    "<b>The acid:</b> Sangiovese's high, mouthwatering acidity is its defining trait — it's why these wines crave food.",
    "<b>Savoury, not sweet:</b> hunt tart red cherry, dried herbs, tomato leaf, leather, balsamic — the un-fruity Italian character.",
    "<b>Tradition vs. modernity:</b> Chianti = savoury, lean, acid-driven; Super Tuscan = plusher, oakier, riper, more 'international.'",
    "<b>Oak signature:</b> French barrique on a Super Tuscan adds vanilla, sweet spice, polish — contrast with traditional large-cask Chianti.",
    "<b>Food test:</b> a bite of something tomato-based makes traditional Chianti bloom; the acid and the dish lock together."
  ],
  wines:[
    ["🍷","Chianti Classico (Riserva if possible)","Tuscany, Italy · ~$25–35","The savoury, high-acid Sangiovese reference. Look for the Gallo Nero (black rooster) seal."],
    ["🍷","Rosso di Montalcino","Tuscany, Italy · ~$30–40","Brunello's younger sibling — riper, rounder Sangiovese at a fraction of Brunello's price. The smart buy."],
    ["🍷","Super Tuscan IGT (Sangiovese-Cabernet/Merlot)","Tuscany, Italy · ~$35–60","The modern, internationally-styled foil — plush, oaky, Bordeaux-inflected. Shows tradition vs. modernity in one flight."]
  ],
  sessions:[
    {tag:"Session A · tradition vs. modernity",title:"Chianti vs. Super Tuscan",steps:[
      "Two glasses at ≈17°C, 50ml each. The traditional Chianti Classico and the modern Super Tuscan.",
      "Nose and taste for the divide: savoury/herbal/lean vs. plush/oaky/ripe.",
      "Both are Sangiovese-based — find the shared high acid and red cherry beneath the stylistic difference.",
      "Note which you prefer with and without food."
    ],tip:"Italian reds almost always improve with food. Taste these alongside something — even simple bread and olive oil — to see them in their element."},
    {tag:"Session B · the Montalcino step-up",title:"Add Rosso di Montalcino",steps:[
      "Coravin the Chianti and pour the Rosso di Montalcino beside it — both traditional-leaning Sangiovese.",
      "Note the Rosso's riper, rounder, slightly more powerful profile vs. the leaner Chianti.",
      "This previews what full Brunello does at greater concentration and price."
    ],tip:"If you ever splurge on a true Brunello, revisit this comparison — the Rosso is the affordable map to that territory."}

/* ---------------- MODULE 9 ---------------- */
{
  id:"m9", nav:"Italy II — Nebbiolo & North", navnum:"9", type:"module",
  title:"Italy II — Nebbiolo & the North",
  deck:"The grape that confounds everyone: pale as Pinot, tannic as a young Cabernet, scented of tar and roses. Plus the Veneto's trick of drying grapes to concentrate them into Amarone.",
  tags:[["old","old world"]],
  lesson:`
    <p class="lead">Nebbiolo breaks the rule that pale wines are light wines. It produces a wine that's pale garnet — often bricking at the rim even when young — and almost translucent, yet hits the palate with <strong>massive tannin and searing acid</strong>. New tasters consistently misjudge it: the eye says delicate, the mouth says iron fist. That paradox is the whole lesson, and once internalised it makes Nebbiolo unmistakable.</p>
    <p>Its home is <strong>Piedmont</strong>, in the northwest, where it makes <strong>Barolo</strong> and <strong>Barbaresco</strong> — both DOCG, both 100% Nebbiolo, Barolo the bigger and longer-lived, Barbaresco usually a touch more approachable. The signature aromas are extraordinary and specific: <strong>tar and roses</strong> (the classic phrase), plus dried cherry, truffle, leather, dried herbs, and a sweet-savoury rose-petal perfume sitting incongruously atop ferocious structure. The entry point — and the smart buy — is <strong>Langhe Nebbiolo</strong>, the declassified younger wine that shows the grape's character without Barolo's price or cellaring demand.</p>
    <p>There's a tradition divide worth tasting for. <strong>Traditional Barolo</strong> uses long maceration and large old casks (botti), making austere, tannic, aromatic wines that need a decade. <strong>Modern Barolo</strong> uses shorter maceration and French barriques, making darker, plusher, oak-touched, earlier-drinking wines. Both are legitimate; the debate is one of the great arguments in wine.</p>
    <div class="pull">Then east to the Veneto and a completely different idea: appassimento — drying grapes for months before fermentation to concentrate their sugar and flavour. It's how Amarone is made.</div>
    <p>The Veneto's <strong>Valpolicella</strong> is normally a light, cherry-bright everyday red (Corvina is the main grape). But dry the grapes on mats for months and ferment them dry and you get <strong>Amarone della Valpolicella</strong> — a rich, high-alcohol (15–16%), raisined, port-like-but-dry powerhouse of dried cherry, fig, chocolate, and bitter almond. The clever middle path is <strong>Ripasso</strong>: ordinary Valpolicella re-passed over the leftover Amarone skins to pick up some of that richness — 'baby Amarone.' Tasting a regular Valpolicella, a Ripasso, and (if you splurge) an Amarone shows the appassimento technique escalating step by step.`,
  concepts:[
    ["The Nebbiolo paradox","Pale colour, light body to the eye — but huge tannin and high acid on the palate. The grape's defining, deceptive signature."],
    ["Tar & roses","The classic Barolo descriptor: dark tar/asphalt savour beneath a sweet rose-petal perfume, with dried cherry, truffle, and leather."],
    ["Langhe Nebbiolo","Declassified, younger, affordable Nebbiolo — the grape's character without Barolo's tannin overload or price. The module's value buy."],
    ["Traditional vs. modern Barolo","Long maceration + large old casks (austere, aromatic, needs age) vs. short maceration + French barrique (darker, plusher, earlier). A famous stylistic split."],
    ["Appassimento","Drying grapes for months to concentrate sugar and flavour before fermentation — the technique behind Amarone (and Recioto)."],
    ["Ripasso","Valpolicella re-fermented over leftover Amarone skins to gain richness. 'Baby Amarone' — the affordable middle path."]
  ],
  taste:[

  wines:[

    ["🍷","Valpolicella + Ripasso (and Amarone if you splurge)","Veneto, Italy · ~$18 / ~$28 / ~$50+","The appassimento ladder — light cherry, then richer Ripasso, then raisined Amarone. Shows the drying technique step by step."]
  ],
  sessions:[
    {tag:"Session A · the paradox",title:"Nebbiolo, studied",steps:[
      "Pour the Langhe Nebbiolo (or Barolo) at ≈17°C, 60ml.",
      "Sight: note the pale, bricking garnet. Predict a light wine — then disprove it on the palate.",

    ["What is the 'Nebbiolo paradox'?","Nebbiolo makes wines that look <b>pale and light</b> (pale garnet, bricking early, almost see-through) but taste <b>massively structured</b> — very high tannin and high acid. Eye and palate disagree, which fools new tasters."],

{
  id:"m10", nav:"Spain & Portugal", navnum:"10", type:"module",
  title:"Spain & Portugal",
  deck:"Two Iberian giants where the key variable isn't just grape or place but time in oak — and where a grape grown for fortified wine makes some of the most exciting dry reds in Europe.",
  tags:[["old","old world"]],
  lesson:`
    <p class="lead">Spain and Portugal teach a lever you haven't focused on yet: <strong>ageing regime</strong>. In Spain especially, how long a wine spends in oak and bottle before release is written into the label — and it transforms the wine as much as the grape does. Learn to read those words and you can predict the style before you pull the cork.</p>
    <p>Spain's classic region is <strong>Rioja</strong>, built on the <strong>Tempranillo</strong> grape — red fruit, leather, tobacco, with moderate everything. But Rioja's signature comes from its traditional love of <strong>American oak</strong>, which donates a distinctive sweet coconut-vanilla-dill note, and from its ageing ladder: <strong>Crianza</strong> (modest ageing), <strong>Reserva</strong> (more), <strong>Gran Reserva</strong> (the most — years in oak and bottle before release, giving savoury, dried, tertiary, almost delicate old-wine character). A traditional Gran Reserva can taste mature and gentle the day you buy it.</p>
    <p><strong>Ribera del Duero</strong>, on the high plateau, also grows Tempranillo (locally Tinto Fino) but in a modern, fuller, darker, French-oaked, more powerful style — the bold counterpoint to traditional Rioja. Setting a traditional Rioja Reserva (American oak, savoury) beside a modern Ribera (French oak, powerful) is the cleanest oak-and-style lesson in the module.</p>
    <div class="pull">Then Portugal — long underrated for dry wine because its best grapes were busy making Port. The Douro proved they make extraordinary dry reds too.</div>
    <p>Portugal's <strong>Douro</strong> Valley grows the same grapes that make Port — <strong>Touriga Nacional</strong> (structured, floral, violet-and-blackberry), Touriga Franca, Tinta Roriz (Tempranillo) — but increasingly bottles them as powerful, aromatic, mineral <em>dry</em> reds. And the cooler, granite-soiled <strong>Dão</strong> region — your Adega de Penalva bottle — makes more elegant, fragrant, high-acid reds, often called Portugal's Burgundy in spirit. Tasting a Douro and a Dão alongside the Spanish wines shows how the Iberian peninsula spans from oak-driven tradition to fresh, indigenous-grape modernity. Few wine regions offer more discovery for the money.`,

/* ---------------- MODULE 11 ---------------- */
{
  id:"m11", nav:"Sparkling", navnum:"11", type:"module",
  title:"Sparkling Wine",
  deck:"Where method matters more than grape. The difference between Champagne and Prosecco isn't mainly the fruit — it's how the bubbles got there, and what the wine sat on while they formed.",
  tags:[["white","sparkling"],["old","old world"],["new","new world"]],
  lesson:`
    <p class="lead">With sparkling wine, the central question shifts from 'what grape?' to 'how were the bubbles made?' — because the production method shapes flavour, texture, and price more than the variety does. Master two methods and one concept (autolysis) and the entire sparkling world organises itself.</p>
    <p>The prestige method is the <strong>traditional method</strong> (méthode champenoise / méthode traditionnelle): a still base wine is bottled with a little yeast and sugar, and a <strong>second fermentation happens inside that very bottle</strong>, trapping CO₂. The wine then ages <em>on the dead yeast cells (the lees)</em> for months or years — and this is the key. As the yeast breaks down (a process called <strong>autolysis</strong>), it donates the signature flavours of fine fizz: <strong>brioche, toast, biscuit, fresh bread, almond</strong>. The longer on lees, the more of this complexity. This is how <strong>Champagne</strong>, <strong>Crémant</strong> (French, outside Champagne), <strong>Cava</strong> (Spain), <strong>Franciacorta</strong> (Italy), and the best <strong>English</strong> and <strong>Niagara</strong> sparklers are made.</p>
    <p>The cheaper, fruitier route is the <strong>tank method</strong> (Charmat): the second fermentation happens in a big pressurised <em>tank</em>, not the bottle, and the wine sees little or no lees ageing. The result keeps the grape's fresh primary fruit and floral character but lacks the bready autolysis notes. This is how <strong>Prosecco</strong> is made — which is why Prosecco tastes of pear and white flowers and apple, bright and simple, rather than toast.</p>
    <div class="pull">Toast and brioche = time on the lees = traditional method. Fresh pear and florals with no bready note = tank method. That single distinction explains most sparkling wine.</div>
    <p>A few more terms. <strong>Dosage</strong> is the small amount of sugar added at the end, setting the sweetness: from <em>Brut Nature/Zero</em> (bone dry) through <em>Extra Brut</em>, <em>Brut</em> (the standard, off-dry-ish but tasting dry), to <em>Demi-Sec</em> (noticeably sweet). For Champagne specifically: <strong>NV (non-vintage)</strong> blends years for house consistency; <strong>vintage</strong> is a single great year; <strong>blanc de blancs</strong> is all Chardonnay (lean, citrus, elegant); <strong>blanc de noirs</strong> is from the black grapes Pinot Noir/Meunier (rounder, fuller). And <strong>grower Champagne</strong> (look for 'RM' on the label) is made by the same estate that farms the grapes — often more characterful and better value than the big houses. Your flight: a traditional-method wine (Champagne or a Niagara/Crémant stand-in) against a Prosecco makes the method difference vivid in one sip.`,
  concepts:[
    ["Traditional method","Second fermentation inside the bottle, then ageing on the lees. Gives fine, persistent bubbles and brioche/toast complexity. Champagne, Crémant, Cava, Franciacorta."],
    ["Tank (Charmat) method","Second fermentation in a pressurised tank, little lees contact. Keeps fresh primary fruit and florals, no bready notes. Prosecco's method."],
    ["Autolysis","The breakdown of dead yeast (lees) that donates brioche, toast, biscuit, bread, and almond flavours. The soul of traditional-method sparkling."],
    ["Dosage","Sugar added at the end, setting sweetness: Brut Nature/Zero → Extra Brut → Brut (standard) → Demi-Sec. 'Brut' tastes dry."],
    ["NV vs. vintage / BdB vs. BdN","NV blends years for consistency; vintage is one great year. Blanc de blancs = all Chardonnay (lean); blanc de noirs = black grapes (rounder)."],
    ["Grower Champagne (RM)","Champagne made by the estate that grows the grapes (label code 'RM'). Often more distinctive and better value than the big négociant houses."]
  ],
  taste:[
    "<b>Find autolysis:</b> in the traditional-method wine, hunt brioche, toast, biscuit, fresh bread — the sign of lees ageing.",
    "<b>Tank-method freshness:</b> in the Prosecco, note bright pear, apple, white flowers — and the absence of bready notes.",
    "<b>Bubble texture:</b> traditional method gives finer, more persistent, creamier mousse; tank method gives larger, frothier, shorter-lived bubbles.",
    "<b>Read the dosage:</b> does it finish bone-dry (Brut Nature/Extra Brut) or with a touch of sweetness (Brut/Demi-Sec)?",
    "<b>Style of base wine:</b> blanc de blancs reads lean and citrussy; blanc de noirs reads rounder and fuller."
  ],
  wines:[
    ["🍾","Grower Champagne (RM) or solid NV","Champagne, France · ~$55–80","The reference for autolytic complexity — brioche, toast, fine mousse. A grower (RM) often beats a big house on character and value."],
    ["🍾","Crémant de Bourgogne / Loire / Limoux, or Niagara traditional-method","France / Ontario · ~$25–45","The affordable traditional-method comparator — same method, lower price. Henry of Pelham Cuvée Catharine is the Niagara pick; Limoux is the most historic Crémant region."],
    ["🍾","Domaine Collin Crémant de Limoux Brut, Cuvée Tradition","Limoux, France · in your cellar","Your own French Crémant — Chardonnay/Chenin-led traditional method from sparkling's likely birthplace. The ideal real-bottle anchor for this module's Crémant slot."],
    ["🍾","Prosecco (Conegliano Valdobbiadene if possible)","Veneto, Italy · ~$18–25","The tank-method foil — fresh pear, apple, florals, no toast. Makes the method difference unmistakable."]
  ],
  sessions:[

  quiz:[

    ["What is autolysis and what does it give the wine?","The <b>breakdown of dead yeast cells (lees)</b> during ageing, which donates <b>brioche, toast, biscuit, bread, and almond</b> flavours. It's the signature of traditional-method sparkling and increases with lees-ageing time."],

    ["NV vs. vintage Champagne — what's the distinction?","<b>NV (non-vintage)</b> blends wines from multiple years to maintain a consistent house style. <b>Vintage</b> Champagne is from a single declared (usually superior) year and is made only in good vintages, aged longer."],

  title:"Fortified & Dessert Wines",
  deck:"The most underrated category in wine, and the perfect finale — because it's where the Coravin truly shines: fortified wines last for weeks, so you can study them slowly. The grand finish.",
  tags:[["white","fortified"],["old","old world"]],
  lesson:`
    <p class="lead">Fortified and dessert wines feel intimidating and are routinely skipped — which is exactly why they're a rewarding place to end. The organising idea is simple once stated: these wines get their sweetness (or deliberate dryness) and their power from <strong>when</strong> a neutral grape spirit is added, or from <strong>how</strong> the grapes were concentrated. Get the 'when' and the 'how' and the whole category clicks.</p>
    <p><strong>Port</strong> (from Portugal's Douro) is fortified <em>during</em> fermentation: the spirit is added while there's still unfermented sugar, which kills the yeast and <strong>leaves the wine sweet</strong> and strong (≈20%). Its main styles split by ageing vessel: <strong>Ruby/LBV</strong> (aged in tank/bottle → fresh, fruity, purple, blackberry) versus <strong>Tawny</strong> (aged in small barrels for years → oxidised, amber, nutty, caramel, dried-fig). <strong>Vintage Port</strong> is the pinnacle — a single great year, bottle-aged for decades.</p>
    <p><strong>Sherry</strong> (from Andalucía, Spain) is fortified <em>after</em> fermentation finishes, so the base is <strong>bone dry</strong> — and then the magic happens. Lighter styles (<strong>Fino, Manzanilla</strong>) age under a protective film of living yeast called <em>flor</em>, staying pale, bracingly dry, and saline-almondy. Without flor, sherry oxidises into <strong>Amontillado</strong> (amber, nutty) and <strong>Oloroso</strong> (dark, rich, walnut) — still dry. <strong>PX (Pedro Ximénez)</strong> is the sweet exception: raisined grapes making a black, molasses-and-fig dessert syrup. The <strong>solera</strong> system fractionally blends old and young wine for consistency.</p>
    <div class="pull">Port: fortified during fermentation → sweet. Sherry: fortified after → dry (unless from dried PX grapes). That single timing difference explains the two great fortified families.</div>
    <p>The unfortified dessert wines get their sweetness from <strong>concentrating sugar in the grape</strong>. <strong>Sauternes</strong> (Bordeaux) relies on <em>noble rot</em> — the benevolent fungus <em>Botrytis cinerea</em>, which shrivels grapes and concentrates them while adding a honeyed, apricot, marmalade complexity. <strong>Tokaji</strong> (Hungary) also uses botrytis, its sweetness graded in <em>puttonyos</em>. <strong>Icewine</strong> (Canada's specialty) freezes grapes on the vine and presses out concentrated juice, leaving the water behind as ice. Whatever you taste, the structural lesson is the same as Module 4's Riesling: in a great sweet wine, <strong>acidity balances the sugar</strong> so it finishes fresh, not cloying. Study one fortified and one botrytised wine slowly, over weeks via Coravin, and you'll end the course tasting things most drinkers never even try.`,

const DEEPER = {
m1:`
  <p>Start with a fact that reframes everything: <strong>most of what you call "taste" is actually smell.</strong> The tongue detects only five basic tastes — sweet, sour (acid), salty, bitter, and umami. Every fruit, flower, herb, oak, and earth note you "taste" is aroma, picked up by the olfactory bulb either by sniffing (orthonasal) or up the back of the throat as you swallow (retronasal). Pinch your nose and a wine collapses to just sweet and sour; release it and the blackberry floods back. Practical move: draw a little air over the wine in your mouth — it drives aroma up the retronasal passage and is why slurping isn't just theatre. One vocabulary note while we're on smell: a wine's youthful, grape-and-fermentation scents are its <em>aroma</em>; the deeper, complex notes that emerge only with bottle age are its <em>bouquet</em> — aroma is youth, bouquet is maturity.</p>
  <p>This is why <strong>structure and flavour use different senses</strong>, and why you can rate them independently. Sweetness sits on the tip of the tongue, acid on the sides (with that tell-tale saliva rush), bitterness at the back. The other three aren't "tastes" at all — they're physical sensations: <strong>tannin</strong> is astringency, the dry grip you feel as tannins bind the proteins in your saliva; <strong>alcohol</strong> is warmth at the back of the throat; <strong>body</strong> is viscosity, the wine's weight, skim-milk to cream. Knowing which sense each component lives in is the whole trick to scoring them one at a time instead of as a blur.</p>
  <p><strong>Temperature is a lever, not a detail.</strong> Cold mutes aroma and sharpens acid, tannin, and bitterness; warmth lifts aroma and alcohol and softens acid and tannin. That's why a fridge-cold white can taste of almost nothing and a too-warm red tastes flabby and hot. Serve a simple crisp white colder to keep it lively; let a complex red warm toward 18°C to open it up.</p>
  <div class="pull">"Do I like it?" and "Is it good?" are different questions. Keep them apart.</div>
  <p>Finally, separate <strong>preference from quality</strong>. Quality is judged on balance, intensity, complexity, and length — you can recognise a wine as high-quality and still not enjoy it, or love something you know is simple. A trained taster holds both judgments at once. This course trains the quality lens; the enjoyment score on your tasting sheet honours the preference one. Both are legitimate, and confusing them is the most common beginner stumble.</p>`,
m2:`
  <p><strong>Oak, in proper detail.</strong> Three variables decide what a barrel does. <em>Origin</em>: French oak (tight grain) gives restrained vanilla, sweet spice, and cedar; American oak (looser grain) gives louder coconut, dill, and sweet vanilla. <em>Age</em>: a new barrel donates the most flavour; after three or four uses it's "neutral," adding gentle texture and a whisper of oxygen but little taste. <em>Toast</em>: the cooper chars the inside light to heavy, dialling in more or less toast, coffee, and smoke. Barrel size matters too — a small 225-litre barrique has far more wood-to-wine contact than a big old <em>foudre</em>, so it oaks faster and harder.</p>
  <p><strong>Lees and texture — a separate axis from flavour.</strong> After fermentation the dead yeast cells (the lees) settle out. Leave the wine on them (<em>sur lie</em>) and stir them back in (<em>bâtonnage</em>) and they release mannoproteins that build a creamier, broader mouthfeel and a bready, savoury note — and protect the wine from oxygen. The key insight for your palate: this is <em>texture</em>, not flavour. A wine can feel fuller and rounder without smelling of anything more. Learning to feel mouthfeel as its own dimension, distinct from aroma, is a genuine step up in tasting.</p>
  <p><strong>One region, the whole spectrum.</strong> You don't have to leave Burgundy to taste what climate and oak do. Chablis in the cool north (on Kimmeridgian limestone) is the lean, steely, mineral end. The Côte de Beaune villages are the pinnacle of oaked Chardonnay: Meursault rich and nutty, Puligny- and Chassagne-Montrachet precise and age-worthy. The Mâconnais in the warmer south is the riper, friendlier, better-value end. Same grape, one region, steel to gold — keep that mental map and you can place almost any Chardonnay on it.</p>`,
m3:`
  <p><strong>The chemistry, a layer down.</strong> Thiols — the passionfruit/grapefruit/guava compounds — are volatile sulphur molecules that don't exist as aromas in the grape; they sit there as odourless precursors and are <em>released by yeast during fermentation</em>. That's why yeast strain and fermentation temperature dramatically change how tropical a Sauvignon smells, and why two Marlborough bottles can differ so much. Pyrazines — the green pepper/grass compounds — are different: they're <em>in the grape itself</em> and <em>fall as the fruit ripens</em>. So picking date is a lever: pick early for a greener, herbaceous wine; pick late for riper, more tropical fruit and less pyrazine.</p>
  <p><strong>Sauvignon has a serious, hidden second face.</strong> Most is fermented cool in stainless steel to lock in those volatile aromatics — the crisp, zippy style everyone knows. But barrel-ferment it and age it on lees and you get a rounder, richer, less overtly aromatic wine. In California this is often sold as <em>Fumé Blanc</em> (a marketing coinage nodding to Pouilly-Fumé). In white Bordeaux (Pessac-Léognan) it's blended with Sémillon and oak-aged into a profound, age-worthy wine that few would guess is the same grape. Your Saint-Bris sits toward the crisp end, but with a Burgundian texture that hints at this other side.</p>
  <div class="pull">When something smells "green," ask why: grape compound, underripe fruit, or winemaking? That question is the start of real diagnosis.</div>
  <p><strong>Untangling "green."</strong> Several wines read green for unrelated reasons, and sorting them is exactly the analytical habit this module builds. Sauvignon's grass and bell pepper = pyrazines. Grüner's white pepper = rotundone (a different molecule entirely). An underripe red's green streak = also pyrazines, from the Cabernet family. And a struck, vegetal greenness can be reduction (a winemaking sulphur issue) rather than the grape at all. A sniffer says "green"; a taster says <em>which</em> green, and why.</p>
  <p><strong>Two place-names worth pinning down.</strong> In the Loire, <em>Pouilly-Fumé</em> sits just across the river from Sancerre on flintier (silex) soil — near-identical grape and style, but with that extra smoky, gunflint note the "fumé" (smoked) in its name nods to. And in Austria's <em>Wachau</em>, dry whites are graded by ripeness into three rising tiers: <strong>Steinfeder</strong> (the lightest, lowest in alcohol), <strong>Federspiel</strong> (medium-bodied and dry — your Domäne Wachau bottle), and <strong>Smaragd</strong> (the ripest, fullest, most powerful). Knowing that ladder lets you predict a Wachau wine's weight before you even pour it.</p>`,
m4:`
  <p><strong>Sweetness, in actual numbers.</strong> Residual sugar (RS) is measured in grams per litre. Bone-dry is roughly 0–4 g/L; off-dry maybe 10–30; a Spätlese often 30–60; the great dessert Rieslings can sail past 150. But — and this is the module's whole point — perceived sweetness depends on the <em>ratio of sugar to acid</em>. A Mosel with 45 g/L of sugar and racing acidity tastes far less sweet than the number implies, because the acid offsets it. That's why "sweetness" on your tasting sheet is a perception call, not a lab reading: you're judging balance, not chemistry.</p>
  <p><strong>The German label, finally decoded.</strong> The Prädikat ladder — Kabinett → Spätlese → Auslese → Beerenauslese → Eiswein → Trockenbeerenauslese — ranks the <em>ripeness of the grapes at harvest</em> (the sugar in the fruit), <em>not</em> the sweetness of the finished wine. A Spätlese can be fermented bone-dry and will then say <em>Spätlese Trocken</em>. So: for reliably dry German Riesling, look for <strong>Trocken</strong> or the top-dry classification <strong>Grosses Gewächs (GG)</strong>; for reliably sweet, look to the higher Prädikats. Alsace, confusingly, is dry by default and ignores this system, labelling simply by grape.</p>
  <p><strong>Why Riesling ages like almost nothing else white.</strong> High acidity is a natural preservative, and in the sweeter styles sugar is one too — so Rieslings can evolve for decades while staying fresh. With age they trade primary lime and green apple for honey, dried apricot, toast, and that famous TDN petrol note, all while keeping vibrant acid so they never feel tired. For a grape so low in alcohol, that longevity is remarkable. Cellar one bottle and revisit it in five or ten years; few experiments teach more.</p>`,
m5:`
  <p><strong>Why Pinot is so site-sensitive — and so hard to grow.</strong> Thin skins mean low tannin, low colour (few anthocyanins), and high vulnerability to rot, frost, and heat. Pinot ripens early and can't take much warmth without losing the delicacy that's its whole point. And because it adds so little loud flavour of its own, small differences in soil (limestone vs marl vs clay), slope, and aspect show through vividly — the transparency you keep hearing about is really the grape <em>getting out of the way</em>. It's also genetically restless, throwing many clones and colour mutations: Pinot Gris and Pinot Blanc are literally Pinot Noir that mutated to grey and white.</p>
  <p><strong>In the cellar, the watchword is restraint.</strong> Colour and tannin come only from skin contact, so the winemaker's choices are visible: a cold soak before fermentation to coax out colour gently, soft versus firm extraction, and whole-cluster (stem) inclusion for a peppery, structural lift. Oak is handled carefully — too much new wood buries Pinot's fragile aromatics — so good Pinot often sees mostly older barrels. Power is never the goal; clarity is.</p>
  <p><strong>Reading a Burgundy label, and the négociant question.</strong> Burgundy sells <em>place</em>, not grape: the more specific the name, the higher the rung — regional (Bourgogne) → village (Gevrey-Chambertin) → Premier Cru (village + vineyard) → Grand Cru (just the vineyard, e.g. Chambertin). A <em>négociant</em> buys grapes or wine from many growers and bottles under its own name (Jadot, Drouhin, Faiveley — and Marchand-Tawse); a <em>domaine</em> grows its own. Both can be superb, and négociant bottlings are usually the affordable, reliable way in. Your Marchand-Tawse Bourgogne is exactly that kind of smart entry point.</p>`,
m6:`
  <p><strong>The Northern Rhône, slope by slope.</strong> Running north to south: <em>Côte-Rôtie</em> (the "roasted slope" — elegant, perfumed, the one place a little white Viognier is co-fermented in), <em>Condrieu</em> (white, 100% Viognier), <em>Hermitage</em> (the powerful, age-worthy benchmark on its single granite hill), <em>Crozes-Hermitage</em> (the big, affordable zone around it — your value entry), <em>Cornas</em> (dark and brooding, 100% Syrah), and <em>Saint-Joseph</em> (a long riverbank strip, lighter and food-friendly). Every red here is Syrah alone — this is the cool, savoury, peppery pole of the grape.</p>
  <p><strong>The Southern Rhône and the logic of blending.</strong> Here it's warm and Mediterranean, and blends rule — Châteauneuf-du-Pape permits thirteen-plus varieties. Grenache is the backbone (high alcohol, sweet red fruit) but it's pale and oxidises easily, so Syrah adds colour and structure and Mourvèdre adds savoury, meaty grip and ageability — the famous GSM. The most concentrated wines come from old-vine Grenache on the <em>galets</em>, the big round stones that soak up daytime heat and radiate it back at night. The ladder climbs Côtes-du-Rhône → CdR Villages → named villages (Cairanne, Rasteau) → crus (Gigondas, Vacqueyras, Châteauneuf-du-Pape).</p>
  <p><strong>Two techniques worth knowing.</strong> <em>Carbonic maceration</em> — whole, uncrushed berries fermenting under CO₂ — gives bright, juicy, low-tannin fruit with a candied lift; it defines Beaujolais and shows up in some Grenache. And remember <em>Mourvèdre is a sun grape</em>: it ripens late and demands real heat, which is why it thrives in the southern Rhône, in Bandol, and in your Jumilla, but barely ripens up north. Underripe, it's harshly gamey; fully ripe, it's gloriously savoury — the difference is just sunshine.</p>`,
m7:`
  <p><strong>Where tannin comes from, and why it rules Bordeaux.</strong> Tannins are phenolic compounds drawn from grape skins, seeds, and stems — and from oak barrels. They bind the proteins in your saliva, which is the dry, grippy astringency you feel on your gums. Cabernet Sauvignon is thick-skinned and seed-rich, so it's naturally high in tannin; that's why Left Bank wines are so structured and need years for those tannins to <em>polymerise</em> — link into larger, softer chains — and mellow. Tannin plus acid is the scaffolding that lets a wine age: the fruit fades, but the structure carries it for decades.</p>
  <p><strong>The classifications, untangled.</strong> Bordeaux has several overlapping systems, which trips everyone up. The <em>1855 Classification</em> ranked Médoc reds (and Sauternes) into five "growths," topped by the five First Growths — still the prestige ladder. Graves/Pessac-Léognan has its own separate list. Saint-Émilion runs its own system, revised roughly each decade, with Premier Grand Cru Classé "A" at the summit. Pomerol, strangely, has <em>no</em> classification at all — yet Pétrus is among the priciest wines on earth. Below the 1855 sits <strong>Cru Bourgeois</strong>, your value tier. Knowing which ladder a wine is on tells you most of what you need about its ambition and price.</p>
  <p><strong>Vintage, and why they blend at all.</strong> Bordeaux sits in a marginal, rainy climate, so vintages vary enormously — and the blend is partly insurance. If rain hits the early-ripening Merlot, more Cabernet can carry the wine; in a cooler year the reverse. Each grape also fills a structural gap: Cabernet Sauvignon (tannin, spine, cassis), Merlot (flesh, plummy mid-palate), Cabernet Franc (perfume and lift), Petit Verdot (colour, spice). <em>En primeur</em> is the trade of buying wine as futures while it's still in barrel. For study, a good Cru Bourgeois or a Right Bank "satellite" like Lalande-de-Pomerol gives you the architecture without the First-Growth invoice.</p>`,
m8:`
  <p><strong>The grape itself.</strong> Sangiovese is late-ripening and thin-to-medium-skinned, naturally high in acid and tannin but only moderate in colour — which is exactly why even serious Chianti is translucent ruby, never opaque. It's intensely clonal and site-sensitive: big-berried clones make simple, dilute wine, while selected small-berried clones (the "Sangiovese Grosso" of Montalcino) make the profound stuff. The high-altitude vineyards and the <em>galestro</em> (flaky marl) and <em>alberese</em> (limestone) soils of Chianti Classico give the wines their nervy acidity and herbal lift.</p>
  <p><strong>Chianti, decoded.</strong> Historically Chianti followed a 19th-century recipe from Baron Ricasoli that even blended in <em>white</em> grapes (Trebbiano) — a relic that thinned countless cheap Chiantis for decades. White grapes are now banned in Chianti Classico, which must be at least 80% Sangiovese (often 100%, or blended with native Canaiolo or with Merlot/Cabernet). The quality ladder runs Annata (the normale) → Riserva (minimum 24 months' ageing) → Gran Selezione (the top tier, estate-grown). The straw-flask <em>fiasco</em> of cliché is long gone; today's Classico is a serious wine.</p>
  <p><strong>The Super Tuscan rebellion, and Montalcino.</strong> Super Tuscans began as a revolt: producers wanted Bordeaux grapes and French barriques, which DOC law forbade, so they bottled them as humble <em>Vino da Tavola</em> — and the market paid more anyway, eventually forcing the creation of the IGT Toscana category. They split into a Bordeaux-blend style (Sassicaia, Solaia) and a Sangiovese-led modern style (Tignanello). Meanwhile <em>Brunello di Montalcino</em>, codified by the Biondi-Santi family, must be 100% Sangiovese aged around five years (two in oak) before release — hence its power and price. <em>Rosso di Montalcino</em> is the younger, declassified, far more affordable sibling, which is why it's your smart buy.</p>`,
m9:`
  <p><strong>Why Nebbiolo looks pale but hits like a hammer.</strong> Like Pinot, it's low in anthocyanins, so it's pale and bricks quickly to garnet and even orange at the rim. <em>Unlike</em> Pinot, it's very high in <em>both</em> tannin and acid — a rare, almost contradictory combination, and the source of the famous paradox: your eye says delicate, your mouth says iron fist. The name comes from <em>nebbia</em>, the fog that blankets the Langhe hills at the very late October harvest; Nebbiolo ripens late and fussily and demands the best south-facing sites to ripen its tannins at all.</p>
  <p><strong>Barolo's map and its rules.</strong> Barolo comes from eleven villages around the town of the same name. The modern trend is single-vineyard "cru" bottlings under the official <em>MGA</em> vineyard register: La Morra and Barolo communes lean perfumed and earlier-drinking; Serralunga, Monforte, and Castiglione lean powerful and structured. By law, Barolo must age roughly 38 months (18 in oak) before release, Barbaresco a little less — so even a "young" release already carries bottle age. That ageing requirement is also why the traditional-versus-modern oak choice matters so much for when the wine becomes drinkable.</p>
  <p><strong>Appassimento, in depth.</strong> Drying the harvested grapes — on mats, in racks, or hung — evaporates water and concentrates sugar, acid, and flavour, typically shedding 30–40% of the grapes' weight over weeks or months. Ferment that concentrated must fully dry and you get <em>Amarone</em> (rich, raisined, 15–16%, but dry); stop fermentation early and you get sweet <em>Recioto</em>. <em>Ripasso</em> re-ferments ordinary Valpolicella over Amarone's leftover skins for a mid-weight "baby Amarone." The constant risk is rot during the long drying, so it takes careful, airy conditions — part of why Amarone commands its price.</p>`,
m10:`
  <p><strong>Tempranillo and its many aliases.</strong> Spain's noble red ripens early (<em>temprano</em> means "early"), with moderate acid and tannin and a savoury red-fruit-and-leather core that drinks oak beautifully. It wears a different name in almost every region: <em>Tinto Fino</em> or <em>Tinta del País</em> in Ribera del Duero, <em>Tinta de Toro</em> in Toro, <em>Cencibel</em> in La Mancha, and <em>Tinta Roriz</em> or <em>Aragonez</em> in Portugal. Recognising the synonyms lets you track one grape across a dozen labels that look unrelated.</p>
  <p><strong>The Spanish ageing law, precisely.</strong> Crianza, Reserva, and Gran Reserva are legal minimums (they vary slightly by region; for Rioja reds, roughly): <em>Crianza</em> = two years total, at least one in oak; <em>Reserva</em> = three years, at least one in oak; <em>Gran Reserva</em> = five years, at least two in oak. Traditional Rioja leans on <em>American</em> oak — that coconut, dill, and sweet-vanilla signature — and long ageing, releasing wines already mellow and tertiary. Modern producers use French oak and less time for a darker, fruitier, more international style. Both philosophies coexist in Rioja now, which is why two Riojas can taste like different worlds.</p>
  <p><strong>Portugal: Port grapes gone dry.</strong> The Douro's heritage varieties — <em>Touriga Nacional</em> (structure, violets, blackberry), Touriga Franca, Tinta Roriz, Tinta Barroca — spent centuries going into Port; only since the late 20th century have they been bottled as serious dry reds, powerful and mineral on the region's schist. Cooler, higher, granite-soiled <em>Dão</em> makes more elegant, fragrant, high-acid reds (your Penalva). Both remain underpriced because the world is still catching up — the best-value discovery in this whole course. (In the green northwest, <em>Vinho Verde</em> is the crisp, sometimes lightly spritzy white worth knowing too.)</p>`,
m11:`
  <p><strong>The traditional method, step by step.</strong> Begin with a tart, fairly neutral base wine. Add <em>liqueur de tirage</em> (yeast plus sugar), cap the bottle, and a second fermentation happens <em>inside the bottle</em>, generating CO₂ that dissolves under pressure — a finished Champagne holds five to six atmospheres, about the pressure in a bus tyre. The wine then rests on the spent yeast for months or years; that's <em>autolysis</em>, the source of the brioche and toast. To clear the sediment, bottles are gradually tipped neck-down and turned (<em>remuage</em>, or riddling), the neck is frozen, and the plug of sediment is ejected (<em>dégorgement</em>). A final <em>dosage</em> sets the sweetness, and the cork goes in.</p>
  <p><strong>The labels, decoded.</strong> Dosage, driest to sweetest: <em>Brut Nature/Zero</em> (0–3 g/L) → <em>Extra Brut</em> → <em>Brut</em> (the standard, up to 12) → <em>Extra Dry</em> (confusingly, off-dry) → <em>Sec</em> → <em>Demi-Sec</em> → <em>Doux</em>. Champagne styles: <em>NV</em> blends several years for a consistent house style; <em>Vintage</em> is a single declared year; <em>Blanc de Blancs</em> is all Chardonnay (lean, citrus, age-worthy); <em>Blanc de Noirs</em> is the black grapes Pinot Noir and Meunier (rounder, fuller). <em>Grower Champagne</em> — tiny "RM" on the label — is made by the estate that farms the grapes, often more distinctive and better value than the big houses (coded "NM").</p>
  <p><strong>The other methods and places.</strong> <em>Crémant</em> is French traditional-method from outside Champagne (de Bourgogne, de Loire, d'Alsace) — same process, gentler price. <em>Cava</em> (Spain) and <em>Franciacorta</em> (Italy) are also traditional-method, Franciacorta being the prestige Italian fizz. <em>Prosecco</em> uses the tank (Charmat) method — fast, fruit-forward, with the best from the Conegliano-Valdobbiadene hills. England's cool chalk — the same geological seam that runs under Champagne — now makes excellent traditional-method sparkling, as does Niagara. One serving tip worth repeating: pour serious sparkling into a white-wine glass, not a narrow flute, so you can actually smell what you paid for.</p>`,
m12:`
  <p><strong>The solera, explained.</strong> Sherry (and some Port and Madeira) is blended through a fractional system. Barrels are stacked in tiers called <em>criaderas</em>; wine for bottling is drawn only from the oldest tier on the floor (the <em>solera</em>), which is topped up from the next-oldest, and so on up the stack. No barrel is ever fully emptied, so every bottle is a blend of many years and the house style stays uncannily consistent — while a trace of very old wine persists throughout. It's why nearly all Sherry is non-vintage, and why a "30-year" Sherry means average age, not a single harvest.</p>
  <p><strong>Port styles, sorted by how they're aged.</strong> Two families. <em>Bottle/tank-aged</em> stays fresh and fruity: Ruby, the step-up Late Bottled Vintage (LBV), and at the summit Vintage Port — a single declared year, bottled young, that ages for decades and throws a heavy sediment (decant it). <em>Barrel-aged</em> goes oxidative and nutty: Tawny, the best of it labelled with an average age (10, 20, 30, 40 Year). Worth knowing too: White and Rosé Port, and — a cousin, not a Port — <em>Madeira</em>, which is deliberately heated and oxidised until it's virtually indestructible once opened, the longest-lived wine of all.</p>
  <p><strong>Three ways to concentrate sugar.</strong> (1) <em>Noble rot</em> — <em>Botrytis cinerea</em> shrivels grapes on the vine in misty-then-sunny conditions, concentrating sugar and adding honey, apricot, and saffron: Sauternes (Sémillon-led), German and Austrian BA and TBA, and Tokaji Aszú (graded in <em>puttonyos</em>). (2) <em>Drying</em> — appassimento/passito, as with Amarone's sweet cousins Vin Santo and Recioto. (3) <em>Freezing</em> — Eiswein/Icewine, pressing grapes frozen solid on the vine so the water stays behind as ice; Canada, in your own Niagara, leads the world. In every one, the lesson from Module 4 holds: it's the <em>acid</em>, balancing the sugar, that keeps a great sweet wine fresh instead of cloying.</p>`
};

let progress = {};
const STORE_KEY = "wineCourseProgress_v1";
function loadProgress(){
  try{ const raw = window.localStorage.getItem(STORE_KEY); if(raw) progress = JSON.parse(raw)||{}; }
  catch(e){ progress = {}; }   // storage blocked (e.g. preview) → in-memory only
}
function saveProgress(){
  try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
}

  COURSE.filter(c=>c.type==="module").forEach(c=>{
    const done = progress[c.id] ? "done":"";
    html += `<div class="navlink ${done}" data-id="${c.id}"><span class="num">${c.navnum}</span><span class="ttl">${c.nav}</span></div>`;
  });
  html += `<div class="navsec">Your Notebook</div>
    <div class="navlink" data-id="tastings"><span class="num">✎</span><span class="ttl">My Tastings</span></div>`;
  html += `<div class="navsec">Reference</div>
    <div class="navlink" data-id="glossary"><span class="num">✦</span><span class="ttl">Glossary</span></div>`;
  nav.innerHTML = html;
  nav.querySelectorAll('.navlink').forEach(el=>{
    el.addEventListener('click',()=>{ go(el.dataset.id); closeSidebar(); });
  });
  updateProgressUI();
}

function updateProgressUI(){
  const total = moduleCount(), done = doneCount();
  document.getElementById('progfill').style.width = (done/total*100)+"%";
  document.getElementById('proglabel').textContent = `${done} of ${total} modules complete`;
  nav.querySelectorAll('.navlink').forEach(el=>{
    if(el.dataset.id===current) el.classList.add('active'); else el.classList.remove('active');
    const c = COURSE.find(x=>x.id===el.dataset.id);
    if(c && c.type==="module"){ el.classList.toggle('done', !!progress[c.id]); }
  });
}

function go(id){
  current = id;
  window.scrollTo({top:0,behavior:'instant'});
  if(id==="glossary"){ renderGlossary(); }
  else if(id==="tastings"){ renderTastings(); }
  else {
    const c = COURSE.find(x=>x.id===id);
    if(c && c.type==="module"){ renderModule(c); }
    else if(c){ page.innerHTML = c.render(); }
  }
  updateProgressUI();
}
window.go = go;

let tastings = [];

function loadTastings(){ try{ const r=window.localStorage.getItem(TASTINGS_KEY); if(r) tastings=JSON.parse(r)||[]; }catch(e){ tastings=[]; } }
function saveTastings(){ try{ window.localStorage.setItem(TASTINGS_KEY, JSON.stringify(tastings)); }catch(e){} }

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function fmtDate(d){ if(!d) return ''; const p=String(d).split('-'); if(p.length!==3) return d; const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0]; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function modShort(id){ if(!id||id==='general') return 'General'; const c=COURSE.find(x=>x.id===id); return c?('Module '+c.navnum):'General'; }

/* ---- chip controls (tap-to-select, like the GBC paper sheet) ---- */
function chips(group, options, sel, multi){
  const selArr = multi ? (Array.isArray(sel)?sel:[]) : (sel!=null&&sel!==''?[sel]:[]);
  const btns = options.map(o=>`<button type="button" class="chip-opt${selArr.indexOf(o)>-1?' sel':''}" data-val="${escAttr(o)}">${esc(o)}</button>`).join('');
  return `<div class="chip-group" data-group="${group}" data-multi="${multi?1:0}">${btns}</div>`;
}
function chipRow(label, group, options, sel, multi){
  return `<div class="cfld"><label>${label}</label>${chips(group,options,sel,multi)}</div>`;
}
function chipVals(group){ const c=document.querySelector('.chip-group[data-group="'+group+'"]'); if(!c) return []; return Array.from(c.querySelectorAll('.chip-opt.sel')).map(b=>b.getAttribute('data-val')); }
function chipVal(group){ const v=chipVals(group); return v[0]||''; }
document.addEventListener('click', function(ev){
  const b = ev.target.closest ? ev.target.closest('.chip-opt') : null;
  if(!b) return;
  const g = b.closest('.chip-group'); if(!g) return;
  if(g.getAttribute('data-multi')==='1'){ b.classList.toggle('sel'); }
  else { const was=b.classList.contains('sel'); g.querySelectorAll('.chip-opt').forEach(x=>x.classList.remove('sel')); if(!was) b.classList.add('sel'); }
});

      <div class="form-block">
        <div class="fb-h">Nose</div>
        ${chipRow('Quality','n_quality',QUAL2,e.n_quality)}
        ${chipRow('Intensity','n_intensity',LMH5,e.n_intensity)}
        ${chipRow('Fruit','n_fruit',FRUIT,e.n_fruit,true)}
        ${chipRow('Floral','n_floral',FLORAL,e.n_floral,true)}
        ${chipRow('Earth','n_earth',EARTH,e.n_earth,true)}
        ${chipRow('Herbal / Vegetal','n_herbal',HERBAL,e.n_herbal,true)}
        ${chipRow('Mineral','n_mineral',MINERAL,e.n_mineral,true)}
        ${chipRow('Oak','n_oak',YESNO,e.n_oak)}
        ${chipRow('Age (tertiary)','n_age',AGECHAR,e.n_age,true)}
        <div class="fld"><label>Specific aromas / other</label><textarea id="f_n_desc" placeholder="e.g. lime, green apple, honeysuckle, wet stone…">${esc(e.n_desc)}</textarea></div>
      </div>

      <div class="form-block">
        <div class="fb-h">Palate</div>
        ${chipRow('Sweetness','p_sweet',SWEET4,e.p_sweet)}
        ${chipRow('Alcohol','p_alcohol',LMH5,e.p_alcohol)}
        ${chipRow('Tannins','p_tannins',TANNIN6,e.p_tannins)}
        ${chipRow('Acidity','p_acidity',LMH5,e.p_acidity)}
        ${chipRow('Body','p_body',BODY5,e.p_body)}
        ${chipRow('Fruit','p_fruit',FRUIT,e.p_fruit,true)}
        ${chipRow('Oak','p_oak',YESNO,e.p_oak)}
        ${chipRow('Floral','p_floral',FLORAL,e.p_floral,true)}
        ${chipRow('Earth','p_earth',EARTH,e.p_earth,true)}
        ${chipRow('Herbal / Vegetal','p_herbal',HERBAL,e.p_herbal,true)}
        ${chipRow('Mineral','p_mineral',MINERAL,e.p_mineral,true)}
        ${chipRow('Finish','p_finish',FINISH5,e.p_finish)}
        ${chipRow('Age (tertiary)','p_age',AGECHAR,e.p_age,true)}
        <div class="fld"><label>Specific flavours / other</label><textarea id="f_p_desc" placeholder="e.g. citrus, grapefruit, mineral, the texture…">${esc(e.p_desc)}</textarea></div>
      </div>

      <div class="form-block">
        <div class="fb-h">Conclusions <span style="font-weight:400;font-style:italic;font-size:13px;color:var(--ink-soft)">— your blind call</span></div>
        <div class="fld-row"><div class="fld"><label>Country</label><input id="f_c_country" value="${escAttr(e.c_country)}"></div><div class="fld"><label>Region</label><input id="f_c_region" value="${escAttr(e.c_region)}"></div></div>
        <div class="fld-row"><div class="fld"><label>Appellation</label><input id="f_c_appellation" value="${escAttr(e.c_appellation)}"></div><div class="fld"><label>Grape variety</label><input id="f_c_grape" value="${escAttr(e.c_grape)}"></div></div>
        ${chipRow('Age (years)','c_age',AGEYRS,e.c_age)}
        ${chipRow('Service temp','c_temp',TEMP4,e.c_temp)}
        <div class="fld"><label>Food match</label><input id="f_c_food" value="${escAttr(e.c_food)}" placeholder="e.g. goat cheese, roast chicken"></div>

      <div class="form-block">
