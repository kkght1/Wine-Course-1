  objectives:[
    "Distinguish Northern Rhône Syrah (pepper, olive, smoked meat) from Southern Rhône GSM blends (garrigue, raspberry warmth).",
    "Explain rotundone — the pepper compound — and why cool sites amplify it.",
    "Contrast French Syrah with Australian Shiraz and articulate the ripeness spectrum of a single grape.",
    "Tell the Côte-Rôtie/Viognier co-fermentation story and connect it to your Module 4 bottle."
  ],
  lesson:[
   {h:"A river of two halves", p:[
    "The Rhône splits cleanly. The North is a narrow gorge of steep granite terraces and continental climate; Syrah is the only permitted red grape, and the appellations are a short, famous list — Côte-Rôtie, Hermitage, Cornas, Saint-Joseph, Crozes-Hermitage (the value gateway). The South opens into wide, sun-hammered Mediterranean country — galets-strewn Châteauneuf-du-Pape, Gigondas, Vacqueyras, and the ocean of Côtes du Rhône — where Grenache leads blends with Syrah and Mourvèdre (your Module 7 Monastrell!) in the classic GSM formula.",
    "Northern Syrah signature: black pepper, violet, olive tapenade, smoked meat, iron — medium-bodied despite its dark colour, with fresh acid. Southern signature: raspberry-kirsch warmth, garrigue (the wild-herb scrubland perfume — thyme, rosemary, lavender), soft generous tannin, higher alcohol. Côtes du Rhône from a good house (Guigal is the benchmark) is the affordable postcard of the South."
   ]},
   {h:"Rotundone and the pepper lesson", p:[
    "That black-peppercorn note is a real, named compound: rotundone — the same molecule that makes peppercorns peppery. It concentrates in cooler sites and cooler vintages, which makes pepper a climate thermometer inside the glass: lots of cracked pepper says cool-climate Syrah (Northern Rhône, Victoria); jammy fruit with little pepper says heat (Barossa, southern blends). Around 20% of tasters are anosmic to rotundone — test yourself honestly and note the result.",
    "And the Viognier cameo: Côte-Rôtie traditionally co-ferments Syrah with up to 20% Viognier — the white grape stabilizes colour and lifts the perfume to violets-and-apricot heights. Nose your remaining La Foule Viognier beside the Syrah and imagine the blend: that's a 60-second masterclass in why co-fermentation exists."
   ]},
   {h:"Shiraz: same grape, different sunshine (and philosophy)", p:[
    "Australia took Syrah in the 1830s, renamed it Shiraz, and built a national style: Barossa and McLaren Vale deliver opulent blackberry jam, dark chocolate, sweet spice and plush 14.5%+ warmth, historically seasoned with American oak. But Australia is a continent — cooler regions make peppery, savoury Syrah-styled wines too. The France/Australia comparison is therefore not 'restraint vs excess' but a controlled experiment in ripeness, oak choices and cultural intent. Decide what YOU like; both philosophies are legitimate.",
    "Buying note: with US wine effectively off the Ontario table, Australia, Chile and South Africa are your New World workhorses for the rest of the course — all are LCBO strengths."
   ]}
  ],

{ id:9, no:"Module Nine", title:"Bordeaux & the Cabernet Family", subtitle:"Left bank vs right bank, the 1855 myth-machine, and Chile's pyrazine connection.",
  bottles:{cellar:0, buy:2},
  objectives:[
    "Explain the left bank / right bank split — grapes, soils, and structure — and identify each blind by tannin profile.",
    "Decode a Bordeaux label: AOC hierarchy, cru classé vs cru bourgeois vs petit château, and what the 1855 classification does and doesn't tell you.",
    "Identify Cabernet Sauvignon's signature markers: cassis, graphite, cedar, and the mint/bell-pepper pyrazine echo from Module 3.",
    "Compare Old World Bordeaux restraint with a warm-climate New World Cabernet and articulate the climate logic."
  ],
  lesson:[
   {h:"One river, two banks, two recipes", p:[
    "Bordeaux is a blending region split by the Gironde estuary. The left bank (Médoc, Graves) sits on deep gravel banks that drain and radiate heat — exactly what late-ripening Cabernet Sauvignon needs. Left-bank wines are Cabernet-led: firm, grippy, cassis-and-graphite wines built for time. The right bank (Saint-Émilion, Pomerol) is cooler clay and limestone where Merlot and Cabernet Franc ripen reliably. Right-bank wines are Merlot-led: plummier, fleshier, softer-edged, approachable younger.",
    "This is the GBC Lesson 4 material with a tasting agenda attached: when a blind red shows cassis, cedar and a structured, slightly austere tannin grip, you think left bank; when it shows plum, cocoa and a rounder mid-palate, think right bank. The blend percentages are the cause — the texture is the evidence.",
    "Why blend at all? Insurance and architecture. Atlantic weather is fickle: Merlot flowers and ripens earlier than Cabernet, so a cold wet September might wreck one but spare the other. And each grape contributes a part: Cabernet the frame (tannin, acid, longevity), Merlot the flesh, Cabernet Franc the perfume (violets, leaf, spice), Petit Verdot the colour and exotic edge."
   ]},
   {h:"The 1855 classification — brilliant marketing, frozen in amber", p:[
    "For the Paris Exposition, brokers ranked Médoc châteaux into five 'growths' (crus) by price history. It has barely changed since — one promotion (Mouton, 1973) in 170 years. It classifies the château brand, not the vineyard land, and says nothing about today's quality at any given property. Below the classified growths sits cru bourgeois (now a renewable, audited tier — often the best value in the Médoc), and below that the ocean of petits châteaux.",
    "Saint-Émilion runs its own classification, redone roughly each decade (with lawsuits to match). Pomerol — home of Pétrus — has never bothered classifying anything, which tells you how much classifications ultimately matter.",
    "For your wallet: the smart Bordeaux play in Ontario is cru bourgeois Médoc or satellite-appellation right bankers ($25–45 via Vintages) from good vintages. The label words to scan: AOC (Bordeaux < Bordeaux Supérieur < Haut-Médoc < commune like Margaux), 'Grand Vin' (meaningless), and the vintage."
   ]},
   {h:"Cabernet's fingerprint — and the Chilean control sample", p:[
    "Cabernet Sauvignon is the child of Cabernet Franc × Sauvignon Blanc — and it inherited the pyrazine gene. Underripe Cabernet shows the same bell-pepper compound you nosed in Marlborough Sauvignon (Module 3); ripe Cabernet sublimates it into cassis, mint and cedar. Thick skins mean deep colour and high tannin; high acid plus tannin means age-worthiness. Oak (classically French barriques) adds cedar, graphite, tobacco and vanilla.",
    "Chile's Maipo and Colchagua valleys grow Cabernet in a warm, dry, irrigated near-paradise: riper fruit than Bordeaux, softer acid, more generous oak — but Chile's cool nights preserve a distinct minty/herbal lift that makes Chilean Cab unusually recognizable blind. Cassis + mint + dust = Chile is a respectable parlour trick.",
    "And the Carmenère footnote you already know from GBC: Chile's 'Merlot' vines turned out to be Bordeaux's lost Carmenère — the ultimate pyrazine grape. If your 'Chilean Merlot' smells of roasted red pepper and soy, you've found it."
   ]},
   {h:"Decanting, aging, and when to actually pull the cork", p:[
    "Young structured Cabernet genuinely improves with 30–60 minutes of air — decanting softens the attack and unfurls the nose (it's accelerated aging in miniature). With age, Bordeaux trades fruit for tertiary magic: cigar box, leather, pencil shavings, dried leaves; tannins polymerize and fall as sediment, hence decanting old bottles too — gently, to leave the sludge behind.",
    "Serve at 16–18°C. In a Toronto June kitchen, that means 20–25 minutes in the fridge first — warm Cabernet reads hot and soupy. Food: this is the lamb-and-steak category; tannin binds to protein and fat, which is why a rare steak makes a grippy young Cabernet taste suddenly suave."
   ]}
  ],
  wines:[
   {name:"Cru Bourgeois Médoc or Haut-Médoc (via Vintages — see shopping list)", src:"buy", role:"Left-bank reference. Target: a $25–40 cru bourgeois from a ripe vintage (2018/2019/2020/2022).",

  quiz:[

   {q:"A plummy, fleshy, soft-tannin Bordeaux most likely comes from…", o:["Pauillac","Saint-Émilion or Pomerol (right bank)","Margaux","Graves"], a:1, e:"Merlot-led right-bankers are rounder and earlier-drinking; the named left-bank communes build firmer Cabernet frames."},
   {q:"The 1855 classification ranks…", o:["Vineyard plots, updated yearly","Médoc châteaux by 1855 price history, nearly unchanged since","All of Bordeaux by blind tasting","Négociants"], a:1, e:"It froze the price hierarchy of one moment. One promotion in 170 years — useful history, weak buying guide."},
   {q:"Best-value Médoc tier for a $30 Ontario budget?", o:["First growth","Cru bourgeois","Grand Vin","Bordeaux AOC bulk"], a:1, e:"Cru bourgeois is audited and renewable — honest, structured claret without classified-growth pricing."},
   {q:"Cabernet Sauvignon is a crossing of…", o:["Merlot × Syrah","Cabernet Franc × Sauvignon Blanc","Pinot Noir × Gouais","Carmenère × Malbec"], a:1, e:"Hence the pyrazine inheritance — bell pepper when underripe, mint and cassis when ripe."},
   {q:"Pencil shavings / graphite on the nose of a structured red points to…", o:["Marlborough Sauvignon","Left-bank Bordeaux Cabernet","Beaujolais","Moscato"], a:1, e:"Graphite-cedar-cassis is the classic left-bank triad, amplified by French oak."},
   {q:"Chile's famous 'lost grape', long mislabelled as Merlot, is…", o:["Tannat","Carmenère","País","Bonarda"], a:1, e:"Your GBC Lesson 9 callback — the most pyrazine-rich Bordeaux variety, now Chile's signature."},
   {q:"Why decant a YOUNG Cabernet?", o:["To remove sediment","Air softens tannin and opens aromatics — accelerated aging","To chill it","To raise alcohol"], a:1, e:"For young wines it's about oxygen; for old wines decanting is instead about leaving sediment behind. Two different jobs, one vessel."},
   {q:"TASTE ID — opaque purple, ripe cassis, mint/eucalyptus, sweet vanilla oak, soft acid, 14.5%. Best fit?", o:["Cru bourgeois Médoc","Chilean Cabernet (Maipo/Colchagua)","Brouilly","Chianti Classico"], a:1, e:"Sunshine ripeness + mint lift + generous oak = warm-climate New World Cab; Bordeaux would bring more acid, less alcohol, more savoury edges."},
   {q:"APPLIED — Your young Bordeaux tastes hard and closed at 7pm dinner. Best rescue?", o:["Add ice","Decant it and serve with the lamb — air plus protein softens tannin","Serve it at 22°C","Open the icewine instead"], a:1, e:"Oxygen unfurls it; fat and protein bind tannin. Temperature should go down, not up — warmth amplifies alcohol, not charm."}
  ]},
{ id:10, no:"Module Ten", title:"Sparkling: Bubbles as Craft", subtitle:"Traditional method, autolysis and dosage — your Crémant de Limoux against a Cava, with a grower Champagne on the horizon.",
  bottles:{cellar:1, buy:1},
  objectives:[
    "Explain the traditional method start to finish: base wine, tirage, autolysis, riddling, disgorgement, dosage.",
    "Assess a sparkling wine systematically — mousse, autolytic character, sweetness level — on the GBC framework.",
    "Decode sparkling labels: Brut Nature → Doux, NV vs vintage, and Crémant/Cava/Champagne rules.",
    "Position grower Champagne (your Nowack target) against house styles, and against quality Crémant and Cava."
  ],
  lesson:[
   {h:"The traditional method — wine made twice", p:[
    "Every traditional-method sparkler starts as a still 'base wine': picked early, high-acid, lean, deliberately unpleasant to drink. The magic is the second fermentation in this very bottle: a dose of sugar and yeast (the liqueur de tirage) goes in, the crown cap goes on, and the yeast ferments again — but the CO₂ has nowhere to go, so it dissolves into the wine at ~6 atmospheres. The yeast then dies and the wine rests on the dead cells (the lees).",
    "That resting is autolysis: enzymes slowly break the yeast down, releasing the brioche, toast, biscuit, fresh-bread aromas that define the style. Time on lees is the quality dial — Cava minimum 9 months, Crémant 9–12, non-vintage Champagne 15 (in practice 2–3 years), vintage Champagne 3 years minimum (often far more). When you smell 'bakery' in a sparkler, you're smelling time and money.",
    "Then the cleanup: riddling twists the dead yeast into the neck, disgorgement freezes and ejects the plug, and the dosage — a small sugar-and-wine top-up — sets the final sweetness before corking. Dosage is the maker's final seasoning of acidity."
   ]},
   {h:"Reading the label: sweetness, vintage, and place", p:[
    "Sweetness ladder (memorize the weird part): Brut Nature (0–3 g/L, nothing added) → Extra Brut (0–6) → Brut (0–12, the default) → Extra Dry (12–17 — sweeter than Brut, the great labelling prank) → Sec → Demi-Sec (32–50, dessert-friendly) → Doux. Your palate test from Module 4 applies: tongue tip, first second.",
    "NV (non-vintage) is a house blend across years for a consistent style; vintage is one year's statement, made only in good years. Champagne = the region in northern France, Chardonnay/Pinot Noir/Meunier, strict rules. Crémant = the same traditional method elsewhere in France (Limoux, Loire, Alsace, Burgundy…). Cava = traditional method in Spain, mostly Macabeo/Xarel·lo/Parellada around Penedès. Prosecco is the odd one out: tank method (second ferment in a big pressurized tank), which preserves fresh pear-and-blossom fruit but skips autolysis — hence no brioche.",
    "Limoux's claim: the monks of Saint-Hilaire were bottling bubbles in 1531, a century before Dom Pérignon. Your Domaine Collin is Chardonnay-led with Chenin and Mauzac, aged well past the minimum — a serious traditional-method wine at a third of Champagne's price."
   ]},
   {h:"Grower Champagne and your Nowack thread", p:[
    "Champagne splits into houses (big maisons buying grapes from hundreds of growers, blending for consistent house style) and growers (récoltant-manipulant, 'RM' in tiny type on the label: farmers bottling their own vineyards). Grower Champagne trades consistency for individuality — single villages, single soils, often lower dosage, vintage character allowed to show. Your target, Domaine Nowack in Vandières, is exactly this school: Meunier-forward, low-dosage, oak-influenced Vallée de la Marne — bubbles as terroir wine rather than luxury brand.",
    "Meunier is Champagne's underdog third grape: river-valley workhorse, frost-hardy, bringing generous orchard fruit and early charm. A Meunier-led grower bottle against a Chardonnay-led blanc de blancs is one of wine's great compare-and-contrasts — park that for the day the Nowack lands.",
    "Tasting bubbles systematically: assess the mousse (bead size — finer suggests longer lees aging — and texture: creamy vs aggressive), then run the normal sheet. Acidity will peg the scale; that's the style. Serve 6–8°C, flute or — better for the nose — a white-wine glass."
   ]}
  ],
  wines:[
   {name:"Domaine Collin Crémant de Limoux Cuvée Tradition", src:"cellar", role:"Traditional-method benchmark — autolysis, fine mousse, and France's oldest sparkling claim.",
    sku:"From your cellar",
    key:{appearance:"Pale straw-gold, fine persistent bead, gentle creamy mousse.",
     nose:"Med+ intensity. Green apple, white peach, lemon curd, then the autolytic layer: brioche, almond pastry, a chalky mineral note.",
     palate:"Brut-dry (~8 g/L — just a kiss at the tongue tip); acidity high; alcohol medium (12–12.5%); body light-to-medium with a creamy mousse. Finish med+, citrus and biscuit.",
     conclusions:"France · Limoux · Chardonnay-led blend · drink now–3 yrs · 6–8°C. Food: oysters, fried chicken (truly), salty snacks, brunch eggs.",
     tips:"Spend a full minute on the mousse alone — bead size, persistence, texture. Then hunt brioche vs fruit balance: this wine has real lees character for the price. Note how the high acid plus bubbles scrubs the palate — the reason sparkling is the most food-flexible wine on earth."}},
   {name:"Juvé & Camps Reserva de la Familia Brut Nature Gran Reserva Cava", src:"buy", role:"Top-tier Cava — 36 months on lees and ZERO dosage, so it teaches autolysis and the sweetness ladder's bottom rung in one bottle.",
    sku:"Vintages #39815 · $24.30 · verified in stock — Wine Spectator Top 100 alum",
    key:{appearance:"Pale straw-gold, fine persistent bead — Gran Reserva lees time shows in the mousse.",
     nose:"Med+ to pronounced. Yellow apple, quince, citrus pith, fennel, then a serious autolytic layer: sourdough, toasted almond, dried herbs. Xarel·lo brings the earthy fingerprint underneath.",
     palate:"BONE DRY — Brut Nature means nothing added at dosage; acidity high; alcohol medium (12%); body light-medium with a creamy mousse. Finish med+, savoury and bone-clean with a bitter-almond close.",
     conclusions:"Spain · Cava Gran Reserva (Penedès) · Xarel·lo/Macabeo/Parellada · drink now–4 yrs · 6–8°C. Food: tapas, jamón, salty almonds, paella, sushi.",
     tips:"Two experiments in one glass. First, dosage: this is Brut Nature (0–3 g/L) vs the Crémant's Brut (~8 g/L) — taste them side by side at the tongue tip and feel the ladder's bottom two rungs. Second, autolysis: with 36 months on lees, the Cava may actually out-brioche the Limoux — bead fineness and bakery depth are your evidence. Cava's earthy personality is a feature, not a flaw."}}
  ],
  plan:[
   "<b>Note on Coravin:</b> standard Coravin doesn't work on sparkling — plan these as open-bottle sittings (a proper sparkling stopper holds fizz 2–3 days in the fridge).",
   "<b>Sitting 1 (Crémant):</b> Full sheet plus the mousse assessment. Taste at 6–8°C, then let the glass warm 10 minutes and re-nose — aromatics bloom as the chill fades.",
   "<b>Sitting 2 (Cava, day 1 or 2):</b> Full sheet. Hunt two things: the earthy Xarel·lo note the French wine lacks, and the total absence of dosage sugar at the tongue tip.",
   "<b>Sitting 3 (head-to-head):</b> Both at once: mousse texture, autolysis level (36-month Gran Reserva vs the Limoux), dosage (Brut Nature vs Brut), acid line, finish. Write one sentence on which is 'better' and one on which fits which occasion.",
   "<b>With Vince:</b> fried chicken or fish-and-chips night with the leftovers — high acid + bubbles + fried food is the pairing that converts people.",
   "<b>Watch-list:</b> when the Nowack (or any RM Champagne) lands via WineOnline, re-run this sheet on it and compare your Crémant notes — that's the real graduation exam for this module."
  ],
  reading:[
   "Wine Bible: Champagne — the traditional method walkthrough and the grower-vs-house discussion.",
   "Wine Folly: Sparkling wine pages — the method diagrams and sweetness scale.",
   "World Atlas of Wine: Champagne spread (find Vandières in the Vallée de la Marne) plus the Limoux and Penedès mentions.",
   "Your GBC notes: Lesson 3 (Champagne) — method steps and label terms."
  ],
  quiz:[
   {q:"In the traditional method, the bubbles are created by…", o:["CO₂ injection","A second fermentation inside the sealed bottle","Tank fermentation","Shaking"], a:1, e:"The liqueur de tirage restarts fermentation in the bottle; trapped CO₂ dissolves into the wine at ~6 atmospheres."},
   {q:"Brioche, toast and biscuit aromas in Champagne come from…", o:["Oak barrels","Autolysis — extended aging on dead yeast cells","Added flavouring","Malolactic only"], a:1, e:"Yeast autolysis is the signature of lees time; more months on lees, more bakery."},
   {q:"Which is SWEETER: Brut or Extra Dry?", o:["Brut","Extra Dry","Identical","Neither has sugar"], a:1, e:"The famous trap: Extra Dry (12–17 g/L) sits above Brut (0–12) on the sweetness ladder."},
   {q:"Prosecco lacks brioche notes mainly because…", o:["Wrong grapes","Tank method skips long lees aging in bottle","It's red","Too much dosage"], a:1, e:"The Charmat/tank method preserves fresh fruit but forgoes autolysis — a style choice, not a defect."},
   {q:"'RM' in small print on a Champagne label means…", o:["Reserve Magnum","Récoltant-Manipulant — a grower who farms and bottles their own fruit","Recently Made","Regional Master"], a:1, e:"Grower Champagne — the category your Nowack belongs to. Houses are 'NM' (négociant-manipulant)."},
   {q:"Crémant de Limoux's historical claim is…", o:["Highest vineyards in France","Sparkling wine documented in 1531, pre-dating Champagne's fame","First rosé","Invented dosage"], a:1, e:"The monks of Saint-Hilaire got there a century before Dom Pérignon's era."},
   {q:"Cava's earthy fingerprint grape is…", o:["Chardonnay","Xarel·lo","Riesling","Meunier"], a:1, e:"Xarel·lo brings the earthy, slightly wild note that distinguishes Cava from French sparklers."},
   {q:"Your Nowack target is notable as…", o:["A grand marque house blend","Meunier-forward, low-dosage grower Champagne from the Vallée de la Marne","A Prosecco","A Cava"], a:1, e:"Terroir-first RM Champagne — individuality over house consistency, and Meunier given the lead role."},
   {q:"TASTE ID — fine creamy mousse, high acid, lemon, marked brioche and almond pastry, bone dry. Most likely…", o:["Tank-method Prosecco","A traditional-method wine with long lees aging","Moscato d'Asti","Demi-sec"], a:1, e:"Pronounced autolysis + fine bead = traditional method with real lees time; Prosecco would show pear blossom and a frothier mousse."},
   {q:"APPLIED — Friends arrive for fried chicken night. The thinking-taster's pour is…", o:["Barossa Shiraz","The high-acid Brut sparkler — bubbles and acid scrub fried fat","Icewine","Warm Bordeaux"], a:1, e:"Acid + carbonation cut richness and reset the palate; it's the most reliable fried-food pairing in existence."}
  ]},
{ id:11, no:"Module Eleven", title:"Sweet & Fortified: Sugar as Structure", subtitle:"How sweetness is made, Port's family tree, and Ontario's icewine — the dessert-wine masterclass in small formats.",
  bottles:{cellar:0, buy:2},
  objectives:[
    "Explain the main routes to sweetness: stopped fermentation, fortification, late harvest, botrytis, and freezing.",
    "Map the Port style family — Ruby, Tawny, LBV, Vintage — and place LBV correctly within it.",
    "Articulate VQA icewine rules and why Ontario owns this category globally.",
    "Judge balance in sweet wine: why acidity, not sugar level, separates great from cloying."
  ],
  lesson:[
   {h:"Five roads to a sweet wine", p:[
    "All sweetness is unfermented grape sugar — the question is how you keep the yeast from finishing the job. Route one: stop fermentation by fortifying — add grape spirit mid-ferment, the alcohol spike kills the yeast, sugar survives. That's Port (and sweet Madeira, and Banyuls). Route two: concentrate sugar so high the yeast gives up or the maker stops it — late harvest wines. Route three: botrytis, the 'noble rot' fungus that pierces ripe grape skins in misty-morning vineyards and evaporates water, concentrating sugar, acid and a honeyed-saffron aroma — Sauternes, Tokaji, German BA/TBA. Route four: dry the grapes after picking (your appassimento friend from Module 6, pushed to sweet Recioto). Route five: freeze the grapes on the vine and press out only the sugar-rich syrup while the water stays behind as ice — icewine.",
    "The universal law of dessert wine: sugar without acid is syrup. Every legendary sweet wine — Sauternes, Mosel TBA, Niagara Riesling icewine, vintage Port — carries acidity (or in Port's case tannin and spirit) that makes the sweetness feel like ripeness rather than candy. On your sheet, the conclusions box should always ask: does it finish fresh?"
   ]},
   {h:"Port: one river, many styles", p:[
    "Port is made in the Douro — the same brutal schist terraces as your Crasto from Module 7, often the same grapes (Touriga Nacional leading). Fermentation runs hot and fast with vigorous extraction (traditionally foot-treading in granite lagares), then aguardente (77% grape spirit) crashes the party at roughly half-finished: the result is ~20% alcohol and ~100 g/L sugar.",
    "Then aging splits the family. Ruby: big tanks, bottled young — primary purple fruit. Tawny with age statement (10/20/30): long oxidative aging in small casks — the wine browns to amber and trades berries for figs, walnuts, caramel, orange peel. Vintage Port: one great declared year, bottled unfiltered at 2 years, then YOU age it for decades; it throws heavy sediment and must be decanted. LBV — your bottle — is the clever middle path: a single-vintage Port aged 4–6 years in large vats before bottling, so it drinks like a junior vintage Port now, usually filtered (no decanting needed), at a fraction of the price. Crasto's LBV keeps the lesson in the family: taste the violets-and-schist Douro DNA underneath the sweetness.",
    "Serve Port at cool room temp (14–16°C); an open LBV holds well for 4–6 weeks (it's pre-oxidized by spirit and age — your most forgiving open bottle). Pairing: blue cheese is the immortal match — salt against sweet; chocolate desserts are the crowd-pleaser."
   ]},
   {h:"Icewine: Ontario's world title", p:[
    "Icewine demands grapes left hanging into winter and pressed while frozen solid — VQA law: picked and pressed at −8°C or colder, natural freezing only (no freezer cheating, unlike some 'iced wine' products), minimum 35° Brix. Water stays in the press as ice crystals; what trickles out is a tiny yield of intensely sweet, intensely acidic nectar — often under 200 L from a tonne of grapes, which is why 200 mL costs what it does.",
    "Germany and Austria invented Eiswein, but their winters are now too unreliable; Niagara's continental climate delivers a proper deep freeze almost every year, making Ontario the world's largest and most consistent producer. Vidal is the workhorse (thick-skinned, hardy, tropical apricot-mango-honey flavours); Riesling icewine is the connoisseur's pick (higher acid, more nervy, ages beautifully); Cabernet Franc icewine is the local wild card (strawberry-rhubarb).",
    "Taste it like a serious wine, not a syrup shot: 6–8°C, small pour, and watch the acid — good Vidal icewine carries enough to finish clean despite ~200+ g/L sugar. Pairing law: the wine must be sweeter than the dessert, or the wine turns sour. Fruit tarts, crème brûlée, foie gras if you're fancy, or sharp cheddar for the contrast play."
   ]}
  ],
  wines:[
   {name:"Quinta do Crasto LBV Port (375 mL) — or Taylor Fladgate LBV", src:"buy", role:"The fortification lesson plus a Module 7 callback — Douro grapes with the sugar left in.",
    sku:"Crasto LBV 375 mL — Vintages #515536 (confirm current availability); Taylor Fladgate LBV ~$20 general list as backup",
    key:{appearance:"Deep ruby-purple, opaque core; thick slow tears (sugar + 20% alcohol).",
     nose:"Pronounced. Blackberry compote, black plum, violets, dark chocolate, fig, peppery spirit lift, a schisty mineral edge.",
     palate:"Sweet (~100 g/L) but structured; acidity medium; tannin med+ and grippy; alcohol high (19–20%, warming); body full. Finish long, cocoa and dark fruit.",
     conclusions:"Portugal · Douro (fortified) · Touriga Nacional blend · drink now–10 yrs · 14–16°C, small pour. Food: blue cheese (the classic), chocolate torte, walnuts.",
     tips:"Find the family resemblance: nose this against your memory of the dry Crasto Douro red — same violets, same dark schist fruit, now with sugar and spirit. That's the same vineyard logic expressed two ways. Note how tannin does the acid's job of balancing sugar in red dessert wine."}},
   {name:"Inniskillin Vidal Icewine (200 mL) — or Jackson-Triggs/Peller Vidal", src:"buy", role:"VQA icewine in miniature — the freeze-concentration lesson and a hometown flex.",
    sku:"Confirm SKU at LCBO — Inniskillin Vidal 200 mL typically $24–30; Peller/Jackson-Triggs Vidal 200 mL often $20–25",
    key:{appearance:"Brilliant deep gold to light amber; thick, slow, syrupy tears.",
     nose:"Pronounced. Apricot jam, mango, candied orange peel, lychee, honey, a baked-pineapple note.",
     palate:"Lusciously sweet (200+ g/L) — and the whole exam is the acid: med+ to high, which is why it finishes clean, not cloying. Alcohol low-ish (9–11%); body full and viscous. Finish long and honeyed.",
     conclusions:"Canada · Niagara Peninsula VQA · Vidal · drink now–8 yrs · 6–8°C, small pours. Food: fruit tart, crème brûlée, aged cheddar, foie gras.",
     tips:"Do the balance experiment: hold a sip, note the sugar hit, then count how fast your mouth re-waters. That salivation is the acid rescuing the wine. Then test the pairing law — taste it after a bite of something sweeter than it (a candy) and watch the wine collapse into sourness."}}
  ],
  plan:[
   "<b>Small formats, long lives:</b> both bottles hold for weeks open (Port 4–6 weeks; icewine 1–2 weeks fridge-stoppered) — no Coravin needed. Pour 30–40 mL; these are sipping lessons.",
   "<b>Sitting 1 (Port):</b> Full sheet. Concentrate on how sugar, tannin, spirit and acid balance each other — four-way tug of war.",
   "<b>Sitting 2 (icewine):</b> Full sheet at 6–8°C. The acid-salivation count is the key exercise.",
   "<b>Sitting 3 (pairing lab with Vince):</b> blue cheese + Port; fruit tart or sharp cheddar + icewine; then break the law on purpose — chocolate cake with icewine — and taste why the wine must be sweeter than the dessert.",
   "<b>Vintages watch-list:</b> a 375 mL Sauternes is the missing botrytis chapter — flag one from a monthly email when it appears ($25–40), and run this module's sheet on it as an epilogue."
  ],
  reading:[
   "Wine Bible: Port — the style family and fortification walkthrough; skim the Sauternes pages for botrytis.",
   "Wine Folly: Dessert wine overview and Port pages — the style diagram is excellent.",
   "World Atlas of Wine: Douro spread (revisit from Module 7 with Port eyes) and the Niagara Peninsula page.",
   "Your GBC notes: Lesson 8 (Portugal/Port styles) and the icewine section of the Canada material."
  ],
  quiz:[
   {q:"Port stays sweet because…", o:["Sugar is added after","Grape spirit added mid-ferment kills the yeast before sugar is consumed","The grapes are frozen","It's aged in steel"], a:1, e:"Fortification to ~20% alcohol stops fermentation cold, preserving ~100 g/L of natural grape sugar."},
   {q:"LBV Port is best described as…", o:["A blend of many old years","Single-vintage Port aged 4–6 years in vat — vintage character without decades of waiting","Unfermented juice","White Port"], a:1, e:"Late Bottled Vintage: the accessible middle child — one year's wine, pre-aged, usually filtered, ready tonight."},
   {q:"Figs, walnuts, caramel and an amber colour in Port signal…", o:["Ruby","Aged Tawny — long oxidative cask aging","Young LBV","Icewine"], a:1, e:"Oxidative aging browns the colour and converts fresh berries into dried fruit, nut and toffee notes."},
   {q:"Noble rot (botrytis) makes great sweet wine by…", o:["Adding alcohol","Evaporating water through pierced skins, concentrating sugar, acid and honeyed aromas","Freezing the grapes","Stopping fermentation"], a:1, e:"The fungus dehydrates ripe grapes in misty-then-sunny conditions — Sauternes and Tokaji owe it everything."},
   {q:"VQA icewine grapes must be naturally frozen and pressed at…", o:["0°C","−8°C or below","−2°C","Any temperature if the freezer is used"], a:1, e:"−8°C minimum, on the vine, no artificial freezing — the rule that protects the category's integrity."},
   {q:"Why does Ontario dominate world icewine production?", o:["Cheapest land","A continental climate that reliably delivers a deep natural freeze every winter","No competition","Government subsidy"], a:1, e:"Germany's Eiswein years have become rare; Niagara freezes dependably, enabling consistent annual production."},
   {q:"The immortal Port pairing is…", o:["Oysters","Blue cheese — salt against sweet","Green salad","Sushi"], a:1, e:"Salt and sweet amplify each other; Stilton and Port is the textbook example of contrast pairing."},
   {q:"The dessert-pairing law states…", o:["Wine must be drier than dessert","Wine must be sweeter than the dessert, or it tastes sour","Always serve red","Temperature doesn't matter"], a:1, e:"Sugar in food strips perceived sweetness from wine; a dessert sweeter than the wine leaves only acid behind."},
   {q:"TASTE ID — deep gold, apricot-mango-honey, lusciously sweet, vivid acidity, 10% alcohol, 200 mL bottle. Best fit?", o:["LBV Port","Niagara Vidal icewine","Fino sherry","Brut Cava"], a:1, e:"Low alcohol + tropical-honeyed lusciousness + electric acid + tiny format = icewine; Port would be 20% with tannin."},
   {q:"APPLIED — Your icewine tastes sour after a bite of chocolate cake. Why?", o:["The wine is corked","The cake out-sweetened the wine, stripping its perceived sugar and exposing acid","Wrong glass","Too cold"], a:1, e:"The pairing law in action — the dessert must never be sweeter than the wine. With fruit tart instead, the same wine sings."}
  ]},
{ id:12, no:"Module Twelve", title:"Capstone: The Blind Tasting Gauntlet", subtitle:"No new bottles, no labels, no mercy — Vince pours, you deduce. Everything you've built, under exam conditions.",
  bottles:{cellar:0, buy:0},
  objectives:[
    "Run a full deductive blind tasting: structure → climate → hemisphere → grape → region, committing to a conclusion.",
    "Demonstrate calibrated structure calls (acid, tannin, alcohol, body) consistent with your Module 1 baselines.",
    "Build a personal style map: what you love, what you respect, what you'll cellar, what you'll pour for guests.",
    "Design your continuing curriculum — Vintages email strategy, gap regions, and the next twelve bottles."
  ],
  lesson:[
   {h:"The deduction method — structure first, story second", p:[
    "Blind tasting isn't psychic flavour-naming; it's elimination. Work the grid in order. Step 1, appearance: colour depth and hue (translucent ruby ≠ opaque purple; gold ≠ straw) plus viscosity. Step 2, structure: acid level → climate (high = cool); alcohol → ripeness (high = warm); tannin quantity and texture → grape family; body → the sum. Before naming any fruit, you should already be saying 'cool-climate, moderate-alcohol, high-acid, low-tannin red' — which has nearly named Pinot or Gamay by itself.",
    "Step 3, the markers. Your course has armed you with a fingerprint kit: pyrazine bell-pepper (Sauvignon family), petrol (Riesling), lychee-rose terpenes (aromatic whites), pepper/rotundone (Syrah), coconut-dill American oak (Rioja), violets (Touriga, Cab Franc), brioche (autolysis), sour cherry + dust (Sangiovese), banana/bubblegum (carbonic Gamay), mint (Chilean Cab), garrigue (southern Rhône). One confirmed marker plus correct structure beats ten guessed fruits.",
    "Step 4, commit. Out loud, on the sheet, before the reveal: hemisphere, climate, grape, region, rough price. Being confidently wrong teaches more than being vaguely right — the error tells you exactly which calibration to fix."
   ]},
   {h:"Running the gauntlet at home", p:[
    "Logistics: Vince selects 3–4 Coravin'd survivors from the course (or fresh pours from remaining cellar bottles), pours into identical glasses out of sight, brown-bags or numbers them, and keeps the answer list. You get the sheet, good light, water, plain crackers, and no hints. Whites first, then reds, then anything sweet or sparkling last.",
    "Score yourself honestly in tiers: structure calls right (the real skill), grape family right (very good), exact region right (gravy). A miss where you called a Mâcon 'Niagara Chardonnay' is a near-bull's-eye — same grape, similar climate logic. A miss where you called Brouilly 'Barossa Shiraz' means revisiting Module 1 structure work.",
    "Repeat the gauntlet quarterly. Blind tasting is a perishable skill and a renewable pleasure — it's also the single best way to evaluate Vintages purchases honestly, free of label influence."
   ]},

};

/* ---------- tasting sheet ---------- */
function sheetHTML(mid, wi){
  const sid = `s_${mid}_${wi}`;
  const secs = SHEET.map(sec=>{
    const rows = sec.rows.map(r=>{
      if(r.area) return `<div class="frow"><label>${r.label}</label><textarea data-f="${r.id}"></textarea></div>`;
      const chips = r.chips.map(c=>{
        if(r.swatch){ const [name,col]=c; return `<button class="chip swatch" style="--sw:${col}" data-f="${r.id}" data-v="${name}" onclick="pickChip(this,'${sid}')">${name}</button>`; }
        return `<button class="chip" data-f="${r.id}" data-v="${c}" onclick="pickChip(this,'${sid}')">${c}</button>`;
      }).join('');
      return `<div class="frow"><label>${r.label}</label><div class="chips">${chips}</div></div>`;
    }).join('');
    return `<h5>${sec.sec}</h5>${rows}`;
  }).join('');
  return `<div class="sheet" id="${sid}" data-key="${wKey(mid,wi)}">
    ${secs}
    <div class="savebar">
      <button class="btn primary" onclick="saveSheet('${sid}')">Save my notes</button>
      <span class="saved-note" id="${sid}_msg"></span>
    </div>
  </div>`;
}
function pickChip(btn, sid){
  const f = btn.dataset.f;
  document.querySelectorAll(`#${sid} [data-f="${f}"].chip`).forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
}
function saveSheet(sid){
  const el = document.getElementById(sid);
  const data = {};
  el.querySelectorAll('.chip.on').forEach(c=> data[c.dataset.f]=c.dataset.v );
  el.querySelectorAll('textarea').forEach(t=> data[t.dataset.f]=t.value );
  const ok = store.set(el.dataset.key, data);
  const msg = document.getElementById(sid+'_msg');
  msg.textContent = ok ? 'Saved ✓' : 'Couldn\u2019t save (storage unavailable in preview — works on GitHub Pages)';
  setTimeout(()=>{ msg.textContent=''; }, 3500);
}
function hydrateSheets(m){
  m.wines.forEach((w,i)=>{
    const data = store.get(wKey(m.id,i)); if(!data) return;
    const el = document.getElementById(`s_${m.id}_${i}`); if(!el) return;
    Object.entries(data).forEach(([f,v])=>{
      const chip = el.querySelector(`.chip[data-f="${f}"][data-v="${CSS.escape ? CSS.escape(v) : v}"]`) || Array.from(el.querySelectorAll(`.chip[data-f="${f}"]`)).find(c=>c.dataset.v===v);
      if(chip){ chip.classList.add('on'); return; }
      const ta = el.querySelector(`textarea[data-f="${f}"]`); if(ta) ta.value = v;
    });
  });
}

/* ---------- quiz ---------- */
let quizState = {};
function quizPane(m){
  quizState = { answered:0, correct:0, total:m.quiz.length, mid:m.id };
  const prev = store.get(qKey(m.id));
  const qs = m.quiz.map((q,qi)=>`
    <div class="q" id="q_${qi}">
      <div class="qn">Question ${qi+1} of ${m.quiz.length}</div>
      <div class="qt">${esc(q.q)}</div>
      <div class="opts">${q.o.map((o,oi)=>`<button class="opt" onclick="answer(${qi},${oi},${q.a})">${esc(o)}</button>`).join('')}</div>
      <div class="explain">${esc(q.e)}</div>
    </div>`).join('');
  const done = store.get(dKey(m.id));
  return `<div style="height:16px"></div>
    ${prev?`<div class="obj"><h4>Previous attempt</h4><ol style="list-style:none;padding:0"><li>Best score: <b>${prev.score}/${prev.total}</b> — retake any time; your best stays on the card.</li></ol></div>`:''}
    ${qs}
    <div class="quizfoot" id="quizfoot">
      <div class="eyebrow">Score</div>
      <div class="score" id="scoreNum">—</div>
      <div style="font-size:.8rem;color:var(--muted);margin:6px 0 12px" id="scoreMsg">Answer all ${m.quiz.length} to log your score.</div>
      <button class="btn ${done?'ghost':'primary'}" id="doneBtn" onclick="toggleDone(${m.id})">${done?'✓ Module complete — tap to un-mark':'Mark module complete'}</button>
    </div>`;
}
function answer(qi, oi, correct){
  const qEl = document.getElementById('q_'+qi);
  if(qEl.classList.contains('answered')) return;
  qEl.classList.add('answered');
  const opts = qEl.querySelectorAll('.opt');
  opts.forEach((b,i)=>{
    b.disabled = true;
    if(i===oi) b.classList.add(i===correct?'picked-right':'picked-wrong');
    if(i===correct) b.classList.add('reveal-right');
  });
  quizState.answered++;
  if(oi===correct) quizState.correct++;
  if(quizState.answered===quizState.total){
    document.getElementById('scoreNum').textContent = quizState.correct+'/'+quizState.total;
    const prev = store.get(qKey(quizState.mid));
    const best = Math.max(quizState.correct, prev?prev.score:0);
    store.set(qKey(quizState.mid), {score:best, total:quizState.total});
    document.getElementById('scoreMsg').textContent = quizState.correct===quizState.total ? 'Perfect — the calibration is working.' : (quizState.correct>=quizState.total-2 ? 'Strong. Re-read the misses, then move on.' : 'Worth a re-read of the Learn tab before the next module.');
  }
}
function toggleDone(id){
  if(store.get(dKey(id))) store.del(dKey(id)); else store.set(dKey(id), true);
  renderModule(COURSE.modules.find(m=>m.id===id), 'quiz');
}

function renderMarkers(){
  const groups = MARKERS.map(G=>`<div class="mgroup">${esc(G.g)}</div>` + G.items.map(it=>`
    <div class="marker">
      <div class="mname">${esc(it.m)}</div>
      <div class="mpoints">→ ${esc(it.p)}</div>
      <div class="mnote">${esc(it.n)}</div>
    </div>`).join('')).join('');
  app.innerHTML = `
   <button class="backlink" onclick="location.hash=''">&larr; All modules</button>
   <div class="modhead">
     <div class="no">QUICK REFERENCE</div>
     <h2>The Marker Library</h2>
     <div class="sub">Every fingerprint the course teaches, on one screen. One confirmed marker plus correct structure beats ten guessed fruits.</div>
   </div>${groups}`;
  window.scrollTo(0,0);
}

/* ---------- cumulative review quiz ---------- */
function renderReview(){
  const doneMods = COURSE.modules.filter(m=>store.get(dKey(m.id)));
  const pool = (doneMods.length? doneMods : COURSE.modules.slice(0,1))
    .flatMap(m=>m.quiz.map(q=>({...q, src:m.no})));
  // shuffle, take 10
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const qs = pool.slice(0,10);
  quizState = { answered:0, correct:0, total:qs.length, mid:'rev' };
  const best = store.get('wc_review_best');
  const note = doneMods.length
    ? `Drawing from your ${doneMods.length} completed module${doneMods.length>1?'s':''} — retake any time, it reshuffles.`
    : `No modules marked complete yet, so this draws from Module One. Finish modules to widen the pool.`;
  app.innerHTML = `
   <button class="backlink" onclick="location.hash=''">&larr; All modules</button>
   <div class="modhead">
     <div class="no">SPACED REPETITION</div>
     <h2>Review Gauntlet</h2>
     <div class="sub">${note}${best?` Best so far: ${best.score}/${best.total}.`:''}</div>
   </div>
   <div style="height:8px"></div>
   ${qs.map((q,qi)=>`
    <div class="q" id="q_${qi}">
      <div class="qn">${esc(q.src)} · Question ${qi+1} of ${qs.length}</div>
      <div class="qt">${esc(q.q)}</div>
      <div class="opts">${q.o.map((o,oi)=>`<button class="opt" onclick="answer(${qi},${oi},${q.a})">${esc(o)}</button>`).join('')}</div>
      <div class="explain">${esc(q.e)}</div>
    </div>`).join('')}
   <div class="quizfoot">
     <div class="eyebrow">Score</div>
     <div class="score" id="scoreNum">—</div>
     <div style="font-size:.8rem;color:var(--muted);margin:6px 0 12px" id="scoreMsg">Answer all ${qs.length} to log your score.</div>
     <button class="btn ghost" onclick="renderReview()">Reshuffle &amp; retake</button>
   </div>`;
  window.scrollTo(0,0);
}

/* ---------- notes export ---------- */
function exportNotes(){
  try{
    const cols = [];
    SHEET.forEach(sec=>sec.rows.forEach(r=>cols.push(r.id)));
    const csvEsc = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    let rows = [['module','wine',...cols].map(csvEsc).join(',')];
    let count = 0;
    COURSE.modules.forEach(m=>m.wines.forEach((w,i)=>{
      const d = store.get(wKey(m.id,i)); if(!d) return;
      count++;
      rows.push([m.no+': '+m.title, w.name, ...cols.map(c=>d[c]||'')].map(csvEsc).join(','));
    }));
    // quiz summary rows
    rows.push(''); rows.push(['QUIZ SCORES'].map(csvEsc).join(','));
    COURSE.modules.forEach(m=>{ const q=store.get(qKey(m.id)); if(q) rows.push([m.no, 'best '+q.score+'/'+q.total].map(csvEsc).join(',')); });
    if(!count){ alert('No saved tasting notes yet — fill in a sheet and tap Save first.'); return; }
    const blob = new Blob(['\ufeff'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cellar-course-notes-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('Export failed — storage may be unavailable in this preview. It works on GitHub Pages.'); }
}

route();
