      <div class="form-actions">
        <button class="btn-sm solid" onclick="saveTasting(${existing?("'"+existing.id+"'"):'null'})">${existing?'Save changes':'Save note'}</button>
        <button class="btn-sm" onclick="go('tastings')">Cancel</button>
        ${existing?`<button class="btn-sm danger" onclick="deleteTasting('${existing.id}')">Delete</button>`:''}
      </div>
      <div class="save-hint">Saved on this device. Open the downloaded HTML file to keep your notes between sessions.</div>
    </div>`;
}

function fval(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function saveTasting(existingId){
  const data = {
    wine:fval('f_wine'), vintage:fval('f_vintage'), price:fval('f_price'), dateTasted:fval('f_dateTasted'), module:fval('f_module'),
    a_bright:chipVal('a_bright'), a_clarity:chipVal('a_clarity'), a_colour:chipVal('a_colour'), a_intensity:chipVal('a_intensity'), a_rim:chipVal('a_rim'), a_co2:chipVal('a_co2'), a_visc:chipVal('a_visc'),
    n_quality:chipVal('n_quality'), n_intensity:chipVal('n_intensity'), n_fruit:chipVals('n_fruit'), n_floral:chipVals('n_floral'), n_earth:chipVals('n_earth'), n_herbal:chipVals('n_herbal'), n_mineral:chipVals('n_mineral'), n_oak:chipVal('n_oak'), n_age:chipVals('n_age'), n_desc:fval('f_n_desc'),
    p_sweet:chipVal('p_sweet'), p_alcohol:chipVal('p_alcohol'), p_tannins:chipVal('p_tannins'), p_acidity:chipVal('p_acidity'), p_body:chipVal('p_body'), p_fruit:chipVals('p_fruit'), p_oak:chipVal('p_oak'), p_floral:chipVals('p_floral'), p_earth:chipVals('p_earth'), p_herbal:chipVals('p_herbal'), p_mineral:chipVals('p_mineral'), p_finish:chipVal('p_finish'), p_age:chipVals('p_age'), p_desc:fval('f_p_desc'),
    c_country:fval('f_c_country'), c_region:fval('f_c_region'), c_appellation:fval('f_c_appellation'), c_grape:fval('f_c_grape'), c_age:chipVal('c_age'), c_temp:chipVal('c_temp'), c_food:fval('f_c_food'),
    enjoyment:fval('f_enjoyment'), rebuy:chipVal('rebuy'), verdict:fval('f_verdict'),
    region:fval('f_c_region'), grape:fval('f_c_grape')
  };
  if(!data.wine){ alert("Give the wine a name before saving."); return; }
  if(existingId){
    const i = tastings.findIndex(t=>t.id===existingId);
    if(i>-1){ tastings[i] = Object.assign({}, tastings[i], data, {updatedAt:Date.now()}); }
  } else {
    data.id = 't'+Date.now()+'_'+Math.floor(Math.random()*1000);
    data.createdAt = Date.now();
    tastings.push(data);
  }
  saveTastings();
  go('tastings');
}

function viewTasting(id){
  const t = tastings.find(x=>x.id===id); if(!t){ go('tastings'); return; }
  current='tastings'; updateProgressUI(); window.scrollTo({top:0,behavior:'instant'});
  const row=(k,v)=> (v&&v.length)?`<div class="vrow"><span class="vk">${k}</span><span class="vv">${esc(Array.isArray(v)?v.join(', '):v)}</span></div>`:'';
  const any=function(){ for(let i=0;i<arguments.length;i++){ const v=t[arguments[i]]; if(v&&v.length) return true; } return false; };
  const app = any('a_bright','a_clarity','a_colour','a_intensity','a_rim','a_co2','a_visc');
  const nose = any('n_quality','n_intensity','n_fruit','n_floral','n_earth','n_herbal','n_mineral','n_oak','n_age','n_desc');
  const pal = any('p_sweet','p_alcohol','p_tannins','p_acidity','p_body','p_fruit','p_oak','p_floral','p_earth','p_herbal','p_mineral','p_finish','p_age','p_desc');
  const concl = any('c_country','c_region','c_appellation','c_grape','c_age','c_temp','c_food');
  const verd = any('enjoyment','rebuy','verdict');
  const legacy = any('noseNotes','palateNotes','sightHue','sightNotes','conclNotes','blindGuess','labelRevealed','lesson','revisit');
  const sub = [t.vintage, t.c_region||t.region, t.c_grape||t.grape].filter(Boolean).map(esc).join(' · ');
  page.innerHTML = `
    <div class="module-no">Your Notebook · ${modShort(t.module)}</div>
    <h2 class="title">${esc(t.wine||'Untitled')}</h2>
    <p class="deck">${sub}${t.dateTasted?` — tasted ${fmtDate(t.dateTasted)}`:''}</p>
    <div class="form-actions" style="margin-top:6px">
      <button class="btn-sm solid" onclick="editTasting('${t.id}')">Edit</button>
      <button class="btn-sm" onclick="go('tastings')">← All notes</button>
      <button class="btn-sm danger" onclick="deleteTasting('${t.id}')">Delete</button>
    </div>
    ${app?`<div class="view-block"><div class="vb-h">Appearance</div>${row('Brightness',t.a_bright)}${row('Clarity',t.a_clarity)}${row('Colour',t.a_colour)}${row('Intensity',t.a_intensity)}${row('Rim',t.a_rim)}${row('CO₂ / Sediment',t.a_co2)}${row('Viscosity',t.a_visc)}</div>`:''}
    ${nose?`<div class="view-block"><div class="vb-h">Nose</div>${row('Quality',t.n_quality)}${row('Intensity',t.n_intensity)}${row('Fruit',t.n_fruit)}${row('Floral',t.n_floral)}${row('Earth',t.n_earth)}${row('Herbal / Vegetal',t.n_herbal)}${row('Mineral',t.n_mineral)}${row('Oak',t.n_oak)}${row('Age',t.n_age)}${row('Specific',t.n_desc)}</div>`:''}
    ${pal?`<div class="view-block"><div class="vb-h">Palate</div>${row('Sweetness',t.p_sweet)}${row('Alcohol',t.p_alcohol)}${row('Tannins',t.p_tannins)}${row('Acidity',t.p_acidity)}${row('Body',t.p_body)}${row('Fruit',t.p_fruit)}${row('Oak',t.p_oak)}${row('Floral',t.p_floral)}${row('Earth',t.p_earth)}${row('Herbal / Vegetal',t.p_herbal)}${row('Mineral',t.p_mineral)}${row('Finish',t.p_finish)}${row('Age',t.p_age)}${row('Specific',t.p_desc)}</div>`:''}
    ${concl?`<div class="view-block"><div class="vb-h">Conclusions</div>${row('Country',t.c_country)}${row('Region',t.c_region)}${row('Appellation',t.c_appellation)}${row('Grape',t.c_grape)}${row('Age',t.c_age)}${row('Service temp',t.c_temp)}${row('Food match',t.c_food)}</div>`:''}
    ${verd?`<div class="view-block"><div class="vb-h">My verdict</div>${row('Enjoyment',t.enjoyment?(t.enjoyment+'/10'):'')}${row('Would rebuy',t.rebuy)}${row('Notes',t.verdict)}</div>`:''}
    ${legacy?`<div class="view-block"><div class="vb-h">Notes (earlier format)</div>${row('Sight',t.sightHue)}${row('Sight notes',t.sightNotes)}${row('Aromas',t.noseNotes)}${row('Palate',t.palateNotes)}${row('Verdict',t.conclNotes)}${row('Blind guess',t.blindGuess)}${row('Label said',t.labelRevealed)}${row('Lesson',t.lesson)}${row('Revisit',t.revisit)}</div>`:''}
    <div class="pager" style="margin-top:24px"><a onclick="go('tastings')"><div class="pl">← Back</div><div class="pt">All tasting notes</div></a><span></span></div>`;
}
function editTasting(id){ const t=tastings.find(x=>x.id===id); if(t) openTastingForm(t); }
function deleteTasting(id){
  if(!confirm("Delete this tasting note? This can't be undone.")) return;
  tastings = tastings.filter(t=>t.id!==id); saveTastings(); go('tastings');
}
function exportTastings(){
  const list = tastings.slice().sort((a,b)=>(a.dateTasted||'').localeCompare(b.dateTasted||''));
  const J=v=>Array.isArray(v)?v.join(', '):(v||'');
  let out = "MY WINE TASTING NOTEBOOK\n========================\n\n";
  list.forEach(t=>{
    out += (t.wine||'Untitled')+(t.vintage?(' '+t.vintage):'')+"\n";
    out += [modShort(t.module), t.dateTasted?fmtDate(t.dateTasted):'', t.price].filter(Boolean).join(' · ')+"\n";
    const ap=[["Brightness",t.a_bright],["Clarity",t.a_clarity],["Colour",t.a_colour],["Intensity",t.a_intensity],["Rim",t.a_rim],["CO2/Sed",t.a_co2],["Viscosity",t.a_visc]].filter(x=>J(x[1])).map(x=>x[0]+" "+J(x[1]));
    if(ap.length) out+="APPEARANCE: "+ap.join(', ')+"\n";
    const no=[["Quality",t.n_quality],["Intensity",t.n_intensity],["Fruit",t.n_fruit],["Floral",t.n_floral],["Earth",t.n_earth],["Herbal",t.n_herbal],["Mineral",t.n_mineral],["Oak",t.n_oak],["Age",t.n_age]].filter(x=>J(x[1])).map(x=>x[0]+" "+J(x[1]));
    if(no.length) out+="NOSE: "+no.join(', ')+"\n";
    if(t.n_desc) out+="  "+t.n_desc+"\n";
    const pa=[["Sweet",t.p_sweet],["Alcohol",t.p_alcohol],["Tannins",t.p_tannins],["Acidity",t.p_acidity],["Body",t.p_body],["Fruit",t.p_fruit],["Oak",t.p_oak],["Floral",t.p_floral],["Earth",t.p_earth],["Herbal",t.p_herbal],["Mineral",t.p_mineral],["Finish",t.p_finish],["Age",t.p_age]].filter(x=>J(x[1])).map(x=>x[0]+" "+J(x[1]));
    if(pa.length) out+="PALATE: "+pa.join(', ')+"\n";
    if(t.p_desc) out+="  "+t.p_desc+"\n";
    const co=[["Country",t.c_country],["Region",t.c_region],["Appellation",t.c_appellation],["Grape",t.c_grape],["Age",t.c_age],["Temp",t.c_temp],["Food",t.c_food]].filter(x=>J(x[1])).map(x=>x[0]+": "+J(x[1]));
    if(co.length) out+="CONCLUSIONS: "+co.join(' · ')+"\n";
    const ve=[t.enjoyment?(t.enjoyment+'/10'):'', t.rebuy?('rebuy '+t.rebuy):''].filter(Boolean).join(' · ');
    if(ve) out+="VERDICT: "+ve+"\n";
    if(t.verdict) out+="  "+t.verdict+"\n";
    if(t.noseNotes||t.palateNotes||t.conclNotes){ out+="(earlier notes) "+[t.noseNotes,t.palateNotes,t.conclNotes].filter(Boolean).join(' | ')+"\n"; }
    out += "\n----------------------------------------\n\n";
  });
  try{
    const blob = new Blob([out],{type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "wine-tasting-notebook.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(err){ alert("Export runs when you open the downloaded HTML file."); }
}

window.openTastingForm=openTastingForm; window.saveTasting=saveTasting; window.viewTasting=viewTasting;
window.editTasting=editTasting; window.deleteTasting=deleteTasting; window.exportTastings=exportTastings;

const scrim = document.getElementById('scrim');
function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('menutoggle').addEventListener('click',()=>{
  sidebar.classList.toggle('open'); scrim.classList.toggle('show');
});
scrim.addEventListener('click',closeSidebar);

/* ---- init ---- */
loadProgress();
loadTastings();
buildNav();
go('welcome');
</script>
