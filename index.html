<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>A Wine Course — Solo Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --paper:#f6efe3;
    --paper-2:#efe5d4;
    --card:#fbf6ec;
    --ink:#2a2019;
    --ink-soft:#5d4f43;
    --wine:#6b1f2a;
    --wine-bright:#8c2f3a;
    --aubergine:#3a2130;
    --brass:#a9854a;
    --brass-soft:#c5a978;
    --olive:#6a6f3f;
    --line:rgba(42,32,25,.14);
    --line-strong:rgba(42,32,25,.28);
    --shadow:0 1px 2px rgba(42,32,25,.06),0 8px 28px rgba(42,32,25,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--paper)}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Spectral',Georgia,serif;
    font-size:18px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  /* subtle paper grain */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
    background-image:radial-gradient(rgba(42,32,25,.025) 1px,transparent 1px);
    background-size:4px 4px;
  }
  .layout{display:flex;min-height:100vh;position:relative;z-index:1}

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    width:300px;flex-shrink:0;background:var(--aubergine);color:#efe2d6;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:32px 0 48px;border-right:1px solid rgba(0,0,0,.2);
  }
  .brand{padding:0 28px 22px;border-bottom:1px solid rgba(239,226,214,.16);margin-bottom:14px}
  .brand .kicker{font-family:'Spectral';font-style:italic;font-size:13px;letter-spacing:.04em;color:var(--brass-soft);text-transform:lowercase}
  .brand h1{font-family:'Fraunces';font-weight:500;font-size:27px;line-height:1.1;margin-top:6px;color:#f7ecdf;letter-spacing:-.01em}
  .brand .sub{font-size:12.5px;color:rgba(239,226,214,.6);margin-top:9px;letter-spacing:.02em}

  .progwrap{padding:14px 28px 18px}
  .progbar{height:5px;background:rgba(239,226,214,.16);border-radius:3px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-soft));transition:width .5s ease}
  .proglabel{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-soft);margin-top:8px}

  .navsec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(239,226,214,.45);padding:18px 28px 7px}
  .navlink{
    display:flex;align-items:baseline;gap:11px;padding:8px 28px;cursor:pointer;
    font-size:15.5px;color:rgba(239,226,214,.82);border-left:3px solid transparent;
    transition:background .18s,border-color .18s,color .18s;line-height:1.3;
  }
  .navlink:hover{background:rgba(239,226,214,.06);color:#fff}
  .navlink.active{background:rgba(169,133,74,.16);border-left-color:var(--brass);color:#fff}
  .navlink .num{font-family:'Fraunces';font-size:13px;color:var(--brass-soft);min-width:20px;font-variant-numeric:tabular-nums}
  .navlink.done .num::after{content:"  ✓";color:var(--olive)}
  .navlink .ttl{flex:1}

  /* ---------------- MAIN ---------------- */
  main{flex:1;min-width:0;padding:0 0 90px}
  .topbar{display:none}
  .page{max-width:820px;margin:0 auto;padding:56px 40px 0}
  .breadcrumb{font-family:'Spectral';font-style:italic;color:var(--wine);font-size:15px;letter-spacing:.02em;margin-bottom:14px}
  .module-no{font-family:'Fraunces';font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600}
  h2.title{font-family:'Fraunces';font-weight:500;font-size:42px;line-height:1.05;letter-spacing:-.02em;margin:8px 0 4px;color:var(--ink)}
  .deck{font-family:'Spectral';font-style:italic;font-size:21px;line-height:1.45;color:var(--ink-soft);margin:14px 0 8px;max-width:62ch}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 30px}
  .tag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:100px;border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--card)}
  .tag.old{border-color:rgba(107,31,42,.4);color:var(--wine);background:rgba(107,31,42,.06)}
  .tag.new{border-color:rgba(106,111,63,.5);color:var(--olive);background:rgba(106,111,63,.08)}
  .tag.white{border-color:rgba(169,133,74,.5);color:var(--brass);background:rgba(169,133,74,.08)}

  hr.rule{border:none;border-top:1px solid var(--line);margin:36px 0}
  .sec-h{font-family:'Fraunces';font-weight:500;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--wine);margin:42px 0 4px;display:flex;align-items:center;gap:12px}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

  .lesson p{margin:18px 0;max-width:68ch}
  .lesson p:first-child{margin-top:20px}
  .lesson strong{font-weight:600;color:var(--ink)}
  .lesson em{font-style:italic}
  .lesson .lead::first-letter{
    font-family:'Fraunces';float:left;font-size:62px;line-height:.82;font-weight:500;
    color:var(--wine);margin:6px 12px 0 0;
  }

  .pull{
    border-left:3px solid var(--brass);padding:6px 0 6px 22px;margin:26px 0;
    font-family:'Fraunces';font-style:italic;font-size:21px;line-height:1.4;color:var(--aubergine);
  }

  .concepts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .concept{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
  .concept h4{font-family:'Fraunces';font-weight:600;font-size:16px;color:var(--wine);margin-bottom:5px;letter-spacing:.01em}
  .concept p{font-size:15px;line-height:1.5;color:var(--ink-soft);margin:0;max-width:none}

  .taste-list{list-style:none;margin-top:16px}
  .taste-list li{padding:11px 0 11px 30px;border-bottom:1px solid var(--line);position:relative;font-size:16.5px}
  .taste-list li:last-child{border-bottom:none}
  .taste-list li::before{content:"";position:absolute;left:4px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--brass)}
  .taste-list li b{color:var(--ink);font-weight:600}

  .wines{margin-top:18px}
  .wine{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .wine .glass{font-size:26px;flex-shrink:0;line-height:1.4}
  .wine .wbody{flex:1}
  .wine .wname{font-family:'Fraunces';font-weight:600;font-size:17px;color:var(--ink)}
  .wine .wmeta{font-size:13.5px;color:var(--wine);font-style:italic;margin:2px 0 7px}
  .wine .wnote{font-size:15px;color:var(--ink-soft);line-height:1.5}
  .wine .wprice{float:right;font-family:'Fraunces';font-size:14px;color:var(--brass);font-weight:600;margin-left:12px}

  .sessions{margin-top:18px;counter-reset:sess}
  .session{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .session h4{font-family:'Fraunces';font-weight:600;font-size:17px;color:var(--aubergine);margin-bottom:4px}
  .session .stag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:600}
  .session ol{margin:10px 0 0 20px}
  .session ol li{margin:7px 0;font-size:16px;line-height:1.5}
  .session .stip{margin-top:12px;font-size:14.5px;font-style:italic;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px}

  /* quiz */
  .quiz{margin-top:18px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  .qhead{padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:background .15s}
  .qhead:hover{background:rgba(169,133,74,.05)}
  .qnum{font-family:'Fraunces';font-weight:600;color:var(--brass);font-size:15px;flex-shrink:0;min-width:24px}
  .qtext{flex:1;font-size:16.5px;line-height:1.5}
  .qtoggle{font-size:13px;color:var(--wine);font-style:italic;flex-shrink:0;white-space:nowrap;border:1px solid var(--line-strong);padding:3px 10px;border-radius:100px;transition:all .15s;align-self:center}
  .qhead:hover .qtoggle{background:var(--wine);color:#fff;border-color:var(--wine)}
  .qans{max-height:0;overflow:hidden;transition:max-height .35s ease;background:rgba(107,31,42,.04);border-top:0 solid var(--wine)}
  .qcard.open .qans{max-height:600px;border-top:1px solid rgba(107,31,42,.18)}
  .qcard.ak.open .qans{max-height:2600px}
  .qans-inner{padding:16px 18px 18px 56px;font-size:15.5px;line-height:1.55;color:var(--ink-soft)}
  .qans-inner b{color:var(--wine);font-weight:600}
  .qans-inner .lbl{font-family:'Fraunces';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:6px}

  .reading{background:var(--paper-2);border-radius:10px;padding:18px 22px;margin-top:18px;border:1px solid var(--line)}
  .reading .rlbl{font-family:'Fraunces';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:10px}
  .reading ul{list-style:none}
  .reading li{font-size:15px;padding:5px 0 5px 20px;position:relative;color:var(--ink-soft)}
  .reading li::before{content:"§";position:absolute;left:0;color:var(--brass);font-style:italic}
  .reading li b{color:var(--ink);font-weight:600;font-style:normal}

  .complete-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:48px;padding:22px 24px;background:var(--aubergine);border-radius:12px;color:#efe2d6}
  .complete-row .cr-txt{font-family:'Fraunces';font-style:italic;font-size:18px}
  .btn{font-family:'Fraunces';font-weight:600;font-size:14px;letter-spacing:.04em;padding:11px 22px;border-radius:100px;border:1px solid var(--brass);background:transparent;color:var(--brass-soft);cursor:pointer;transition:all .18s;white-space:nowrap}
  .btn:hover{background:var(--brass);color:var(--aubergine)}
  .btn.done{background:var(--olive);border-color:var(--olive);color:#fff}

  .pager{display:flex;justify-content:space-between;gap:14px;margin-top:30px}
  .pager a{flex:1;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)}
  .pager a:hover{border-color:var(--brass);transform:translateY(-2px)}
  .pager .pl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
  .pager .pt{font-family:'Fraunces';font-size:16px;margin-top:3px;color:var(--ink)}
  .pager a.next{text-align:right}
  .pager a.disabled{opacity:.35;pointer-events:none}

  /* welcome / framework specific */
  .hero-mark{font-family:'Fraunces';font-style:italic;font-size:15px;color:var(--brass);letter-spacing:.04em}
  .big-num{font-family:'Fraunces';font-weight:500;font-size:120px;line-height:.9;color:var(--wine);opacity:.12;position:absolute;top:30px;right:30px;pointer-events:none}
  .framework-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .fw{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
  .fw h4{font-family:'Fraunces';color:var(--wine);font-size:18px;margin-bottom:8px}
  .fw .scale{font-size:14px;color:var(--ink-soft);font-style:italic;margin-top:6px}
  .glossary dt{font-family:'Fraunces';font-weight:600;color:var(--wine);font-size:17px;margin-top:18px}
  .glossary dd{font-size:16px;color:var(--ink-soft);margin-top:3px;line-height:1.55;max-width:70ch}

  /* ---- notebook / tasting sheet ---- */
  .nb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:8px}
  .nb-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn-sm{font-family:'Fraunces';font-weight:600;font-size:13px;letter-spacing:.03em;padding:9px 16px;border-radius:100px;border:1px solid var(--brass);background:transparent;color:var(--wine);cursor:pointer;transition:all .18s}
  .btn-sm:hover{background:var(--brass);color:#fff;border-color:var(--brass)}
  .btn-sm.solid{background:var(--wine);color:#fff;border-color:var(--wine)}
  .btn-sm.solid:hover{background:var(--wine-bright);border-color:var(--wine-bright)}
  .btn-sm.danger{border-color:rgba(140,47,58,.5);color:var(--wine-bright)}
  .btn-sm.danger:hover{background:var(--wine-bright);color:#fff}
  .tasting-cta{font-family:'Fraunces';font-weight:600;font-size:14px;letter-spacing:.03em;padding:11px 20px;border-radius:100px;border:1px dashed var(--brass);background:transparent;color:var(--wine);cursor:pointer;margin-top:16px;transition:all .18s}
  .tasting-cta:hover{background:rgba(169,133,74,.1);border-style:solid}
  .nb-empty{background:var(--card);border:1px dashed var(--line-strong);border-radius:12px;padding:34px 26px;text-align:center;color:var(--ink-soft);font-style:italic;margin-top:22px;line-height:1.6}
  .note-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s}
  .note-card:hover{border-color:var(--brass);transform:translateY(-1px)}
  .note-card .nc-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .note-card .nc-name{font-family:'Fraunces';font-weight:600;font-size:18px;color:var(--ink)}
  .note-card .nc-score{font-family:'Fraunces';font-weight:600;color:var(--brass);font-size:15px;white-space:nowrap}
  .note-card .nc-meta{font-size:13.5px;color:var(--wine);font-style:italic;margin-top:2px}
  .note-card .nc-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:100px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft)}
  .chip.mod{background:rgba(58,33,48,.08);border-color:rgba(58,33,48,.25);color:var(--aubergine)}
  .chip.rebuy{background:rgba(106,111,63,.12);border-color:rgba(106,111,63,.4);color:var(--olive)}
  .form-wrap{margin-top:20px}
  .fld{margin-bottom:16px}
  .fld label{font-family:'Fraunces';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;font-family:'Spectral',serif;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px}
  .fld textarea{min-height:64px;resize:vertical;line-height:1.5}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(169,133,74,.15)}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .form-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow)}
  .form-block .fb-h{font-family:'Fraunces';font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);margin-bottom:14px}
  .form-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .view-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:14px;box-shadow:var(--shadow)}
  .view-block .vb-h{font-family:'Fraunces';font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);margin-bottom:10px}
  .vrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15.5px}
  .vrow:last-child{border-bottom:none}
  .vrow .vk{flex:0 0 120px;color:var(--ink-soft);font-style:italic}
  .vrow .vv{flex:1;color:var(--ink)}
  .struct-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .save-hint{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:12px}
  @media(max-width:880px){ .fld-row,.fld-row-3,.struct-grid{grid-template-columns:1fr} }
  .cfld{margin-bottom:13px}
  .cfld>label{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:600;font-family:'Fraunces',serif}
  .chip-group{display:flex;flex-wrap:wrap;gap:6px}
  .chip-opt{font-family:'Spectral',serif;font-size:13.5px;padding:6px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:100px;cursor:pointer;transition:background .12s,border-color .12s,color .12s;line-height:1.1}
  .chip-opt:hover{border-color:var(--brass)}
  .chip-opt.sel{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}
  .scale-ref{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:8px;padding:13px 18px;margin:18px 0;font-size:14.5px}
  .scale-ref ul{padding-left:18px}
  .scale-ref li{margin:3px 0}
  .flight-h{margin:24px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .flight-h:first-child{margin-top:2px}
  .flight-k{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--wine);letter-spacing:.01em}
  .flight-s{display:block;font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-top:3px;line-height:1.45}

  .menutoggle{display:none}

  @media(max-width:880px){
    body{font-size:17px}
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .3s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .sidebar.open{transform:translateX(0)}
    .topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--aubergine);color:#efe2d6;position:sticky;top:0;z-index:40}
    .topbar .tb-title{font-family:'Fraunces';font-size:18px}
    .menutoggle{display:flex;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:4px}
    .menutoggle span{width:22px;height:2px;background:var(--brass-soft);display:block}
    .page{padding:30px 22px 0}
    h2.title{font-size:33px}
    .deck{font-size:18px}
    .concepts,.framework-grid{grid-template-columns:1fr}
    .big-num{font-size:80px}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
    .scrim.show{display:block}
  }
  @media(min-width:881px){ .scrim{display:none} }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">a private course in</div>
      <h1>Tasting Wine</h1>
      <div class="sub">Twelve modules · solo study · Coravin method</div>
    </div>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="progfill"></div></div>
      <div class="proglabel" id="proglabel">0 of 12 complete</div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="topbar">
      <button class="menutoggle" id="menutoggle"><span></span><span></span><span></span></button>
      <div class="tb-title">Tasting Wine</div>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<script>
/* ============================================================
   COURSE CONTENT
   ============================================================ */
const COURSE = [
{
  id:"welcome", nav:"Welcome", type:"static",
  render:()=>`
    <div style="position:relative">
      <div class="big-num">✦</div>
      <div class="hero-mark">For Kelsey</div>
      <h2 class="title" style="margin-top:10px">A course in how<br>to taste wine.</h2>
      <p class="deck">Not a list of bottles to drink, but a way of paying attention — so that after twelve modules you can taste a wine and say what it is, where it's from, and why you do or don't love it.</p>
    </div>
    <div class="lesson">
      <p class="lead">This course is built for the way you actually drink: alone, mostly, with a Coravin, a glass at a time, across weeks rather than evenings. That's not a compromise — it's an advantage. The Coravin lets you return to the same wine on day one, day four, day fourteen, and watch it change. You'll learn more from one bottle revisited than from ten bottles rushed.</p>
      <p>Each module teaches a concept, not just a region. Module 2 isn't "Chardonnay" — it's <em>how climate, oak, and malolactic conversion shape a wine</em>, taught through Chardonnay because Chardonnay is the clearest blackboard for it. Once you can taste those forces in one grape, you start finding them everywhere.</p>
      <div class="pull">The goal isn't to memorise wine. It's to taste deliberately, then check yourself against what the label says — and to keep narrowing the gap.</div>
      <p>Your books — <strong>The Wine Bible</strong>, <strong>Wine Folly</strong>, and <strong>The World Atlas of Wine</strong> — are now supplements, listed at the end of each module for when you want to go deeper. The teaching lives here.</p>

      <div class="sec-h">How each module works</div>
      <div class="concepts">
        <div class="concept"><h4>The Lesson</h4><p>The actual teaching — concepts, a little science, what makes the style what it is.</p></div>
        <div class="concept"><h4>Key Concepts</h4><p>The handful of terms and ideas to carry forward into every later module.</p></div>
        <div class="concept"><h4>What to Taste For</h4><p>The specific sensory markers to hunt for in the glass, in order.</p></div>
        <div class="concept"><h4>The Wines</h4><p>What to buy and why each bottle earns its place in the flight.</p></div>
        <div class="concept"><h4>The Tasting</h4><p>A Coravin-paced plan, usually across several sittings, with comparisons built in.</p></div>
        <div class="concept"><h4>Self-Quiz</h4><p>Questions with reveal-able model answers. Try first, then check.</p></div>
      </div>

      <div class="sec-h">Before you start</div>
      <p>Do <strong>Module 0 — The Tasting Framework</strong> next. It's the grid you'll run on every wine for the rest of the course. Everything after it assumes you've internalised it. Then begin Module 1, which exists to recalibrate your palate on two deliberately simple wines before things get interesting.</p>
    </div>
    <div class="pager"><span></span>
      <a class="next" onclick="go('framework')"><div class="pl">Begin →</div><div class="pt">The Tasting Framework</div></a>
    </div>`
},

{
  id:"framework", nav:"The Tasting Framework", navnum:"0", type:"static",
  render:()=>`
    <div class="module-no">Module 0</div>
    <h2 class="title">The Tasting Framework</h2>
    <p class="deck">One repeatable method, run the same way every time. Consistency is what lets you compare a wine in March to a wine in August.</p>
    <div class="lesson">
      <p class="lead">Tasting is just structured attention. The framework below is adapted from the WSET Systematic Approach — the same skeleton sommeliers use. You move through it in a fixed order — <strong>Sight, Nose, Palate, Conclusions</strong> — because the order stops you from jumping to "I like it" before you've gathered evidence.</p>
      <p>The single most important habit: <strong>guess before you check.</strong> Smell, taste, and commit to a written guess — grape, region, vintage range — <em>before</em> you look at the label. You'll be wrong constantly at first. The gap between your guess and the truth is exactly where the learning happens.</p>

      <div class="sec-h">Sight</div>
      <p>Tilt the glass over something white. Intensity (how much colour) hints at grape, climate, and age. Hue tells you about age most of all: whites move from green-lemon → gold → amber as they age; reds move from purple → ruby → garnet → tawny. A red with a bricky garnet rim has some age or comes from a pale grape like Nebbiolo or Pinot Noir. Rate intensity <strong>Pale · Med− · Medium · Med+ · Deep</strong>, note the <strong>rim</strong> (Youthful or Faded), and the <strong>viscosity</strong> — the "legs" — from Low to High.</p>

      <div class="sec-h">Nose</div>
      <p>First, is it <strong>clean</strong> or faulty? (Wet cardboard = cork taint/TCA; nail polish = volatile acidity; struck match that won't blow off = reduction.) Then rate <strong>intensity</strong>, then sort what you smell into three ages of aroma:</p>
      <div class="framework-grid">
        <div class="fw"><h4>Primary</h4><p>From the grape and fermentation: fruit, flowers, herbs, pepper. <span class="scale">"Youthful."</span></p></div>
        <div class="fw"><h4>Secondary</h4><p>From winemaking: oak (vanilla, toast, coconut), lees (bread, cream), MLF (butter). <span class="scale">"Made."</span></p></div>
        <div class="fw"><h4>Tertiary</h4><p>From age: dried fruit, leather, mushroom, forest floor, petrol, honey, nuts. <span class="scale">"Evolved."</span></p></div>
      </div>

      <div class="sec-h">Palate — the structural spine</div>
      <p>This is the part that matters most and the part beginners skip. Flavours are nice; <em>structure</em> is what identifies a wine. Rate each on the Systematic Sensory scales — the same ones printed on your GBC evaluation sheet and built into this course's notebook. Most run <strong>Low · Med− · Medium · Med+ · High</strong>; a few keep their own words, listed under the grid:</p>
      <div class="framework-grid">
        <div class="fw"><h4>Sweetness</h4><p>Dry to sweet. Felt on the tip of the tongue. Don't confuse ripe fruit for sugar.</p></div>
        <div class="fw"><h4>Acidity</h4><p>Makes you salivate; felt on the sides of the tongue. High acid = mouthwatering, tart.</p></div>
        <div class="fw"><h4>Tannin</h4><p>Reds only. The drying, grippy grip on gums and cheeks. Note quality too: ripe & silky, or green & bitter?</p></div>
        <div class="fw"><h4>Alcohol</h4><p>Warmth at the back of the throat. High alcohol reads as "hot."</p></div>
        <div class="fw"><h4>Body</h4><p>The weight and texture — skim milk vs. cream. A consequence of alcohol, sugar, extract.</p></div>
        <div class="fw"><h4>Finish</h4><p>How long the flavour lasts after swallowing. Length is the surest sign of quality.</p></div>
      </div>

      <div class="scale-ref">
        <p style="margin:0 0 6px"><strong>The scales, exactly as on your sheet:</strong></p>
        <ul style="margin:0">
          <li><strong>Sweetness:</strong> dry · off dry · medium sweet · sweet</li>
          <li><strong>Acidity, Alcohol, Nose intensity:</strong> Low · Med− · Medium · Med+ · High</li>
          <li><strong>Tannins:</strong> None · Soft · Med− · Medium · Med+ · Hard</li>
          <li><strong>Body:</strong> Light · Med− · Medium · Med+ · Full</li>
          <li><strong>Finish:</strong> Short · Med− · Medium · Med+ · Long</li>
          <li><strong>Appearance intensity:</strong> Pale · Med− · Medium · Med+ · Deep &nbsp;—&nbsp; <strong>Viscosity:</strong> Low → High &nbsp;—&nbsp; <strong>Rim:</strong> Youthful / Faded</li>
        </ul>
      </div>

      <div class="pull">Acid is on the sides of your tongue. Tannin grips your gums. Alcohol warms your throat. Learn to feel them in different places and you can rate them independently.</div>

      <div class="sec-h">Conclusions</div>
      <p>Now — and only now — judge <strong>quality</strong>. A wine is good not because it's expensive but because of <em>balance</em> (no single component sticks out), <em>intensity</em>, <em>complexity</em> (layers that change in the glass), and <em>length</em>. Then assess readiness: drink now, or will it improve? Finally, reveal the label and score your guess.</p>
      <p>Record every formal wine — on your printable sheet, or in this course's built-in <strong>My Tastings</strong> notebook (in the sidebar). The discipline of writing it down is what makes Module 2's notes comparable to Module 9's.</p>

      <div class="sec-h">Which bottles deserve the Coravin?</div>
      <p>The Coravin works by piercing a natural <strong>cork</strong>, which reseals around the needle — so the bottle is never truly opened and can keep for weeks or months. That makes it ideal for the <strong>corked, age-worthy bottles you want to study slowly</strong>: the Burgundy, Barolo, Bordeaux, vintage and tawny Port. Pour 50ml, return over weeks, watch it evolve.</p>
      <p>It does <strong>not</strong> work on <strong>screwcaps</strong> (nothing to reseal) or sparkling (the gas escapes). And many of the best wines in this course — most Riesling, Sauvignon Blanc, Grüner, and New World whites — are screwcap <em>by choice</em>, because it keeps them fresher. Don't fight that: recap and fridge and finish within a few days, or decant the rest into a topped-up half-bottle for up to a couple of weeks. Never try to stretch an opened screwcap white across modules — taste it fully within its own.</p>
    </div>
    <div class="pager">
      <a onclick="go('welcome')"><div class="pl">← Back</div><div class="pt">Welcome</div></a>
      <a class="next" onclick="go('m1')"><div class="pl">Next →</div><div class="pt">Module 1 · Fundamentals</div></a>
    </div>`
},

{
  id:"m1", nav:"Tasting Fundamentals", navnum:"1", type:"module",
  title:"Tasting Fundamentals",
  deck:"Two deliberately simple wines, chosen not because they're great but because they're clear — so you can recalibrate the framework on wines that hide nothing.",
  tags:[["white","white"],["new","new world"],["old","old world"]],
  lesson:`
    <p class="lead">Before you can taste subtle wines you have to recalibrate on obvious ones. These two bottles are loud about their structure: a white whose whole personality is acid, and a red whose whole personality is ripe fruit and soft tannin. Neither will trick you, which is the point — you're tuning the instrument, not playing music yet.</p>
    <p>Start with the <strong>Riesling</strong>. It's high in acid, low in alcohol, and just off-dry — there's a whisper of sugar that most people read as "fruity" rather than "sweet." That gap between perceived and actual sweetness is your first real lesson: ripe-fruit aromas trick the brain into expecting sugar that isn't there. Taste it, then notice that the wine finishes clean and tart, not syrupy. That's off-dry.</p>
    <p>The <strong>Malbec</strong> is your tannin and body reference. New World Malbec from Mendoza is grown in lots of sun at altitude, so it's ripe, generous, deeply coloured, with tannin that's present but soft — medium, not aggressive. Feel where the tannin sits: a faint chalky grip on your gums and the insides of your cheeks, separate entirely from the acid you felt on the sides of your tongue with the Riesling.</p>
    <div class="pull">If you can reliably tell acid (sides of the tongue, salivation) from tannin (dry grip on the gums), you've cleared the single biggest hurdle in tasting. Most confusion downstream traces back to muddling these two.</div>
    <p>Don't chase flavours yet. "I taste blackberry" is the least useful thing you can say about a wine and the first thing everyone reaches for. Structure first, always. Flavour is the garnish; acid, tannin, alcohol, body, and finish are the meal. Get fluent rating those five and the flavours will start naming themselves.`,
  concepts:[
    ["Balance","No single component — acid, tannin, alcohol, sugar, fruit — sticks out above the others. The first thing quality wines have in common."],
    ["Off-dry","A wine with a small amount of residual sugar, often imperceptible as 'sweet' because high acid hides it. The Riesling is the textbook case."],
    ["Structure vs. flavour","Structure (the five-point ratings) identifies a wine; flavour describes it. Beginners over-index on flavour. Reverse that."],
    ["Primary aroma","Aroma from the grape and fermentation alone — fruit, flowers, herbs. Both of tonight's wines are almost purely primary, by design."]
  ],
  taste:[
    "<b>Where the acid lives:</b> sip the Riesling and locate the tartness — it's on the sides of your tongue, and it makes you salivate.",
    "<b>Perceived vs. real sweetness:</b> does it taste sweet or just fruity? Note the dry, clean finish.",
    "<b>Where the tannin lives:</b> sip the Malbec and feel the dry grip on your gums and cheeks — a different sensation, in a different place.",
    "<b>Calibrate the scale:</b> the Riesling's acid is medium+/high; the Malbec's tannin is medium. Use those as anchors for every future wine.",
    "<b>The food test:</b> a bite of sharp cheddar makes the wine taste fruitier; a few grains of sugar make it taste thinner and more acidic."
  ],
  wines:[
    ["🥂","Cave Spring Riesling","Niagara Peninsula VQA · ~$17","The acid-and-off-dry reference. Local, consistent, almost no oak or complexity to distract you — exactly what calibration needs.","white"],
    ["🍷","Catena Malbec","Mendoza, Argentina · ~$20","The ripe-fruit, moderate-tannin, full-body reference. Hard to misread. Generous and clear."]
  ],
  sessions:[
    {tag:"Session A · the white",title:"Riesling, day one",steps:[
      "Pour ~60ml fridge-cold (≈8°C). Run the full framework — sight and nose written down before you taste.",
      "Locate the acid precisely. Sides of the tongue? Salivation response? Rate it.",
      "Let the glass warm 15 minutes and re-taste. The aromatics open and the acid feels softer — same wine, warmer.",
      "Do the food test: plain cracker, then sharp cheddar, then a few grains of sugar on the tongue between sips."
    ],tip:"The Cave Spring is screwcap — don't try to Coravin it, and don't save it for later. Just recap and fridge it, and finish it across this week's sessions. (Module 4 has its own Riesling lineup; this bottle's whole job is calibration here.)"},
    {tag:"Session B · the red",title:"Malbec, a day or two later",steps:[
      "Pour ~60ml at cool room temp (≈18°C — if your home is warmer, chill it 15 min first).",
      "Run the framework. Find the tannin: where does the grip sit, and is it soft or harsh?",
      "Compare your tannin rating against the Riesling's acid rating. Are you using the five-point scale consistently?",
      "Coravin a glass for day two and note whether the fruit feels rounder."
    ],tip:"Big New World reds often taste better and softer on day two as tannin integrates — a preview of Module 6."}
  ],
  quiz:[
    ["Define 'balance' in your own words. What is being balanced against what?","<b>Balance</b> is the state where no single structural component dominates the others. In a dry red: acid, tannin, alcohol, and fruit intensity all sit in proportion so none sticks out as harsh, hot, sour, or flabby. In an off-dry white like the Riesling: residual sugar is balanced by acidity, so the wine reads as fresh rather than cloying. It's the first thing all quality wines share."],
    ["Your Malbec is deeply coloured, full-bodied, ripe-fruited, around 14% alcohol, with soft tannins. What does that structure suggest about the climate it grew in?","A <b>warm, sunny, high-ripeness site</b> — exactly Mendoza's combination of strong sun and altitude. Full ripeness means lots of sugar (which ferments to that high, ~14% alcohol), generous dark fruit, deep colour, and tannins that ripen soft rather than harsh. Reading climate off structure like this is a skill you'll use in every later module."],
    ["Why is the Riesling 'off-dry' if it tastes dry to most palates?","It carries a small amount of <b>residual sugar</b>, but its <b>high acidity masks the sweetness</b> — acid and sugar offset each other on the palate. The brain also reads the wine's ripe-fruit aromatics as 'sweetness' that is actually just smell, not sugar. Net effect: it tastes crisp and nearly dry despite measurable sugar."],
    ["Pinch your nose, sip, and the wine flattens to just sweet and sour — then release and the fruit floods back. Why? What does it reveal about 'taste'?","Because <b>most of what we call flavour is actually smell.</b> The tongue detects only five basic tastes (sweet, sour, salty, bitter, umami); every fruit, flower, herb, and oak note is aroma, sensed up the back of the throat (retronasally) as you swallow. Block the nose and you cut off that channel, leaving only the tongue's bare tastes."],
    ["Tannin, alcohol, and body aren't really 'tastes.' What is each physically, and where do you sense it?","<b>Tannin</b> is astringency — a dry, grippy sensation on the gums and cheeks as tannins bind the proteins in your saliva. <b>Alcohol</b> is warmth at the back of the throat. <b>Body</b> is viscosity — the wine's weight and texture, skim-milk to cream. Knowing each lives in a different sensation is what lets you rate them one at a time instead of as a blur."],
    ["Difference between <i>aroma</i> and <i>bouquet</i>?","<b>Aroma</b> is the youthful smell that comes from the grape and fermentation (the primary and secondary notes). <b>Bouquet</b> is the more complex smell that develops with bottle age (the tertiary notes). Loosely: aroma is youth, bouquet is maturity."],
    ["You can tell a wine is well-made, but you don't enjoy it. Are 'good' and 'to my taste' the same thing?","No — and keeping them apart is a core skill. <b>Quality</b> is judged on balance, intensity, complexity, and length; you can recognise a wine as high-quality and still not like it, or love something you know is simple. A trained taster holds both judgments at once. Your tasting sheet's enjoyment score captures preference; the framework captures quality."],
    ["On the five-point scale, what separates 'medium+' acid from 'high'?","A sensory call: <b>medium+</b> acid makes you salivate noticeably and tastes fresh; <b>high</b> acid makes you salivate hard, can make the jaw tingle, and tastes sharply tart — think under-ripe lemon. High-acid wines also keep your mouth watering for several seconds after swallowing."],
    ["You can still taste the wine 30 seconds after swallowing. What's the term, and where does that put it on the scale?","That's the <b>finish</b> (or length), and 30 seconds of persistence puts you at <b>'long'</b> — the top of the scale, and one of the surest signs of quality."]
  ],
  reading:[
    "<b>Wine Folly</b> — 'How to Taste Wine' opening pages.",
    "<b>The Wine Bible</b> — 'Mastering Wine' / tasting basics in the opening chapters.",
    "Skim only — this is recalibration, not new ground."
  ]
},

{
  id:"m2", nav:"Chardonnay Around the World", navnum:"2", type:"module",
  title:"Chardonnay Around the World",
  deck:"The clearest blackboard in wine. Because the grape itself is fairly neutral, everything you taste in Chardonnay is climate, oak, and winemaking — so it teaches you to read those forces directly.",
  tags:[["white","white"],["old","old world"],["new","new world"]],
  lesson:`
    <p class="lead">Chardonnay is a quiet grape. On its own it offers apple, citrus, maybe melon — not much. That neutrality is precisely why it's the best teacher in the white world: nearly everything else you taste in a Chardonnay was <em>done to it</em>. Learn to taste those four levers — climate, oak, malolactic conversion, and lees — in Chardonnay, and you'll spot them in every other wine for the rest of your life.</p>
    <p><strong>Climate</strong> sets the baseline. In cool <strong>Chablis</strong>, in northern Burgundy on ancient seabed limestone, the grape keeps high acid and stays in the green-apple, lemon, and wet-stone register. Move south to the warmer <strong>Mâconnais</strong> and the fruit rounds toward orchard and stone fruit, the acid softens. Cross to a warm New World site and you get tropical fruit — pineapple, mango — and lower acid. Same grape; the thermometer rewrote it.</p>
    <p><strong>Oak</strong> is the next lever. New oak barrels donate vanilla, baking spice, toast, sometimes coconut or dill (from American oak). Old/neutral barrels add texture but little flavour. A Chablis is typically unoaked — stainless steel, all precision. A New World Chardonnay may be fermented and aged in new French oak, layering in that vanilla-toast richness. Crucially: <em>don't confuse oak's sweetness for fruit ripeness.</em> Vanilla and butterscotch are barrel, not grape.</p>
    <p><strong>Malolactic conversion</strong> (MLF) is a second, bacterial fermentation that turns sharp malic acid (think green apple) into soft lactic acid (think milk) — and throws off <em>diacetyl</em>, the compound behind that buttery, buttered-popcorn note. Most New World Chardonnay goes through full MLF; most modern Chablis blocks it to protect freshness. If you smell butter, you're smelling MLF.</p>
    <div class="pull">Finally, lees: leaving the wine on its spent yeast (and stirring it — bâtonnage) adds a bready, creamy, savoury weight. Chablis uses it for texture without flavour; it's why even unoaked Chablis isn't lean and hollow.</div>
    <p>Your flight stages exactly this progression: bone-dry mineral Chablis → rounder, lightly handled Mâcon or Bourgogne → riper, oakier Niagara. Tasted side by side, the levers become obvious. Tasted apart, they stay invisible. This is the one module where you open all three at once.`,
  concepts:[
    ["Malolactic conversion (MLF)","A bacterial conversion of tart malic acid into soft lactic acid. Produces diacetyl — the 'buttery' smell. The single most useful winemaking signature to learn to detect."],
    ["New vs. neutral oak","New barrels donate vanilla, toast, spice, coconut. Neutral (used) barrels add texture only. The vanilla you taste is wood, not fruit."],
    ["Lees & bâtonnage","Ageing on spent yeast adds bready, creamy weight; stirring it (bâtonnage) amplifies the effect. Why good unoaked whites still have texture."],
    ["Kimmeridgian soil","The fossil-rich limestone-and-clay seabed under Chablis. Credited (debatably) with the chalky, oyster-shell minerality in the wines."],
    ["Climate spectrum","Cool = high acid, citrus/green apple, lean body. Warm = lower acid, tropical fruit, full body. The first thing to estimate from any white."],
    ["Burgundy hierarchy","Regional (Bourgogne) → Village (Chablis, Mâcon-Villages) → Premier Cru → Grand Cru. Quality and site-specificity climb at each step."]
  ],
  taste:[
    "<b>Colour progression:</b> line up all three. The cool Chablis is palest; the oaked New World is deepest gold. Predict which is which before nosing.",
    "<b>Find the oak:</b> which glass smells of vanilla, toast, spice? That's barrel signature, not grape.",
    "<b>Find the butter:</b> rank the three from no-MLF to obvious-MLF. Chablis should be cleanest, Niagara butteriest.",
    "<b>Acid tracks climate:</b> the coolest wine has the sharpest acid and leanest body; confirm the inverse relationship by tasting.",
    "<b>Texture from lees:</b> even the unoaked Chablis shouldn't feel hollow — notice the subtle creamy weight."
  ],
  wines:[
    ["🥂","Domaine William Fèvre Chablis","Burgundy, France · village level · ~$32","Cool-climate, unoaked, all citrus and wet-stone minerality. Your precision reference. La Chablisienne 'Le Finage' (~$38) is the ready substitute.","white"],
    ["🥂","Louis Jadot or Drouhin Mâcon-Villages","Burgundy, France · ~$22","Same grape, warmer south of Burgundy, a touch of older oak. The 'in-between' wine. A Nuiton-Beaunoy Bourgogne Chardonnay (~$30) works too.","white"],
    ["🥂","Bachelder or Tawse Niagara Chardonnay","Niagara, Ontario · ~$30–50","The New World comparator — riper fruit, visible oak, full MLF, but still cool-climate. Best bought direct in Niagara.","white"]
  ],
  sessions:[
    {tag:"Session A · the comparison",title:"All three, side by side",steps:[
      "Three identical glasses, 50ml each, all at ≈11°C (30 min out of the fridge). This is the one flight you open together.",
      "Sight: rank by colour intensity, write predictions for which is which.",

    {tag:"Sessions B & C · evolution",title:"Revisit across the week",steps:[
      "Return to each on days 3–4: Coravin the corked bottles, and just recap-and-fridge any that are screwcap (some Niagara Chardonnay is).",
      "Watch whether the New World oak integrates and the wine gains nuance (it usually does).",

  quiz:[
    ["What is MLF, chemically, in one sentence — and what compound makes 'butter'?","Malolactic conversion is a <b>bacterial conversion of sharp malic acid into softer lactic acid</b>; the byproduct <b>diacetyl</b> is responsible for the buttery/buttered-popcorn aroma."],
    ["What is Kimmeridgian, and why does it matter for Chablis?","A <b>fossil-rich limestone-and-clay seabed</b> (named for Kimmeridge in England) underlying Chablis, full of tiny oyster fossils. It's credited — somewhat romantically — with the wines' chalky, saline, oyster-shell minerality and is the reason Chablis tastes distinct from warmer Chardonnay."],
    ["Rank coolest → warmest: Chablis, Margaret River, Mâcon, Russian River Valley, Niagara.","Roughly: <b>Chablis (coolest) → Niagara → Mâcon → Russian River Valley → Margaret River (warmest)</b>. Niagara and Mâcon are close; both are markedly cooler than the Californian and Australian sites."],
    ["Why does cool-climate Chardonnay show citrus/green apple while warm shows tropical fruit?","In cool climates grapes ripen slowly and <b>retain high acid</b> while developing only green-fruit/citrus flavour compounds. In warm climates sugar and riper-fruit (tropical) flavours accumulate faster while <b>acid drops</b>, so the wine reads riper, rounder, lower-acid."],
    ["A Chardonnay shows coconut, vanilla, and dill. What does this tell you about oak?","It points to <b>new oak, and specifically American oak</b> (or heavily toasted barrels) — coconut and dill are classic American-oak lactone markers, while vanilla indicates new wood generally. A wine like this was built in barrel, not stainless."],
    ["What is bâtonnage and what does it contribute?","<b>Stirring the spent yeast lees</b> back into the wine during ageing. It adds <b>creamy, bready texture and savoury weight</b>, and can soften a wine's perception of acidity."],
    ["Beyond marketing, what changes from village Chablis to Premier Cru? Name two factors.","(1) <b>Vineyard site</b> — Premier Cru parcels sit on better-exposed, often south/southeast slopes with ideal Kimmeridgian soil, giving riper, more concentrated fruit; (2) typically <b>more concentration and ageing potential</b>, and often some judicious oak. The wine gains depth, length, and capacity to develop."],
    ["Blind: medium-lemon, medium+ nose of green apple/lemon with chalky oyster-shell, medium body, medium+ acid, no oak, no MLF, medium+ finish. What is it?","A <b>village-level Chablis</b> (unoaked, cool-climate Chardonnay). The oyster-shell minerality, absence of oak and butter, high acid, and only-medium body are the giveaways. Quality reads as good — solid length without the concentration of a Cru."],
    ["Why might a Niagara Chardonnay taste closer to Burgundy than to California? Two reasons.","(1) <b>Climate</b> — Niagara is genuinely cool, so it retains Burgundian acidity rather than Californian ripeness; (2) <b>stylistic intent</b> — top Niagara producers deliberately aim for a restrained, mineral, Burgundian style rather than a rich, oaky New World one."],
    ["To identify Chardonnay blind among all whites, what two markers would you look for?","(1) A relatively <b>neutral primary fruit</b> profile (apple, citrus, melon — no aggressive aromatics like Sauvignon's passionfruit or Riesling's lime/petrol); and (2) the frequent presence of <b>winemaking signatures</b> — oak, MLF butter, lees creaminess — since Chardonnay is so often 'built.' A medium-to-full body with no obvious grape 'shout' is itself a clue."]
  ],
  reading:[
    "<b>World Atlas of Wine</b> — Burgundy (Chablis), then the Mâcon pages.",
    "<b>Wine Folly</b> — Chardonnay page + the Burgundy regional spread.",
    "<b>The Wine Bible</b> — Chardonnay chapter, then the Burgundy chapter."
  ]
},

{
  id:"m3", nav:"Sauvignon Blanc & Aromatics", navnum:"3", type:"module",
  title:"Sauvignon Blanc & Aromatic Whites",
  deck:"Where you train your nose. Sauvignon's aromas are loud and specific enough to name the actual compounds — and once named, you'll find them hiding in a dozen other grapes.",
  tags:[["white","white"],["old","old world"],["new","new world"]],
  lesson:`
    <p class="lead">If Chardonnay was the blackboard for winemaking, Sauvignon Blanc is the blackboard for <em>aroma</em>. Its smells are so pronounced and so chemically specific that you can learn to name the molecules behind them — and that vocabulary transfers everywhere. This is the module where your nose gets educated.</p>
    <p>Two families of compound do most of the work. <strong>Thiols</strong> are the tropical, pungent side: passionfruit, grapefruit pith, guava, and — at the extreme — boxwood or cat's-pee. They explode in warm-but-sunny New World sites, above all <strong>Marlborough, New Zealand</strong>, which built its entire fame on thiol-driven Sauvignon. <strong>Pyrazines</strong> (methoxypyrazines) are the green, herbal side: green pepper, fresh-cut grass, blackcurrant leaf, asparagus. They dominate in cooler climates and underripe fruit.</p>
    <p>Now the geography. <strong>Sancerre</strong> and <strong>Pouilly-Fumé</strong>, in the eastern Loire, are the Old World references: cooler, restrained, more about citrus, white flowers, wet flint, and a saline mineral cut than overt tropical fruit. Marlborough is the New World foil: pungent, aromatic, often with a touch of residual sugar to balance its racing acid. Put a Sancerre and a Cloudy Bay side by side and the Old World/New World divide announces itself in one sniff.</p>
    <div class="pull">You bought a brilliant curveball: a Saint-Bris. It's the only appellation in all of Burgundy made from Sauvignon Blanc, not Chardonnay — Sauvignon grown on the same Kimmeridgian limestone as Chablis. It's the 'place trumps grape' lesson made liquid. Taste it third.</div>
    <p>The wildcard, <strong>Grüner Veltliner</strong> from Austria, introduces a different aromatic family entirely: white pepper (from the compound <em>rotundone</em> — the same molecule that peppers Syrah), green lentil, citrus, and a savoury, gently herbal edge that is <em>not</em> pyrazine. Tasting Grüner against the Sauvignons trains you to distinguish "green" sensations that come from different chemistry. Your Willm <strong>Pinot Gris</strong> from Alsace joins here too — oily, smoky, pear-and-ginger, the richer, rounder end of the aromatic spectrum — and an Alsace <strong>Gewürztraminer</strong> introduces the most overtly aromatic white grape of all: lychee, rose petal, and baking spice, almost unmistakable, usually off-dry and low in acid. Together they stretch the aromatic range from Sauvignon's lean zing to Gewürz's full perfume.`,
  concepts:[
    ["Thiols","Sulphur-containing aroma compounds behind passionfruit, grapefruit, guava, boxwood. The signature of New World (esp. Marlborough) Sauvignon Blanc."],
    ["Pyrazines (methoxypyrazines)","Compounds behind green pepper, grass, blackcurrant leaf, asparagus. Mark cool climates and underripe fruit; also define the Cabernet family's herbal edge."],
    ["Rotundone","The peppercorn compound. Drives Grüner Veltliner's white pepper and, later, Syrah's black pepper. A bridge between Modules 3 and 6."],
    ["Saint-Bris","Burgundy's lone Sauvignon Blanc appellation, on Chablis's Kimmeridgian soil. Proof that terroir reshapes even a loud grape."],
    ["Silex / flint","Flinty soils of the eastern Loire, associated with the 'struck-match' / gunflint minerality in Pouilly-Fumé and Sancerre."],
    ["Alsace aromatics","The rich, perfumed end of white wine: Gewürztraminer (lychee, rose, baking spice — overtly aromatic, off-dry, low acid, full body) and Pinot Gris (pear, smoke, ginger, oily weight). The opposite shape to lean, zingy Sauvignon."]
  ],
  taste:[
    "<b>Thiol vs. pyrazine:</b> nose the Marlborough for passionfruit/grapefruit (thiol); nose the Sancerre for citrus, flint, and a quieter blackcurrant-leaf (pyrazine).",
    "<b>Old vs. New World shape:</b> Sancerre is restrained, mineral, often more textured; Marlborough is louder, leaner, sometimes faintly sweet.",
    "<b>Saint-Bris terroir test:</b> does this Burgundian Sauvignon read more like Sancerre or like its Chablis neighbours? Note the limestone signature.",
    "<b>Grüner's different green:</b> hunt white pepper (often more on the palate), lentil, and a savoury edge that is gentler than Sauvignon's grass.",
    "<b>Goat cheese pairing:</b> the classic Sancerre match — note how wine and cheese amplify each other."
  ],
  wines:[
    ["FLIGHT","Flight 1 — The core contrast","Old World vs. New World Sauvignon Blanc. The heart of the module — taste these two together."],
    ["🥂","Henri Bourgeois 'Petit Bourgeois' or a true Sancerre","Loire, France · ~$20 / ~$32","The Old World reference: restrained, mineral, citrus-and-flint. Splurge on real Sancerre (Bourgeois, Vacheron, Jolivet) if you can. The June Vintages Raimbault Sancerre is ideal.","white"],
    ["🥂","Cloudy Bay Sauvignon Blanc","Marlborough, NZ · ~$32","The textbook thiol-driven Marlborough — passionfruit, grapefruit, cut grass. The reference for what the region means.","white"],
    ["FLIGHT","Flight 2 — The aromatic whites","Optional, and best across separate sittings — two of these are already in your cellar."],
    ["🥂","Domaine Verret Saint-Bris","Burgundy, France · in your cellar","The curveball: Burgundy's only Sauvignon Blanc, on Chablis soil. The 'place trumps grape' lesson. Taste within the next 6–8 weeks.","white"],
    ["🥂","Domäne Wachau Grüner Veltliner Federspiel","Wachau, Austria · ~$22","The wildcard aromatic — white pepper, lentil, citrus. A different family of 'green.'","white"],
    ["🥂","Trimbach or Hugel Gewürztraminer","Alsace, France · ~$25–30","The most overtly aromatic white there is — lychee, rose petal, baking spice. Off-dry, low in acid, full-bodied: the opposite shape to Sauvignon.","white"],
    ["🥂","Willm Pinot Gris Réserve","Alsace, France · in your cellar","The richer, oilier aromatic — pear, smoke, ginger, honeyed weight. Your cellar bottle anchors the full-bodied end of the spectrum.","white"]
  ],
  sessions:[
    {tag:"Flight 1 · the core contrast",title:"Sancerre vs. Cloudy Bay — Old World meets New",steps:[
      "Two glasses at ≈10°C, 50ml each. Nose blind first and predict which is which from aroma alone.",
      "Confirm: Marlborough = pungent, tropical, grassy (thiols + pyrazines); Sancerre = restrained citrus and wet-flint mineral.",
      "Taste for texture, not just smell — Sancerre often has more weight and a saline finish.",
      "Try each with goat cheese, then plain cucumber, then a squeeze of lime. Note which wine each food flatters."
    ],tip:"This two-bottle contrast IS Module 3. If you only do one sitting, do this one. The Cloudy Bay is screwcap — recap and fridge it; you'll want a splash again in Flight 2."},
    {tag:"Flight 2 · the aromatic whites",title:"Saint-Bris, Grüner & the Alsace pair (spread across sittings)",steps:[
      "No need to do these together — this flight is a tour, best across two or three evenings, and two of the bottles are already in your cellar.",
      "Saint-Bris: a Burgundy Sauvignon Blanc on Chablis soil. Nose it against your memory of the Sancerre — it should feel like a Loire grape wearing a Chablis coat (place over grape).",
      "Grüner Veltliner: pour alone, full framework. Hunt white pepper (palate more than nose), lentil, savoury herb — a different 'green' from Sauvignon. A splash of the recapped Cloudy Bay beside it makes the contrast click.",
      "The Alsace pair: Gewürztraminer (lychee, rose, spice — notice how LOW the acid is and how full the body) and your Willm Pinot Gris (oily, smoky, pear, ginger). These map the rich, perfumed end of the aromatic spectrum — the opposite shape to the lean Sancerre."
    ],tip:"Aromatic whites thrive with food that defeats Sauvignon — try the Grüner or Gewürz with something creamy, spiced, or with roast chicken."}
  ],
  quiz:[
    ["Name the two main aromatic compound families in Sauvignon Blanc and what each smells like.","<b>Thiols</b> — passionfruit, grapefruit pith, guava, boxwood/cat's-pee (the tropical, pungent side). <b>Pyrazines (methoxypyrazines)</b> — green pepper, cut grass, blackcurrant leaf, asparagus (the green, herbal side)."],
    ["Why does Marlborough smell more 'tropical' than Sancerre?","Marlborough's intense sunshine with cool nights builds high levels of <b>thiol precursors</b> in the grape, which winemaking then unlocks — producing pungent passionfruit/grapefruit aromas. Cooler, more restrained Sancerre develops fewer thiols and leans on citrus and minerality instead."],
    ["What is Pouilly-Fumé and how does it differ from Sancerre?","A Sauvignon Blanc appellation directly <b>across the Loire river from Sancerre</b>. The wines are very similar, but Pouilly-Fumé sits on more <b>flint (silex) soils</b> and is associated with a smoky, gunflint, 'struck-match' minerality — the 'fumé' (smoked) in the name."],
    ["What grape can a wine labelled 'Sancerre' be made from?","White Sancerre must be <b>100% Sauvignon Blanc</b>. (Red and rosé Sancerre, less common, are Pinot Noir — a useful trivia trap.)"],
    ["Grüner's white pepper comes from a specific compound. Name it and where else you'll meet it.","<b>Rotundone.</b> You'll meet it again in <b>Syrah</b> (Module 6), where it produces black-pepper character. Same molecule, two grapes."],
    ["Name the three Wachau ripeness levels, in order.","<b>Steinfeder</b> (lightest), <b>Federspiel</b> (medium, dry), <b>Smaragd</b> (ripest, fullest). Your Domäne Wachau bottle is a Federspiel."],
    ["Blind: passionfruit, grapefruit pith, cut grass, gooseberry; pronounced intensity. Where and what tier?","<b>Marlborough, New Zealand Sauvignon Blanc</b>, almost certainly a solid commercial-to-premium tier given the textbook pronounced thiol profile. The loud tropical-plus-grass signature is unmistakably Marlborough."],
    ["Blind: lemon, wet stone, white flowers, subtle blackcurrant leaf; restrained, medium+ intensity. Where and tier?","<b>Sancerre (or Pouilly-Fumé), Loire</b> — restrained citrus-and-mineral with quiet pyrazine. The restraint and flinty minerality point to a good-quality eastern Loire Sauvignon rather than the New World."],
    ["Why is Sancerre often a better goat-cheese match than Marlborough, at the compound level?","Sancerre's <b>high acid and mineral, less-aromatic profile</b> cuts the cheese's fat and complements its tang without clashing. Marlborough's pungent thiols and faint residual sugar can fight fresh goat cheese, where Sancerre's flinty restraint harmonises — and the classic regional pairing (Crottin de Chavignol is made next door) is no accident."],
    ["Blind: medium- colour, medium+ acid, dry, medium body; white pepper, lentil, citrus, faint herb; no oak. What is it?","<b>Grüner Veltliner</b> (likely Austrian, Wachau/Kamptal). White pepper (rotundone) plus lentil and a savoury non-pyrazine green edge, with no oak and bright acid, is the Grüner signature."]
  ],
  reading:[
    "<b>World Atlas of Wine</b> — Loire (Sancerre/Pouilly-Fumé), New Zealand (Marlborough), Austria (Wachau).",
    "<b>Wine Folly</b> — Sauvignon Blanc + Grüner Veltliner pages.",
    "<b>The Wine Bible</b> — Loire, New Zealand, and Austria chapters."
  ]
},

{
  id:"m4", nav:"Riesling & Chenin Blanc", navnum:"4", type:"module",
  title:"Riesling & Chenin Blanc — The Acid & Sugar Masterclass",
  deck:"The most transparent white grape there is, and the best teacher of how sweetness and acidity hold each other in tension — paired with its Loire counterpart, Chenin Blanc, which runs the same dry-to-sweet, age-forever gamut. Also: the grape that ages most magnificently, and smells of petrol while doing it.",
  tags:[["white","white"],["old","old world"],["new","new world"]],
  lesson:`
    <p class="lead">Riesling is wine's great balancing act. It can be bone dry or lusciously sweet, and — crucially — a sweet Riesling need not taste sweet, because Riesling's searing natural acidity holds sugar in suspension like a tightrope. Learning to taste <em>residual sugar against acid</em>, separately, is the skill this module builds, and it's one of the hardest and most valuable in all of tasting.</p>
    <p>Start in Germany's <strong>Mosel</strong>, on steep blue-slate slopes by a cold river. A Mosel <strong>Kabinett</strong> is low in alcohol (often 8–9%), off-dry, and electric with acid — lime, green apple, white flowers, and a wet-slate minerality. It tastes light and refreshing despite real sugar, because the acid is so high. This is the clearest demonstration of the sugar/acid tightrope you will ever taste.</p>
    <p>Germany's <strong>Prädikat</strong> scale ranks wines by grape ripeness at harvest: Kabinett → Spätlese ("late harvest") → Auslese ("select harvest") → and on into the dessert wines (Beerenauslese, Trockenbeerenauslese). Higher Prädikat means riper grapes and usually more sugar — but a wine can also be fermented fully dry (look for <em>Trocken</em>, or the top-dry designation <em>Grosses Gewächs / GG</em>). Confusingly, the scale measures ripeness, not final sweetness.</p>
    <p>Then cross to <strong>Alsace</strong>, where Riesling is typically <strong>dry, fuller-bodied, higher in alcohol</strong>, and more about citrus, orchard fruit, and a stony power than the featherweight Mosel style. And to the New World: a <strong>Niagara</strong> Riesling (Charles Baker is the benchmark) or a bone-dry <strong>Clare Valley</strong> Australian (lime-drenched, racy) shows how cool New World sites reinterpret the grape.</p>
    <div class="pull">As Riesling ages it develops a notorious aroma of petrol or kerosene — from a compound called TDN. It sounds like a fault; it's a prized sign of maturity. Don't be alarmed when you meet it.</div>
    <p>Riesling's closest parallel is the Loire's <strong>Chenin Blanc</strong> — another searingly high-acid white that runs the full gamut from bone-dry to lusciously sweet and ages for decades. In <strong>Vouvray</strong> it appears in every guise — <em>sec</em> (dry), <em>demi-sec</em> (off-dry), <em>moelleux</em> (sweet), even sparkling — because Chenin ripens so unevenly that a single bunch can hold grapes at different stages. In <strong>Savennières</strong> it's austere, bone-dry, and mineral. Its fingerprints are quince, yellow apple, chamomile, a waxy wet-wool/lanolin note, and honeyed richness with age; like Riesling, its racing acid lets the sweet versions taste fresh rather than cloying, and it too welcomes noble rot for great dessert wines. Taste a Vouvray beside the Mosel and you are comparing the two greatest exponents of the same sugar-against-acid balancing act.</p>
    <p>This is the grape that most rewards revisiting over time: a great Riesling evolves for years, and even across a few days you'll see it shift. One caveat — much of the world's best Riesling is screwcap (most Clare Valley, lots of Mosel and Niagara), so it can't be Coravin'd. With those, just recap and fridge and revisit over a few days; save the Coravin for any corked bottle. Pay attention to where the acid and the (possible) sugar each register, independently. That's the whole lesson.`,
  concepts:[
    ["The sugar/acid tightrope","Riesling's defining feature: high acidity balances residual sugar so a measurably sweet wine can taste fresh, even dry. Learn to feel each separately."],
    ["Prädikat scale","German ripeness ladder: Kabinett → Spätlese → Auslese → BA → TBA. Measures grape ripeness at harvest, not necessarily final sweetness."],
    ["Trocken / GG","'Trocken' = dry. 'Grosses Gewächs (GG)' = the top tier of dry German wine from the best vineyards. How to find serious dry German Riesling."],
    ["TDN / petrol","The compound (1,1,6-trimethyl-1,2-dihydronaphthalene) behind aged Riesling's petrol/kerosene note. A marker of maturity, not a fault."],
    ["Slate minerality","The Mosel's blue/grey slate is linked to the wines' wet-stone, flinty cut and is part of why they feel so light and mineral."],
    ["Chenin Blanc","The Loire's great high-acid white. Vouvray spans sec (dry) → demi-sec → moelleux (sweet) → sparkling; Savennières is bone-dry and mineral. Quince, chamomile, wet wool, honeyed with age — and, like Riesling, ages superbly and balances sugar against acid."]
  ],
  taste:[
    "<b>Sugar against acid:</b> in the Mosel Kabinett, register the sweetness on your tongue-tip, then the acid on the sides — feel them as two separate forces.",
    "<b>Dry vs. off-dry:</b> set the Alsace (dry) beside the Mosel (off-dry). The Alsace is fuller, warmer, less obviously sweet.",
    "<b>Alcohol & body shift:</b> Mosel ≈8–9% and light; Alsace ≈12–13% and full. Feel the weight difference.",
    "<b>New World racing acid:</b> the Niagara or Clare Valley should be bone-dry and lime-drenched.",
    "<b>Hunt for petrol:</b> if any bottle has a few years on it, look for the TDN kerosene note as it warms."
  ],
  wines:[
    ["🥂","Mosel Kabinett (Selbach-Oster, Dr. Loosen, J.J. Prüm)","Mosel, Germany · ~$25","The tightrope reference: low alcohol, off-dry, electric acid, wet slate. The clearest sugar/acid lesson in wine.","white"],
    ["🥂","Trimbach or Willm Riesling","Alsace, France · ~$25–30","Dry, fuller-bodied, higher alcohol — the Alsace counterpoint. Your Willm Pinot Gris can join to show Alsace style across grapes.","white"],
    ["🥂","Charles Baker Picone Vineyard Riesling","Niagara, Ontario · ~$35","Niagara's benchmark — bone-dry, age-worthy, the closest the New World comes to serious Mosel/Alsace. Best bought in Niagara.","white"],
    ["🥂","Knappstein Clare Valley Riesling","South Australia · ~$19","Bone-dry, racy, lime-and-apple. A New World dry contrast — and excellent value (95 pts).","white"],
    ["🥂","Vouvray (Huet, Champalou) — sec or demi-sec","Loire, France · ~$25–35","Chenin Blanc at home: quince, apple, chamomile, wet wool. Demi-sec shows the sugar/acid tightrope; sec shows the dry, mineral side.","white"],
    ["🥂","Savennières (Loire) — dry Chenin","Loire, France · ~$30–40","Bone-dry, austere, mineral Chenin — the grape's serious, age-worthy face, and a direct dry counterpoint to Vouvray.","white"]
  ],
  sessions:[
    {tag:"Session A · the tightrope",title:"Mosel vs. Alsace",steps:[
      "Two glasses at ≈9°C, 50ml each. The off-dry Mosel and the dry Alsace.",
      "On the Mosel: locate sweetness (tip) and acid (sides) as two distinct sensations. Rate each.",
      "On the Alsace: note the fuller body, higher alcohol warmth, drier finish.",
      "Decide which you prefer and articulate why in structural terms, not just 'nicer.'"
    ],tip:"If you can't feel the Mosel's sugar at all, that's the acid doing its job — measure it by the wine's roundness, not obvious sweetness."},
    {tag:"Session B · New World",title:"Niagara and/or Clare Valley",steps:[
      "Pour the bone-dry New World Riesling(s). Full framework.",
      "Compare the acid to the Mosel's — both high, but the New World versions are dry, so the acid feels more exposed.",
      "Note the fruit register: lime and green apple dominate cool New World Riesling."
    ],tip:"These dry Rieslings are mostly screwcap (Clare Valley almost always, Niagara often), so don't Coravin them — recap and fridge, and revisit over the next few days. Riesling shows its evolution faster than almost any white, so even that short window reveals plenty."}
  ],
  quiz:[
    ["How can a measurably sweet Riesling taste dry?","Its <b>very high acidity offsets the residual sugar</b> — the two balance on the palate so the wine reads as fresh and even crisp rather than sweet. Perceived sweetness is a ratio of sugar to acid, not sugar alone."],
    ["Put the core Prädikat levels in order and say what the scale measures.","<b>Kabinett → Spätlese → Auslese → Beerenauslese → Trockenbeerenauslese.</b> The scale measures <b>grape ripeness (sugar at harvest)</b>, not the final sweetness of the wine — a Spätlese can be made dry."],
    ["What do 'Trocken' and 'GG' tell you?","<b>Trocken</b> means the wine is fermented <b>dry</b>. <b>Grosses Gewächs (GG)</b> is the <b>top tier of dry German wine</b> from classified grand-cru-equivalent vineyards. Both signal you're getting a serious dry Riesling, not an off-dry one."],
    ["A 10-year-old Riesling smells of kerosene. Fault or feature, and what causes it?","<b>Feature.</b> It's <b>TDN</b>, a compound that accumulates with bottle age (and more in warm, sunny vintages), producing the prized petrol/kerosene note that signals mature Riesling."],
    ["Why is Mosel Riesling so low in alcohol compared to Alsace?","The Mosel is <b>cooler</b>, so grapes accumulate less sugar; producers also often <b>stop fermentation early</b>, leaving residual sugar and converting less sugar to alcohol — yielding 8–9% off-dry wines. Warmer Alsace ripens grapes fully and ferments dry, reaching 12–13%."],
    ["Blind: 8.5% ABV, off-dry, very high acid, lime/green apple/wet slate, light body. Where and what style?","A <b>Mosel Kabinett</b> (German Riesling). The combination of very low alcohol, off-dry sweetness held by racing acid, slate minerality, and feather-light body is the Mosel signature."],
    ["Blind: 13% ABV, bone dry, full body, high acid, citrus/orchard/stone, faint petrol. Where?","A <b>dry Alsace Riesling</b> (or a GG-level dry German). The full body, higher alcohol, dryness, and power point to Alsace over the Mosel."]
  ],
  reading:[
    "<b>World Atlas of Wine</b> — Germany (Mosel especially) and Alsace.",
    "<b>Wine Folly</b> — Riesling page; the German labelling explainer.",
    "<b>The Wine Bible</b> — Germany and Alsace chapters."
  ]
},

{
  id:"m5", nav:"Pinot Noir", navnum:"5", type:"module",
  title:"Pinot Noir — The Transparency Grape",
  deck:"The thin-skinned, pale, heartbreaking grape that transmits the place it grew more faithfully than any other. This is the module where terroir stops being a word and becomes a taste.",
  tags:[["new","new world"],["old","old world"]],
  lesson:`
    <p class="lead">Pinot Noir is the grape that made the idea of terroir famous. Thin-skinned and pale, it makes wines low in tannin and colour but high in aromatic detail — and because it adds so little of its own loud personality, it acts like a clear pane of glass for the soil, slope, and climate behind it. Two Pinots from vineyards a few hundred metres apart can taste genuinely different. No other grape does this so dramatically.</p>
    <p>Its homeland is <strong>Burgundy's Côte d'Or</strong>, a thin strip of limestone slope where the appellation hierarchy is the most fine-grained in the world. It runs <strong>regional</strong> (Bourgogne Rouge) → <strong>village</strong> (Gevrey-Chambertin, Volnay, Pommard) → <strong>Premier Cru</strong> → <strong>Grand Cru</strong>, with price and site-specificity climbing at each rung. The northern half, the Côte de Nuits, makes the most powerful, structured, age-worthy Pinots; the southern Côte de Beaune tends to elegance.</p>
    <p>What does Pinot taste like? Red fruit above all — strawberry, raspberry, red cherry — plus floral notes (rose, violet), and as it ages, an unmistakable savoury, earthy, even gamey complexity: forest floor, mushroom, dried leaves, sous-bois. Tannin is light to medium; acid is usually high; colour is pale ruby that bricks early. If a "red wine" is so pale you can read through it yet grips with fine tannin and smells of cherries and earth, suspect Pinot or Nebbiolo.</p>
    <div class="pull">Two winemaking levers to taste for: new oak (vanilla and spice, used carefully in good Pinot) and whole-cluster fermentation (including the stems, which adds a green, peppery, structural lift).</div>
    <p>Your New World foils show how cooler sites elsewhere reinterpret the grape. <strong>Central Otago</strong> (New Zealand) gives riper, darker, more black-cherry-and-thyme Pinot with more flesh. <strong>Niagara</strong> — Bachelder, Hidden Bench, Pearl Morissette — sits climatically close to Burgundy and aims for that same red-fruit-and-earth restraint. The <strong>Marchand-Tawse</strong> Bourgogne you can buy is a lovely bridge: a real Burgundy made by a team with Niagara roots. Set a village Burgundy beside a Niagara Pinot and ask: what's the grape, and what's the place?`,
  concepts:[
    ["Terroir","The sum of site — soil, slope, aspect, microclimate — expressed in the wine. Pinot Noir transmits it more transparently than any other grape."],
    ["Burgundy hierarchy","Regional → Village → Premier Cru → Grand Cru. The world's most detailed vineyard ranking; each step up is a smaller, better-sited parcel."],
    ["Côte de Nuits vs. Beaune","The two halves of the Côte d'Or. Nuits (north) = power and structure; Beaune (south) = elegance and finesse (and most of the great whites)."],
    ["Whole-cluster fermentation","Fermenting with the stems included. Adds green/peppery aromatics, fine tannin, and a structural lift. A key stylistic 'tell.'"],
    ["Sous-bois","French for 'undergrowth' — the forest-floor, mushroom, damp-earth aroma of mature Pinot. A prized tertiary note."]
  ],
  taste:[
    "<b>The pale-but-gripping paradox:</b> note how see-through the colour is, yet there's real fine tannin and acid. That's the Pinot/Nebbiolo signature.",
    "<b>Red fruit + floral:</b> strawberry, raspberry, red cherry, rose/violet — the primary core.",
    "<b>Earth & savour:</b> hunt forest floor, mushroom, dried leaves — more present in the Burgundy, especially with age.",
    "<b>Whole-cluster tell:</b> a green, peppery, almost herbal lift on top of the fruit suggests stem inclusion.",
    "<b>Old vs. New World:</b> Burgundy leans tart red fruit and earth; Central Otago leans riper dark cherry and herb."
  ],
  wines:[
    ["🍷","Village or regional Burgundy (Marchand-Tawse, Marsannay, Mercurey)","Burgundy, France · ~$35–50","The reference. The Marchand-Tawse Bourgogne Rouge (~$49) is a perfect choice — a real Burgundy with a Niagara connection."],
    ["🍷","Bachelder, Hidden Bench, or Pearl Morissette Pinot","Niagara, Ontario · ~$40–80","The cool-climate New World comparator, aiming squarely at Burgundian restraint. Best bought in Niagara."],
    ["🍷","Central Otago Pinot Noir","New Zealand · ~$35–45","The riper New World foil — darker fruit, more flesh, thyme and spice. Shows how a sunnier cool site reshapes the grape."]
  ],
  sessions:[
    {tag:"Session A · place vs. grape",title:"Burgundy vs. Niagara",steps:[
      "Two glasses at ≈16°C, 50ml each. Cool, not warm — Pinot's aromatics die when hot.",
      "Note the pale colour on both; predict which is the Burgundy from hue alone.",
      "Nose for the shared grape signature (red fruit, florals) vs. the differing place (Burgundy earth vs. Niagara fruit-purity).",
      "Taste: both should be high-acid, light-to-medium tannin. Find what's grape and what's site."
    ],tip:"Write down which is which before checking. Old World vs. New World Pinot is one of the classic blind-tasting calls — practise it here."},
    {tag:"Session B · the riper foil",title:"Add Central Otago",steps:[
      "Coravin a shot of the Burgundy and Niagara, and pour the Central Otago fresh.",

  quiz:[
    ["Why is Pinot Noir called the 'transparency grape'?","Because it's <b>low in its own tannin, colour, and overpowering flavour</b>, so it transmits the character of its site — soil, slope, climate — more faithfully than bolder grapes. The place shows through the grape like light through glass."],
    ["Put the Burgundy hierarchy in order and define the top rung.","<b>Regional (Bourgogne) → Village → Premier Cru → Grand Cru.</b> Grand Cru is the top: a small number of historically exceptional individual vineyards, bottled under the vineyard's own name."],
    ["Côte de Nuits vs. Côte de Beaune — what's the broad difference?","The <b>Côte de Nuits</b> (north) makes the most powerful, structured, age-worthy <b>reds</b>; the <b>Côte de Beaune</b> (south) makes more elegant reds and the majority of Burgundy's great <b>whites</b>."],
